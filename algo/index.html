<!DOCTYPE html>
<html lang="fr">

<style>
:root{
  color-scheme:light;
  --paper:#f4f2ec; --sheet:#fffefb; --sheet-2:#f8f6f1;
  --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;
  --rule:#e4e0d6; --rule-strong:#cdc8bb;
  --pen:#2446c8; --pen-hover:#1c389f; --pen-ink:#ffffff; --pen-soft:#eaeefc; --pen-line:#bccaf5;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --bad:#c2352b; --bad-soft:#fbeceb; --warn:#9a5b00; --warn-soft:#fcf2da;
  --algo:#7c3aed; --algo-soft:#f1eafe;
  --code-bg:#f6f4ee;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px -18px rgba(28,27,25,.25);
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
    --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
    --rule:#2e2d2a; --rule-strong:#45433e;
    --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340; --pen-line:#34437a;
    --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
    --algo:#a78bfa; --algo-soft:#241b3a; --code-bg:#16161a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
  --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --rule:#2e2d2a; --rule-strong:#45433e;
  --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340; --pen-line:#34437a;
  --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
  --algo:#a78bfa; --algo-soft:#241b3a; --code-bg:#16161a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none !important}
code,.mono{font-family:var(--mono);font-size:.92em}
p code,li code,.sub code{background:var(--code-bg);padding:1px 5px;border-radius:5px;border:1px solid var(--rule)}
pre.code{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--code-bg);border:1px solid var(--rule);overflow-x:auto;font:14px/1.55 var(--mono);white-space:pre}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 24px;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--algo);color:#fff;display:grid;place-items:center;font:700 14px/1 var(--mono)}
.brand strong{display:block;font:600 15px/1.2 var(--sans)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:500 14px/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--sheet-2)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer}
.clock{font:800 22px/1 var(--sans);font-variant-numeric:tabular-nums}
.clock.rush{color:var(--bad)}
main{max-width:980px;margin:32px auto 90px;padding:0 24px;display:grid;gap:20px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--algo);margin-bottom:10px}
h1{font:600 clamp(28px,4.6vw,42px)/1.08 var(--serif);letter-spacing:-.02em}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:700px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px;min-width:0}
.card h2{font:600 21px/1.25 var(--serif)}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.fine{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn-primary:hover:not(:disabled){background:var(--pen-hover)}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:600 12.5px/1 var(--sans);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.part{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font:800 clamp(40px,7vw,58px)/1 var(--sans);letter-spacing:-.04em;color:var(--algo);font-variant-numeric:tabular-nums}
.count span{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* exercices */
.ex .q{font:17px/1.6 var(--serif);margin-top:8px}
.items{display:grid;gap:12px;margin-top:16px}
.it{display:grid;grid-template-columns:fit-content(45%) minmax(0,1fr);gap:4px 12px;align-items:center}
.it-lab{text-align:right;font:15px/1.3 var(--mono);overflow-wrap:anywhere}
.it-lab.w{font:15px/1.3 var(--sans)}
.it-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.it-in input[type=text]{flex:1;min-width:0;width:100%;font:15px/1.3 var(--mono);color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:9px;padding:9px 12px;min-height:42px}
.it.full{grid-template-columns:minmax(0,1fr)}
.it.full .fb{grid-column:1}
textarea.codein{width:100%;min-height:190px;resize:vertical;font:14px/1.55 var(--mono);color:var(--ink);background:var(--code-bg);border:1px solid var(--rule-strong);border-radius:10px;padding:12px 14px;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto}
textarea.out{min-height:70px}
.fb{grid-column:2;font-size:14px;color:var(--ink-2);min-width:0;overflow-x:auto}
.fb:empty{display:none}
.tests{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font:13px/1.4 var(--mono)}
.tests li{padding:6px 10px;border-radius:8px;background:var(--sheet-2);border:1px solid var(--rule);overflow-x:auto;white-space:pre}
.tests li.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tests li.ko{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}
.ch{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);cursor:pointer;font-family:var(--mono);font-size:14px}
.ch:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.ch input{accent-color:var(--pen);margin:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
details.corr{margin-top:14px}
details.corr>summary{cursor:pointer;font:600 14px/1 var(--sans);color:var(--pen);padding:6px 0}
.expl{margin-top:8px;padding:14px 18px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule);font:16px/1.6 var(--serif);overflow-x:auto}
.expl p+p{margin-top:8px}
.strip{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--algo-soft);border:1px solid color-mix(in srgb,var(--algo) 35%,transparent)}
.strip b{font:600 17px/1.3 var(--serif)}
.lvl{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)} .lvl i.on{background:var(--algo)}
.tag-rev{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:600 11.5px/1 var(--sans)}
.res{border-color:color-mix(in srgb,var(--pen) 40%,transparent)}
.psk{display:grid;grid-template-columns:24px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.psk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.psk.val .ic{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.psk.cur .ic{background:var(--algo);color:#fff;border-color:transparent}
.psk.rev .ic{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.psk.lock{opacity:.5}
.psk .nm small{display:block;color:var(--muted);font-size:12.5px}
.pch h3{font:600 17px/1.3 var(--serif);margin:16px 0 4px}
/* cours */
.fiche{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.fiche>summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;cursor:pointer;list-style:none;font:600 18px/1.3 var(--serif)}
.fiche>summary::-webkit-details-marker{display:none}
.fiche>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.fiche[open]>summary::before{transform:rotate(90deg)}
.fiche>summary .tag{margin-left:auto;font:600 11.5px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--algo-soft);color:var(--algo)}
.fiche .body{padding:4px 24px 22px;border-top:1px solid var(--rule);font:16.5px/1.65 var(--serif)}
.fiche .body p,.fiche .body ul{margin-top:10px}
.fiche .body ul{padding-left:22px}
.fiche h4{font:700 11.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:20px}
.box{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.box.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.box.key{background:var(--algo-soft);border-color:color-mix(in srgb,var(--algo) 30%,transparent)}
.box h5{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;color:var(--ink-2)}
table.t{border-collapse:collapse;margin-top:10px;font:14px/1.4 var(--sans)}
table.t td,table.t th{border:1px solid var(--rule);padding:5px 10px;text-align:left}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);font:500 13.5px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.score{font:800 clamp(48px,9vw,72px)/1 var(--sans);letter-spacing:-.03em}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--rule);text-align:left}
.pyload{font-size:13.5px;color:var(--ink-2)}
code,pre,.mono,.it-lab,.ch,textarea,input,.tests{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
@media (max-width:760px){
  .topbar{padding:8px 16px}
  .brand small{display:none}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  main{padding:0 16px;margin-top:22px}
  .card{padding:18px}
  .grid2{grid-template-columns:1fr}
  .it{grid-template-columns:1fr}
  .it-lab{text-align:left}
  .fb{grid-column:1}
  .psk{grid-template-columns:24px minmax(0,1fr) auto} .psk .bar{display:none}
  pre.code{font-size:13px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>

<script>
(function () {
'use strict';
/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } if (window.SiteAccount) SiteAccount.touch(k); }
};
let toastT = 0;
function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3500); }
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const G = R => ({ int: (a, b) => a + Math.floor(R() * (b - a + 1)), pick: a => a[Math.floor(R() * a.length)], shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }, r: R });
const newSeed = () => Math.floor(Math.random() * 4294967296);
const pre = code => `<pre class="code"><code>${esc(code)}</code></pre>`;
const ic = s => `<code>${esc(s)}</code>`;

/* =====================================================================
   VALEURS PYTHON : représentation, affichage, lecture d'une réponse
   ===================================================================== */
class PF { constructor(v) { this.v = v; } }            // un float Python (2.0 s'affiche « 2.0 »)
const ERR = { err: true };                               // « le programme s'arrête sur une erreur »
const pyStr = s => "'" + String(s).replace(/'/g, "\\'") + "'";
function pyRepr(v) {
  if (v === ERR) return 'Erreur';
  if (v instanceof PF) return Number.isInteger(v.v) ? v.v.toFixed(1) : String(+v.v.toPrecision(12));
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') return pyStr(v);
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (v === null || v === undefined) return 'None';
  if (Array.isArray(v)) return '[' + v.map(pyRepr).join(', ') + ']';
  return '{' + Object.keys(v).map(k => pyStr(k) + ': ' + pyRepr(v[k])).join(', ') + '}';
}
const pyType = v => v === ERR ? 'Erreur' : v instanceof PF ? 'float' : typeof v === 'number' ? 'int' : typeof v === 'string' ? 'str' : typeof v === 'boolean' ? 'bool' : Array.isArray(v) ? 'list' : 'dict';
// lecture d'une valeur Python tapée par l'élève : [1, 2], {'a': 3}, 'mot', 2.5, True
function pyParse(src) {
  const s = String(src).trim(); let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  function val() {
    ws(); const c = s[i];
    if (c === '[' || c === '(') { const close = c === '[' ? ']' : ')'; i++; const a = []; ws(); if (s[i] === close) { i++; return a; } for (;;) { a.push(val()); ws(); if (s[i] === ',') { i++; ws(); if (s[i] === close) { i++; return a; } continue; } if (s[i] === close) { i++; return a; } throw 0; } }
    if (c === '{') { i++; const o = {}; ws(); if (s[i] === '}') { i++; return o; } for (;;) { const k = val(); ws(); if (s[i] !== ':') throw 0; i++; o[String(k instanceof PF ? k.v : k)] = val(); ws(); if (s[i] === ',') { i++; ws(); if (s[i] === '}') { i++; return o; } continue; } if (s[i] === '}') { i++; return o; } throw 0; } }
    if (c === "'" || c === '"') { i++; let r = ''; while (i < s.length && s[i] !== c) { if (s[i] === '\\') { i++; } r += s[i++]; } if (s[i] !== c) throw 0; i++; return r; }
    const m = /^-?\d+(\.\d*)?([eE]-?\d+)?/.exec(s.slice(i)); if (m) { i += m[0].length; return m[1] || m[2] ? new PF(parseFloat(m[0])) : parseInt(m[0], 10); }
    for (const [w, v] of [['True', true], ['False', false], ['None', null]]) if (s.startsWith(w, i)) { i += w.length; return v; }
    throw 0;
  }
  try { const v = val(); ws(); if (i !== s.length) return undefined; return v; } catch (e) { return undefined; }
}
function same(a, b) {
  if (a instanceof PF) a = a.v; if (b instanceof PF) b = b.v;
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 1e-9;
  if (Array.isArray(a) || Array.isArray(b)) return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((x, k) => same(x, b[k]));
  if (a && b && typeof a === 'object' && typeof b === 'object') { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => k in b && same(a[k], b[k])); }
  return a === b;
}
const isErrWord = s => /^\s*(erreur|error|\w*error)\b/i.test(s);
const normOut = s => String(s).replace(/\r/g, '').split('\n').map(l => l.trim().replace(/\s+/g, ' ')).filter((l, k, a) => l || k < a.length - 1).join('\n').trim();

/* =====================================================================
   GÉNÉRATEURS D'EXERCICES (prédire, puis écrire du code)
   item : { type: 'choice'|'int'|'val'|'out'|'code', label, ... }
   ===================================================================== */
const TYPE_OPTS = ['int', 'float', 'bool', 'str', 'Erreur'].map(x => ({ v: x, t: x }));

GEN.list = (d, g) => {
  const t = Array.from({ length: g.int(4, 6) }, () => g.int(0, 9)), n = t.length;
  const Q = [];
  if (d === 0) {
    const i = g.int(0, n - 1), x = g.int(0, 9);
    Q.push([`t[${i}]`, t[i]], [`len(t)`, n], [`${x} in t`, t.includes(x)], [`t + [${x}]`, [...t, x]], [`2 * [${t[0]}, ${t[1]}]`, [t[0], t[1], t[0], t[1]]]);
  } else if (d === 1) {
    const a = g.int(0, 2), b = g.int(a + 1, n);
    Q.push([`t[${a}:${b}]`, t.slice(a, b)], [`t[${a + 1}:]`, t.slice(a + 1)], [`t[:${b}]`, t.slice(0, b)], [`t[-1]`, t[n - 1]]);

  }

/* =====================================================================
   PYTHON DANS LE NAVIGATEUR (Pyodide, dans un Worker : une boucle infinie ne bloque pas la page)
   ===================================================================== */
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const HARNESS = [
  'import json, io, contextlib',
  '__ns = {}',
  '__err = None',
  'try:',
  '    with contextlib.redirect_stdout(io.StringIO()):',
  '        exec(__user_code, __ns)',
  'except Exception as e:',
  '    __err = type(e).__name__ + ": " + str(e)',
  '__res = []',
  'if __err is None:',
  '    for t in json.loads(__tests_json):',
  '        try:',
  '            with contextlib.redirect_stdout(io.StringIO()):',
  '                got = eval(t[0], __ns)',
  '            exp = eval(t[1])',
  '            ok = (abs(got - exp) < 1e-9) if isinstance(exp, float) and isinstance(got, (int, float)) else (got == exp and type(got) == type(exp))',
  '            __res.append([t[0], ok, repr(got), repr(exp)])',
  '        except Exception as e:',
  '            __res.append([t[0], False, type(e).__name__ + ": " + str(e), t[1]])',
  'json.dumps({"err": __err, "tests": __res})'
].join('\n');
const WORKER_SRC = `importScripts('${PYODIDE}pyodide.js');
let ready = null;
self.onmessage = async (e) => {
  const { id, code, tests, harness } = e.data;
  try {
    if (!ready) ready = loadPyodide({ indexURL: '${PYODIDE}' });
    const py = await ready;
    py.globals.set('__user_code', code); py.globals.set('__tests_json', JSON.stringify(tests));
    const out = py.runPython(harness);
    self.postMessage({ id, ok: true, res: JSON.parse(out) });
  } catch (err) { self.postMessage({ id, ok: false, err: String(err) }); }
};`;
let worker = null, pyWarm = false, reqId = 0;
const pending = new Map();
function makeWorker() {
  worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })));
  worker.onmessage = e => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); clearTimeout(p.t); pyWarm = true; p.resolve(e.data); } };
}
function runPy(code, tests) {
  if (!worker) makeWorker();
  const id = ++reqId, limit = pyWarm ? 8000 : 90000;
  return new Promise(resolve => {
    const t = setTimeout(() => { const warm = pyWarm; pending.delete(id); worker.terminate(); worker = null; pyWarm = false; resolve({ ok: false, err: warm ? 'LONG' : 'TIMEOUT' }); }, limit);
    pending.set(id, { resolve, t });
    worker.postMessage({ id, code, tests, harness: HARNESS });
  });
}

/* =====================================================================
   VÉRIFICATION DES RÉPONSES
   ===================================================================== */
function checkSync(it, raw) {
  raw = raw == null ? '' : String(raw);
  if (it.type === 'choice') return raw ? { st: raw === it.ans ? 'ok' : 'bad' } : { st: 'empty' };
  if (it.type === 'int') { const s = raw.trim().replace(/\s/g, '').replace('−', '-'); if (!s) return { st: 'empty' }; if (!/^[-+]?\d+$/.test(s)) return { st: 'err', msg: 'écris un nombre entier' }; return { st: +s === it.val ? 'ok' : 'bad' }; }
  if (it.type === 'out') {
    if (!raw.trim()) return { st: 'empty' };
    if (it.exp === ERR) return { st: isErrWord(raw) ? 'ok' : 'bad' };
    return { st: normOut(raw) === normOut(it.exp) ? 'ok' : 'bad', msg: isErrWord(raw) ? 'ce programme ne provoque pas d\'erreur.' : '' };
  }
  if (it.type === 'val') {
    if (!raw.trim()) return { st: 'empty' };
    const e = it.exp;
    if (typeof e === 'string') { const r = raw.trim(), un = /^(['"])([\s\S]*)\1$/.exec(r); if ((un ? un[2] : r) === e) return { st: 'ok' }; }
    if (typeof e === 'boolean') return { st: /^(true|vrai)$/i.test(raw.trim()) === e && /^(true|false|vrai|faux)$/i.test(raw.trim()) ? 'ok' : 'bad' };
    const v = pyParse(raw);
    if (v === undefined) return typeof e === 'string' ? { st: 'bad' } : { st: 'err', msg: 'écris une valeur Python, par exemple [1, 2], {\'a\': 3} ou 4.5' };
    return { st: same(v, e) ? 'ok' : 'bad' };
  }
  return { st: 'empty' };
}
async function check(it, raw) {

  ['1. Types, opérateurs et conversions', 'type et valeur', `<p>Quatre types de base : <code>int</code> (entiers), <code>float</code> (réels), <code>bool</code> (<code>True</code> / <code>False</code>, avec majuscule), <code>str</code> (chaînes). En Python on ne déclare pas le type : il dépend de la valeur.</p>
    <table class="t"><tr><th>Opération</th><th>Exemple</th><th>Résultat</th></tr><tr><td>division</td><td><code>9 / 3</code></td><td><code>3.0</code> (toujours un float)</td></tr><tr><td>division entière</td><td><code>13 // 2</code></td><td><code>6</code></td></tr><tr><td>reste (modulo)</td><td><code>13 % 2</code></td><td><code>1</code></td></tr><tr><td>puissance</td><td><code>2 ** 10</code></td><td><code>1024</code></td></tr><tr><td>concaténation</td><td><code>'Le' + 'chat'</code></td><td><code>'Lechat'</code></td></tr><tr><td>répétition</td><td><code>3 * 'ab'</code></td><td><code>'ababab'</code></td></tr></table>
    <ul><li>Conversions : <code>float(3)</code> → <code>3.0</code>, <code>int(5.6)</code> → <code>5</code> (tronque), <code>int('35')</code> → <code>35</code>, <code>str(9.64)</code> → <code>'9.64'</code>.</li><li>Logique : <code>and</code>, <code>or</code>, <code>not</code> ; comparaisons <code>==</code>, <code>!=</code>, <code>&lt;</code>…</li><li>Chaînes comparées dans l'ordre du dictionnaire, caractère par caractère : <code>'zebre' &lt; 'lion'</code> est <code>False</code>, <code>'10' &lt; '9'</code> est <code>True</code>, majuscules avant minuscules.</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Pour chaque expression : évaluer de l'intérieur vers l'extérieur, noter le type à chaque étape. <code>str(4+5)</code> = <code>'9'</code> mais <code>str(4)+str(5)</code> = <code>'45'</code>.</div>
    <div class="box warn"><h5>Pièges</h5><code>'3+3=' + 6</code> → erreur (on n'additionne pas une chaîne et un entier) · <code>/</code> donne un float même si la division tombe juste · ne jamais tester l'égalité de deux floats avec <code>==</code>.</div>`],
  ['2. Conditions, boucles et entrées-sorties', 'trace, boucles', `<ul><li><code>input()</code> renvoie toujours une <b>chaîne</b> : <code>x = int(input())</code> pour un entier. <code>print(a, b)</code> affiche plusieurs valeurs séparées par un espace.</li><li><code>if</code> / <code>elif</code> / <code>else</code> : le bloc est défini par l'<b>indentation</b> (4 espaces), après les <code>:</code>.</li><li><code>while condition:</code> répète tant que la condition est vraie : le corps doit finir par la rendre fausse, sinon boucle infinie.</li><li><code>for i in range(deb, fin):</code> → i = deb, deb + 1, …, <b>fin − 1</b> (borne exclue). <code>range(n)</code> = 0 … n − 1.</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Suivre un programme à la main : un tableau avec une colonne par variable et une ligne par instruction (ou par tour de boucle). C'est la question « que calcule / qu'affiche » du poly (exercices 8 à 13).</div>
    <div class="box warn"><h5>Pièges</h5>L'échange de deux variables a besoin d'une variable auxiliaire (<code>c = a ; a = b ; b = c</code>), sinon on perd une valeur · une boucle <code>while</code> sur <code>n % 2 == 0</code> ne s'arrête jamais si n vaut 0 (exercice 13).</div>`],
  ['3. Fonctions et portée des variables', 'fonctions', `<pre class="code"><code>def perimetre(rayon):
    """Périmètre d'un cercle de rayon donné (rayon ≥ 0)."""
    p = 2 * 3.14 * rayon
    return p</code></pre>
    <ul><li>Une fonction a une <b>signature</b> (nom + paramètres formels) et un <b>corps</b>. À l'appel, on lui passe des paramètres effectifs : <code>peri = perimetre(5)</code>.</li><li><code>return</code> renvoie une valeur à l'appelant ; sans <code>return</code>, la fonction renvoie <code>None</code>.</li><li>Les variables créées dans une fonction (et ses paramètres) sont <b>locales</b> : elles n'existent pas dehors (NameError).</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Distinguer « afficher » (<code>print</code>) et « renvoyer » (<code>return</code>) : quand on demande une fonction qui renvoie, on n'affiche rien.</div>
    <div class="box warn"><h5>Pièges</h5>Un paramètre entier modifié dans la fonction ne change pas la variable de l'appelant ; une <b>liste</b> modifiée (<code>append</code>, <code>t[i] = …</code>) l'est, car c'est la même liste · ne jamais utiliser de variable globale dans une fonction.</div>`],
  ['4. Complexité', 'complexité', `<p>On compte les opérations élémentaires (affectations, calculs, comparaisons) en fonction de la taille n de l'entrée, dans le <b>pire cas</b>, et on ne garde que le terme dominant sans constante : T(n) = 3n² + 5n + 2 → <b>O(n²)</b>.</p>
    <table class="t"><tr><th>Code typique</th><th>Complexité</th></tr><tr><td>quelques instructions, pas de boucle dépendant de n</td><td>O(1) constante</td></tr><tr><td><code>while n &gt; 0: n = n // 2</code></td><td>O(log n) logarithmique</td></tr><tr><td>une boucle de n tours</td><td>O(n) linéaire</td></tr><tr><td>deux boucles imbriquées</td><td>O(n²) quadratique</td></tr><tr><td>trois boucles imbriquées</td><td>O(n³)</td></tr><tr><td>essayer tous les sous-ensembles</td><td>O(2ⁿ) exponentielle</td></tr></table>
    <div class="box key"><h5>À savoir faire</h5>Boucles <b>imbriquées</b> : on multiplie. Boucles <b>successives</b> : on additionne (donc on garde la plus grosse). Une fonction appelée dans une boucle compte avec son propre coût (exemple du cours : appeler <code>u(k)</code>, qui coûte k, pour k = 0 … n donne O(n²)).</div>
    <div class="box warn"><h5>Pièges</h5><code>for j in range(i)</code> dans <code>for i in range(n)</code> : n(n − 1)/2, c'est quand même O(n²) · une boucle de 100 tours fixes est O(1).</div>`],
  ['5. Tableaux (listes)', 'listes, copies', `<ul><li>Création : <code>t = [1, 3, 5]</code>, <code>t = n * [0]</code>, <code>t = []</code> puis <code>t.append(x)</code>, ou en compréhension <code>[i ** 2 for i in range(n)]</code>.</li><li>Accès : <code>t[i]</code> pour i de 0 à <code>len(t) − 1</code> ; <code>t[-1]</code> = dernier élément.</li><li>Tranches : <code>t[a:b]</code> = indices a à b − 1 ; <code>t[a:]</code>, <code>t[:b]</code>. Une tranche est une nouvelle liste.</li><li><code>t1 + t2</code> concatène ; <code>x in t</code> teste l'appartenance ; <code>del t[i]</code> supprime ; <code>t.append(x)</code> ajoute un élément ; <code>t.extend([…])</code> ajoute plusieurs éléments.</li><li>Parcours : <code>for x in t</code> (valeurs), <code>for i in range(len(t))</code> (indices), <code>for i, x in enumerate(t)</code> (les deux).</li><li>Matrice = liste de lignes : <code>m[i][j]</code>, <code>len(m)</code> lignes, <code>len(m[0])</code> colonnes.</li></ul>
    <div class="box warn"><h5>Piège n° 1 : les copies</h5><code>y = x</code> ne copie pas la liste, seulement son adresse : modifier y modifie x. Copier : <code>y = list(x)</code> ou <code>y = x[:]</code>. Pour une liste de listes, il faut copier chaque ligne : <code>[list(l) for l in x]</code> (exercice 29).</div>`],
  ['6. Chaînes de caractères et tuples', 'chaînes', `<ul><li>Une chaîne se manipule comme une liste de lettres (<code>s[i]</code>, <code>s[a:b]</code>, <code>len(s)</code>, <code>for c in s</code>) mais on ne peut pas la modifier.</li><li><code>'sep'.join(liste)</code> recolle une liste de chaînes ; <code>s.split(',')</code> découpe ; <code>list(s)</code> donne la liste des lettres.</li><li>Caractères spéciaux : <code>\\n</code> (saut de ligne), <code>\\t</code> (tabulation), <code>\\'</code>.</li><li>Tuple : <code>(7, 2, 9)</code>, non modifiable ; pratique pour renvoyer plusieurs valeurs : <code>return (a, b)</code>.</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Pour « modifier » une chaîne : <code>l = list(s)</code>, modifier l, puis <code>''.join(l)</code>.</div>`],
  ['7. Dictionnaires', 'dictionnaires', `<pre class="code"><code>d = {"Julien": 18, "Virginie": 19}
d["Chloe"] = 21          # ajout
d["Julien"] = d["Julien"] + 1   # modification
print(len(d), "Chloe" in d)     # 3 True
for c in d:              # parcourt les CLÉS
    print(c, d[c])</code></pre>
    <ul><li>Une table clé → valeur : les clés sont non modifiables (int, str, tuple, mais pas list).</li><li>Accès en temps constant (table de hachage), contrairement à la recherche dans une liste.</li><li>Copie : <code>d2 = d1</code> partage le même dictionnaire ; utiliser <code>copy</code>.</li></ul>
    <div class="box key"><h5>Le schéma à connaître : compter</h5><code>if x in d: d[x] = d[x] + 1</code> sinon <code>d[x] = 1</code>.</div>
    <div class="box warn"><h5>Pièges</h5><code>d[c]</code> pour une clé absente → KeyError : tester <code>c in d</code> avant · <code>in</code> teste les clés, pas les valeurs.</div>`],
  ['8. Méthode : écrire une fonction au DS', 'écrire une fonction', `<ol style="padding-left:22px;margin-top:10px"><li>Recopier la <b>signature</b> demandée (nom, paramètres) ; ajouter une courte docstring.</li><li>Choisir la structure : un <b>accumulateur</b> (<code>s = 0</code>, <code>c = 0</code>, <code>res = []</code>, <code>d = {}</code>) puis une boucle qui le met à jour.</li><li><code>return</code> le résultat à la fin (pas de <code>print</code>).</li><li>Tester à la main sur l'exemple de l'énoncé et sur un cas limite (liste vide, 0, un seul élément).</li></ol>
    <pre class="code"><code>def indice_maximum(t):
    """Indice du maximum du tableau non vide t."""
    im = 0
    for i in range(len(t)):
        if t[i] &gt; t[im]:
            im = i
    return im</code></pre>
    <div class="box warn"><h5>Pièges</h5>Ne pas utiliser <code>max</code>, <code>min</code>, <code>sum</code>, <code>count</code> quand l'énoncé l'interdit · renvoyer une <b>nouvelle</b> liste si on le demande, au lieu de modifier celle reçue · indentation : tout ce qui est dans la boucle est décalé.</div>`]
];
function vCours(open) {
  app.innerHTML = `<div><p class="eyebrow">Chapitres 1 à 4 du cours · DS du 23/10</p><h1>Le cours utile</h1><p class="lede">Le cours de P. Rannou condensé en 8 fiches : définitions, syntaxe Python, méthodes et pièges. Chaque fiche dit à quel type de question elle sert.</p></div>
    ${FICHES.map(([t, tag, b], i) => `<details class="fiche" id="fiche${i}"${open === i ? ' open' : ''}><summary>${esc(t)}<span class="tag">${esc(tag)}</span></summary><div class="body">${b}</div></details>`).join('')}
    <section class="card"><h2>Après le DS du 23/10</h2><p class="sub">Récursivité (cas de base + appel sur un problème plus petit), graphes (matrice et listes d'adjacence), piles et files, parcours en profondeur et en largeur, graphes pondérés, preuves de programmes : ce sera pour le DS du 7/12 et l'oral de janvier.</p></section>`;
  if (open != null) { const f = $('#fiche' + open); if (f) setTimeout(() => f.scrollIntoView({ behavior: 'smooth' }), 60); }
}

/* ---------- Sujet blanc ---------- */
let EXAM = null, tick = 0;
const DUR = 5400;
const EXAM_PLAN = [['Exercice 1 · Types et valeurs', [['types', 1]], 4], ['Exercice 2 · Que calcule ce programme ?', [['boucles', 2], ['trace', 2]], 4], ['Exercice 3 · Fonctions, listes et copies', [['fonc', 1], ['alias', 2], ['list', 1]], 4], ['Exercice 4 · Complexité', [['cplx', 1]], 2], ['Exercice 5 · Écrire des fonctions', [['code2', 1], ['code3', 1]], 6]];
function examExos(seed) { const g = G(rng(seed)); return EXAM_PLAN.map(([title, parts, pts]) => ({ title, pts, parts: parts.map(([id, d]) => build(id, d, Math.floor(g.r() * 4294967296))) })); }
function vBlanc() {
  const E = ls.get('algo.exam.v1', null);
  if (E && !EXAM) { EXAM = E; EXAM.running = !E.done; }
  if (EXAM) return renderExam();
  const H = ls.get(HK, []);
  app.innerHTML = `<div><p class="eyebrow">Conditions réelles · 1 h 30 · noté sur 20</p><h1>Sujet blanc</h1><p class="lede">5 exercices dans le style des TD : types et valeurs (4 pts), programme à suivre (4 pts), fonctions, listes et copies (4 pts), complexité (2 pts), deux fonctions à écrire (6 pts, notées sur les tests réussis).</p></div>
    <section class="card"><div class="row"><button type="button" class="btn btn-primary btn-lg" data-act="exam">Commencer (1 h 30)</button><span class="fine">Pour être au plus près du DS, écris d'abord tes fonctions sur papier, puis recopie-les.</span></div></section>
    <section class="card"><h2>Mes copies</h2>${H.length ? `<table class="hist"><tr><th>Date</th><th>Note</th><th>Durée</th></tr>${H.slice().reverse().map(r => `<tr><td>${new Date(r.ts).toLocaleDateString('fr-FR')}</td><td><b>${String(r.note.toFixed(1)).replace('.', ',')}/20</b></td><td>${Math.round(r.dur / 60)} min</td></tr>`).join('')}</table>` : '<p class="sub">Aucune copie pour l\'instant.</p>'}</section>`;
}
function renderExam() {
  const exs = examExos(EXAM.seed);
  app.innerHTML = `<div><p class="eyebrow">Sujet blanc d'algorithmique</p><h1>DS · 1 h 30</h1></div>`
    + exs.map(ex => `<section class="card"><h2>${esc(ex.title)} <span class="fine">(${ex.pts} points)</span></h2>${ex.parts.map(p => `<div class="ex" style="margin-top:14px"><div class="q">${p.q}</div><div class="items">${p.items.map(it => itemHTML(it, it.id, EXAM.ans[it.id] || '')).join('')}</div>${EXAM.done ? `<details class="corr" open><summary>Correction</summary><div class="expl">${p.corr}</div></details>` : ''}</div>`).join('')}</section>`).join('')
    + (EXAM.done ? `<section class="card"><div class="row"><span class="score">${String(EXAM.note.toFixed(1)).replace('.', ',')}</span><span class="sub">/ 20</span><span class="sp"></span><button type="button" class="btn btn-primary" data-act="examNew">Nouveau sujet</button></div></section>`
      : `<div class="row" style="justify-content:center"><button type="button" class="btn btn-primary btn-lg" data-act="submit">Rendre la copie</button><span class="fine pyload" id="pyNote"></span></div>`);
  if (EXAM.done && EXAM.fb) Object.entries(EXAM.fb).forEach(([id, h]) => { const fb = $(`.it[data-id="${id}"] .fb`, app); if (fb) fb.innerHTML = h; });
  startTick();
}
function startTick() {
  clearInterval(tick); const clk = $('#clock');
  if (!EXAM || EXAM.done) { clk.hidden = true; return; }
  clk.hidden = false;
  const upd = () => { const left = DUR - (Date.now() - EXAM.t0) / 1000; clk.textContent = `${Math.floor(Math.max(0, left) / 3600)}:${String(Math.floor(Math.max(0, left) % 3600 / 60)).padStart(2, '0')}:${String(Math.floor(Math.max(0, left) % 60)).padStart(2, '0')}`; clk.classList.toggle('rush', left < 600); if (left <= 0) submitExam(true); };
  upd(); tick = setInterval(upd, 1000);
}
async function submitExam(auto) {
  if (!EXAM || EXAM.done || busy) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  busy = true; clearInterval(tick);
  const note0 = $('#pyNote'); if (note0) note0.textContent = 'Correction en cours (les fonctions sont exécutées en Python, la première fois peut prendre 30 s)…';
  const exs = examExos(EXAM.seed); let note = 0; const fb = {};
  for (const ex of exs) {
    const its = [].concat(...ex.parts.map(p => p.items)); let got = 0;
    for (const it of its) { const r = await check(it, EXAM.ans[it.id] || ''); fb[it.id] = fbHTML(r); got += r.st === 'ok' ? 1 : (r.frac || 0); }
    note += ex.pts * got / its.length;
  }
  busy = false;
  EXAM.done = true; EXAM.running = false; EXAM.note = note; EXAM.fb = fb;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(DUR, Math.round((Date.now() - EXAM.t0) / 1000)) }); ls.set(HK, H);
  try { localStorage.removeItem('algo.exam.v1'); } catch (e) { /* ignore */ }
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
let saveT = 0;
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
  const fi = e.target.closest('[data-fiche]'); if (fi) { setTab('cours'); vCours(+fi.dataset.fiche); return; }
  const go = e.target.closest('[data-go]');
  if (go) { if (CUR && CUR.mode === 'path' && !CUR.done && CUR.k.id === go.dataset.go) { $('#exHost').scrollIntoView({ behavior: 'smooth' }); return; } startEx(skById(go.dataset.go), { user: true }); renderPathTop(); renderMap(); return; }
  const ft = e.target.closest('[data-ft]'); if (ft) { FREE.id = ft.dataset.ft; vExos(); return; }
  const fd = e.target.closest('[data-fd]'); if (fd) { FREE.d = +fd.dataset.fd; vExos(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'check') checkCur();
  else if (act === 'next') nextPath();
  else if (act === 'skip') { const P = pst(); P.cur = null; P.curT = Date.now(); ls.set(PK, P); CUR = null; nextPath({ fresh: true, user: true }); }
  else if (act === 'again') startEx(skById(FREE.id), { d: FREE.d, mode: 'free' });
  else if (act === 'exam') { EXAM = { seed: newSeed(), t0: Date.now(), ans: {}, running: true, done: false }; ls.set('algo.exam.v1', EXAM); renderExam(); }
  else if (act === 'submit') submitExam(false);
  else if (act === 'examNew') { EXAM = null; vBlanc(); $('#clock').hidden = true; }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.matches('input, textarea')) return;
  const id = t.dataset.id || t.name; if (!id) return;
  if (EXAM && !EXAM.done && VIEW === 'blanc') { EXAM.ans[id] = t.value; try { localStorage.setItem('algo.exam.v1', JSON.stringify(EXAM)); } catch (err) { /* ignore */ } }
  else if (CUR && !CUR.done) { CUR.ans[id] = t.value; clearTimeout(saveT); saveT = setTimeout(saveCur, 400); }
});
document.addEventListener('change', e => { if (e.target.type === 'radio') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Tab' && t.matches('textarea.codein')) {   // la tabulation indente au lieu de quitter la zone
    e.preventDefault(); const s = t.selectionStart; t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 4; t.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (e.key === 'Enter' && t.matches('textarea.codein:not(.out)')) {   // garde l'indentation de la ligne précédente
    e.preventDefault(); const s = t.selectionStart, line = t.value.slice(0, s).split('\n').pop(), ind = (/^\s*/.exec(line)[0]) + (/:\s*$/.test(line) ? '    ' : '');
    t.value = t.value.slice(0, s) + '\n' + ind + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 1 + ind.length; t.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (e.key === 'Enter' && t.matches('#exHost input[type=text]')) { e.preventDefault(); checkCur(); }
});
document.addEventListener('toggle', e => { if (CUR && !CUR.done && e.target.matches && e.target.matches('#exHost details.corr') && e.target.open) { CUR.peek = true; saveCur(); } }, true);

(function () {
  const ICON = { sun: '☀', moon: '☾', auto: '◐' }, KEY = 'qcm-maths-theme', btn = $('#themeBtn');
  function apply(t) { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; btn.textContent = ICON[t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon']; btn.dataset.mode = t; btn.title = 'Thème : ' + ({ auto: 'automatique', light: 'clair', dark: 'sombre' })[t]; }
  let t = 'auto'; try { t = localStorage.getItem(KEY) || 'auto'; } catch (e) { /* ignore */ }
  apply(t);
  btn.addEventListener('click', () => { const nx = ({ auto: 'light', light: 'dark', dark: 'auto' })[btn.dataset.mode]; try { localStorage.setItem(KEY, nx); } catch (e) { /* ignore */ } apply(nx); });
})();
function wireAccount() {
  const A = window.SiteAccount; if (!A) return;
  A.on('data', keys => {
    if (!keys.some(k => k.startsWith('algo.'))) return;
    if (CUR && CUR.mode === 'path' && !CUR.done && !Object.keys(CUR.first).length && !Object.keys(CUR.ans).length) CUR = null;
    if (VIEW === 'path') vPath(); else if (VIEW === 'home') vHome();
  });
}
if (window.SiteAccount) wireAccount(); else window.addEventListener('siteaccount', wireAccount, { once: true });

window.__ALGO = { GEN, build, checkSync, check, pyParse, pyRepr, same, SK, CODE, runPy };   // tests
function boot() { const h = location.hash.slice(1); setTab(['home', 'path', 'cours', 'exos', 'blanc'].includes(h) ? h : 'home'); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
