<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Changchong City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="../config.js"></script>
<script defer src="../account.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Oral d'anglais « Cities of the Future » : diaporama + quiz en direct.
   - Sans paramètre : page privée (membres du groupe ESIR) → accueil présentateur, puis diaporama plein écran.
   - ?play ou ?room=1234 : page publique du public (téléphone) pour répondre au quiz.
   Temps réel : canal Supabase « oral-<code> » (broadcast + presence), sans table. */
:root{
  color-scheme:dark;
  /* thème sombre du site Prepa01 (core.css) */
  --navy:#121211; --navy-2:#1b1b19; --navy-3:#2e2d2a;
  --mint:#7592ff; --mint-soft:#1c2340;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220; --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82; --line:#2e2d2a; --line-2:#45433e;
  --green:#7592ff; --green-soft:#1c2340; --pen-ink:#0d1433;
  --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e;
  --qa:#7592ff; --qb:#ff9d42; --qc:#52c774; --qd:#e28ad9;
  --red:#ff6b5e; --gold:#f0b64d;
  --display:"Source Serif 4","Iowan Old Style",Georgia,serif; --text:Inter,system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--text)}
[hidden]{display:none!important}
button{font:inherit}

/* ---------- Accueil présentateur (privé) ---------- */
.home{max-width:820px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 64px;display:flex;flex-direction:column;gap:22px}
.home h1{font:600 clamp(30px,6vw,44px)/1.05 var(--display);margin:6px 0 8px}
.home h2{font:600 22px/1.2 var(--display);margin:0 0 10px}
.eyebrow{font:600 13px/1.2 var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0}
.lede{color:var(--ink-2);margin:0;max-width:62ch}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.fine{font-size:14px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:600 15px/1 var(--text);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--green);border-color:var(--green);color:var(--pen-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.code-pill{font:600 20px/1 var(--display);letter-spacing:.12em;background:var(--green-soft);color:var(--green);border-radius:8px;padding:6px 12px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.names input{font:500 15px var(--text);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet-2);color:var(--ink)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.plan li:hover{background:var(--paper)}
.plan .n{font:600 13px var(--text);color:var(--ink-2);width:24px;text-align:right;flex:none}
.plan .t{flex:1}
.plan .who{font-size:13px;color:var(--ink-2)}
.tag{font:600 12px/1 var(--text);border-radius:999px;padding:4px 9px;background:var(--green-soft);color:var(--green)}
.tag.q{background:var(--mint-soft);color:var(--qa)}
kbd{font:600 13px var(--text);background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.home a{color:var(--green)}

/* ---------- Scène 1920×1080 ---------- */
#show{position:fixed;inset:0;background:#000;overflow:hidden;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.s{position:absolute;inset:0;padding:110px 128px 150px;display:flex;flex-direction:column;gap:40px;background:var(--paper);color:var(--ink)}
.s.dark{background:var(--navy);color:var(--ink)}
.s .eb{font:600 26px/1.2 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0}
.s.dark .eb{color:var(--mint)}
.s h1{font:600 150px/1 var(--display);margin:0;letter-spacing:-.02em}
.s h2{font:600 80px/1.05 var(--display);margin:0;letter-spacing:-.01em}
.s p{margin:0}
.s .lead{font:500 40px/1.35 var(--text)}
.s .muted{color:var(--ink-2)}
.s.dark .muted{color:var(--muted)}
.foot{position:absolute;right:128px;bottom:56px;font:500 24px/1 var(--text);color:var(--ink-2)}
.s.dark .foot{color:var(--muted)}
.cards{display:grid;gap:32px;flex:1;align-content:start}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.cards.c4{grid-template-columns:repeat(4,1fr)}
.cardS{background:var(--sheet);border:2px solid var(--line);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:16px}
.s.dark .cardS{background:var(--navy-2);border-color:var(--navy-3)}
/* titres équilibrés, pas de mot seul en fin de paragraphe */
.s p,.holo p{text-wrap:pretty}
.s h1,.s h2,.holo h1,.holo h2,.s .statement,.holo .statement,.s .motto,.holo .motto,.s .qtext{text-wrap:balance}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.cardS .ic{width:84px;height:84px;border-radius:18px;background:var(--mint-soft);color:var(--mint);display:grid;place-items:center;font-size:44px;flex:none}
.cardS.mini{display:grid;grid-template-columns:auto 1fr;column-gap:24px;row-gap:4px;padding:20px 26px;align-items:center}
.cardS.mini .ic{grid-row:span 2;width:64px;height:64px;font-size:34px;border-radius:14px}
.cardS.mini h3{font-size:36px}
.cardS.mini p{font-size:27px}
.cardS h3{font:600 44px/1.1 var(--display);margin:0}
.cardS p{font:400 32px/1.4 var(--text);color:var(--ink-2)}
.s.dark .cardS p{color:var(--ink-2)}
.strip{background:var(--green-soft);border-radius:20px;padding:26px 36px;font:500 34px/1.35 var(--text);color:var(--ink-2)}
.s.dark .strip{background:var(--mint-soft);color:var(--ink-2)}
.statement{font:600 64px/1.15 var(--display);color:var(--green)}
.s.dark .statement{color:var(--mint)}
.pills{display:flex;flex-wrap:wrap;gap:16px}
.pill{display:inline-flex;align-items:center;gap:12px;font:600 30px/1 var(--text);background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:16px 26px}
.pill .ico{color:var(--mint)}
.pills.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.col{display:flex;flex-direction:column;gap:30px}
.split.top{align-items:start}
.cards.c1{grid-template-columns:1fr;gap:16px;flex:none}
.note{font-size:26px}
.s .lead.note{font-size:30px}
.lead.strong{font-weight:600}
.statement.sm{font-size:54px}
.statement.xl{font-size:84px}
.motto.lg{font-size:72px}
.s.dark .pill{background:var(--navy-2);border-color:var(--navy-3)}
.big{font:600 260px/.9 var(--display);color:var(--green);letter-spacing:-.04em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;flex:1;align-items:center}
.bars{display:flex;flex-direction:column;gap:30px}
.bar{display:grid;grid-template-columns:200px 1fr 170px;gap:24px;align-items:center;font:600 36px/1 var(--text)}
.bar i{display:block;height:64px;border-radius:12px;background:var(--green)}
.bar.bad i{background:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;flex:1;align-content:start}
.step{background:var(--sheet);border:2px solid var(--line);border-radius:24px;padding:34px;display:flex;flex-direction:column;gap:14px}
.step .no{font:600 40px/1 var(--display);width:72px;height:72px;border-radius:50%;background:var(--green);color:var(--pen-ink);display:grid;place-items:center}
.step h3{font:600 42px/1.1 var(--display);margin:0}
.step p{font:400 30px/1.4 var(--text);color:var(--ink-2)}
.names-row{display:flex;flex-wrap:wrap;gap:14px 40px;font:500 36px/1.2 var(--text);color:var(--ink-2)}
.motto{font:600 52px/1.2 var(--display);color:var(--mint)}

/* Rejoindre */
.join{display:grid;grid-template-columns:auto 1fr;gap:96px;align-items:center;flex:1}
.qr{background:#fff;padding:28px;border-radius:28px;width:520px;height:520px;display:grid;place-items:center}
.qr img,.qr canvas{width:464px!important;height:464px!important;image-rendering:pixelated}
.qr.sm{width:176px;height:176px;padding:12px;border-radius:14px}
.qr.sm img,.qr.sm canvas{width:152px!important;height:152px!important}
.pcount{font:500 34px/1.3 var(--text);color:var(--ink-2)}
.pcount b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:12px;max-height:250px;overflow:hidden}
.chip{font:600 28px/1 var(--text);background:var(--navy-3);color:var(--ink);border-radius:999px;padding:12px 22px;border:0;cursor:pointer}
.chip:hover{background:var(--red)}

/* Quiz */
.quiz{background:var(--navy);color:var(--ink);padding:80px 110px 120px;gap:34px}
.qtop{display:flex;justify-content:space-between;align-items:center;font:600 28px/1 var(--text);color:var(--muted)}
.qtext{font:600 70px/1.12 var(--display);margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1}
.opt{position:relative;border-radius:22px;padding:30px 40px;display:flex;align-items:center;gap:30px;font:600 46px/1.15 var(--text);color:#fff;overflow:hidden;transition:opacity .3s,transform .3s}
.opt .L{flex:none;width:82px;height:82px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font:600 46px/1 var(--display)}
.opt .cnt{margin-left:auto;font:600 46px/1 var(--display)}
.opt .fill{position:absolute;inset:auto 0 0 0;height:10px;background:rgba(255,255,255,.55);transform-origin:left;transform:scaleX(0);transition:transform .6s}
.o0{background:var(--qa)}.o1{background:var(--qb)}.o2{background:var(--qc)}.o3{background:var(--qd)}
.quiz.rev .opt.no{opacity:.28}
.quiz.rev .opt.ok{box-shadow:0 0 0 8px var(--mint);transform:scale(1.02)}
.qfoot{display:flex;align-items:center;gap:56px;min-height:176px}
.timer{display:flex;align-items:center;gap:28px;flex:1}
.qjoin{display:flex;align-items:center;gap:22px;font:600 26px/1.25 var(--text);color:var(--muted);text-align:right}
.tnum{font:600 72px/1 var(--display);width:120px;text-align:right;color:var(--mint)}
.tbar{flex:1;height:16px;border-radius:8px;background:var(--navy-3);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--mint);transform-origin:left}
.why{display:flex;align-items:center;gap:18px;font:500 34px/1.35 var(--text);color:var(--ink-2);background:var(--mint-soft);border-radius:18px;padding:22px 30px}
.why .ico{color:var(--ok);font-size:40px}
.board{display:flex;flex-direction:column;gap:18px;flex:1}
.brow{display:grid;grid-template-columns:90px 1fr 220px 160px;gap:24px;align-items:center;background:var(--navy-2);border-radius:18px;padding:22px 34px;font:600 44px/1 var(--text)}
.brow .r{font:600 48px/1 var(--display);color:var(--mint)}
.brow .g{color:var(--mint);font-size:34px;text-align:right}
.brow .p{text-align:right;font-family:var(--display)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;align-items:end;flex:1}
.pod{display:flex;flex-direction:column;align-items:center;gap:20px}
.pod .nm{font:600 52px/1.1 var(--display);text-align:center;word-break:break-word}
.pod .pt{font:600 34px/1 var(--text);color:var(--muted)}
.pod .blk{width:100%;border-radius:22px 22px 0 0;display:grid;place-items:start center;padding-top:24px;font:600 110px/1 var(--display);color:var(--navy)}
.pod.p1 .blk{height:420px;background:var(--gold)}
.pod.p2 .blk{height:300px;background:#C9D3DC}
.pod.p3 .blk{height:220px;background:#D69B62}

/* HUD présentateur (hors scène, discret) */
/* visible seulement quand la souris bouge (sinon il s'afficherait sur le projecteur) */
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font:500 12px/1 var(--text);color:var(--muted);background:rgba(18,18,17,.85);opacity:0;transition:opacity .3s;pointer-events:none}
#show.mouse #hud{opacity:1}
#show:not(.mouse){cursor:none}
#hud button{pointer-events:auto;background:var(--sheet-2);color:var(--ink);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;font:500 12px var(--text);cursor:pointer;margin-left:6px}

/* Animations d'arrivée */
@media (prefers-reduced-motion:no-preference){
  .s.in > *{animation:rise .5s both}
  .s.in > *:nth-child(2){animation-delay:.08s}
  .s.in > *:nth-child(3){animation-delay:.16s}
  .s.in > *:nth-child(4){animation-delay:.24s}
  .s.in > *:nth-child(5){animation-delay:.32s}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}}
}

/* ---------- Téléphone du public ---------- */
.play{min-height:100%;background:var(--navy);color:var(--ink);display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.play header{display:flex;justify-content:space-between;align-items:center;font:600 14px/1.2 var(--text);color:var(--muted);gap:12px}
.play header b{color:var(--mint);font-family:var(--display);font-size:18px}
.play main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:18px 0;max-width:520px;width:100%;margin:0 auto}
.play h1{font:600 30px/1.15 var(--display);margin:0}
.play p{margin:0;color:var(--ink-2)}
.play p.muted{color:var(--muted);font-size:15px}
.play input{font:600 22px var(--text);padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);width:100%}
.play input:focus{outline:none;border-color:var(--mint)}
.pbtn{min-height:52px;border:0;border-radius:10px;background:var(--mint);color:var(--pen-ink);font:600 17px var(--text);cursor:pointer;width:100%}
.pbtn:disabled{opacity:.4}
.pq{font:600 22px/1.25 var(--display);margin:0}
.pops{display:grid;gap:12px}
.popt{min-height:72px;border:0;border-radius:16px;color:#fff;font:600 19px/1.2 var(--text);display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;cursor:pointer}
.popt .L{flex:none;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font:600 22px var(--display)}
.popt:disabled{opacity:.35}
.popt.pick{opacity:1;box-shadow:0 0 0 4px #fff}
.ptbar{height:8px;border-radius:4px;background:var(--navy-3);overflow:hidden}
.ptbar i{display:block;height:100%;background:var(--mint);transform-origin:left}
.res{font:600 40px/1.1 var(--display);margin:0}
.res.ok{color:var(--mint)}.res.ko{color:#FF8F86}
.score{font:600 18px/1.4 var(--text);color:var(--ink-2)}
.score b{color:var(--ink);font-size:24px}
.err{color:#FF8F86;font-size:15px}

/* ---------- Ville 3D ---------- */
#city,#pcity{position:fixed;inset:0;background:#121211}
.c3-canvas{display:block;width:100%;height:100%;touch-action:none}
.c3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.c3-tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px/1.2 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;text-shadow:0 0 8px transparent}
.c3-tag b{background:rgba(18,18,17,.72);border:1px solid var(--line-2);border-radius:4px;padding:3px 8px;font-weight:600}
.c3-tag span{font-size:12px;color:var(--ink);letter-spacing:0}
.c3-tag.on b{background:var(--mint-soft);border-color:var(--mint);color:var(--ink)}
.c3-pl{position:absolute;left:0;top:0;font:600 12px/1 var(--text);color:var(--ink);background:rgba(18,18,17,.8);border:1px solid var(--line-2);border-radius:999px;padding:3px 8px;white-space:nowrap}
#show.c3 #stage{pointer-events:none}
#show.c3.free #stage .holo{opacity:.25}
.holo{position:absolute;left:72px;top:72px;width:780px;max-height:930px;display:flex;flex-direction:column;gap:24px;padding:46px 48px;background:linear-gradient(160deg,rgba(27,27,25,.92),rgba(18,18,17,.8));border:2px solid var(--line-2);border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 70px rgba(0,0,0,.5);color:var(--ink);overflow:hidden;transition:opacity .3s}
.holo::before,.holo::after{content:"";position:absolute;width:46px;height:46px;border:4px solid var(--mint);pointer-events:none}
.holo::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.holo::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.holo .scan{position:absolute;left:0;right:0;height:140px;top:-140px;background:linear-gradient(180deg,transparent,transparent,transparent);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.holo .scan{animation:scan 4.5s linear infinite}@keyframes scan{to{top:100%}}.holo.in{animation:holoIn .55s both}@keyframes holoIn{from{opacity:0;transform:translateX(-30px) scale(.98)}}}
.holo p{margin:0}
.holo .eb{font:600 22px/1.2 var(--text);letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin:0}
.holo h1{font:600 96px/1 var(--display)!important;margin:0}
.holo h2{font:600 60px/1.05 var(--display);margin:0}
.holo .cards{display:grid;grid-template-columns:1fr!important;gap:14px}
/* carte du panneau : icône à gauche, titre puis texte à droite */
.holo .cardS{display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:4px;align-content:start;padding:18px 22px!important;background:var(--sheet-2);border:1px solid var(--line);border-radius:10px}
.holo .cardS .ic{grid-row:span 2;width:50px;height:50px;font-size:26px;border-radius:12px}
.holo .cardS h3{font:600 30px/1.15 var(--display);margin:0;align-self:center}
.holo .cards.c1{gap:10px}
.holo .cardS.mini{padding:12px 18px!important;column-gap:16px;row-gap:2px}
.holo .cardS.mini .ic{width:44px;height:44px;font-size:22px}
.holo .cardS.mini h3{font-size:26px}
.holo .cardS.mini p{font-size:20px}
.holo .cardS p{font:400 23px/1.4 var(--text);color:var(--ink-2)}
.holo .strip{font:500 24px/1.4 var(--text);padding:16px 22px;background:var(--sheet-2);color:var(--ink-2);border-radius:10px}
.holo .statement{font:600 38px/1.2 var(--display)!important;color:var(--mint)}
.holo .pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.holo .pill{font:600 20px/1 var(--text);gap:10px;padding:11px 16px;background:var(--sheet-2);border:1px solid var(--line);border-radius:999px;color:var(--ink)}
.holo .split{display:flex;flex-direction:column;align-items:stretch;gap:22px}
.holo .col{gap:18px}
.holo .note{font-size:20px}
.holo .big{font:600 120px/.9 var(--display)!important;color:var(--mint)}
.holo .lead{font:500 28px/1.35 var(--text)!important}
.holo .muted{color:var(--muted)}
.holo .bars{display:flex;flex-direction:column;gap:14px}
.holo .bar{display:grid;grid-template-columns:120px 1fr 100px;gap:16px;align-items:center;font:600 24px/1 var(--text)}
.holo .bar i{display:block;height:32px;border-radius:6px;background:var(--mint)}
.holo .bar.bad i{background:var(--muted)}
.holo .steps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.holo .step{padding:18px;background:var(--sheet-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:8px}
.holo .step .no{width:44px;height:44px;font:600 24px/1 var(--display);background:var(--mint);color:var(--pen-ink);border-radius:50%;display:grid;place-items:center}
.holo .step h3{font:600 28px/1.1 var(--display);margin:0}
.holo .step p{font:400 21px/1.35 var(--text);color:var(--ink-2)}
.holo .motto{font:600 40px/1.2 var(--display)!important;color:var(--mint)}
.holo .names-row{display:flex;flex-wrap:wrap;gap:8px 26px;font:500 26px/1.2 var(--text);color:var(--ink-2)}
.holo .jrow{display:flex;gap:34px;align-items:center}
.holo .qr{width:340px;height:340px;padding:18px;border-radius:16px;flex:none;background:#fff;display:grid;place-items:center}
.holo .qr img,.holo .qr canvas{width:304px!important;height:304px!important}
.holo .pcount{font-size:26px}
.holo .pcount b{display:block;font:600 96px/1 var(--display);color:var(--mint);margin-bottom:6px}
.holo .chips{display:flex;flex-wrap:wrap;gap:10px;max-height:150px;overflow:hidden}
.holo .chip{font:600 20px/1 var(--text);padding:8px 14px;pointer-events:auto}
.s.over{background:rgba(18,18,17,.84)!important;backdrop-filter:blur(5px)}
.h3d-tag{position:absolute;right:72px;bottom:40px;font:500 22px/1 var(--text);color:var(--ink-2);background:rgba(18,18,17,.78);border:1px solid var(--line-2);border-radius:999px;padding:10px 18px}
.modes{display:flex;gap:10px;flex-wrap:wrap}
.modes label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--sheet-2)}
.modes label:has(input:checked){border-color:var(--green);background:var(--green-soft)}

/* téléphone : ville + interface par-dessus */
.play.c3{background:transparent;padding:0}
.ptop{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(18,18,17,.9),rgba(18,18,17,0));font:600 13px/1.2 var(--text);color:var(--ink-2);z-index:3}
.ptop b{color:var(--mint);font-family:var(--display)}
.pfollow{border:1px solid var(--line-2);background:rgba(18,18,17,.7);color:var(--ink-2);border-radius:999px;padding:8px 12px;font:600 13px var(--text);cursor:pointer}
.pfollow.on{background:var(--mint);color:var(--pen-ink);border-color:var(--mint)}
.pnav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(18,18,17,.92),rgba(18,18,17,0));z-index:3;scrollbar-width:none}

.pinfo{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(27,27,25,.97);border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;z-index:4;color:var(--ink)}
.pinfo h3{margin:0 0 6px;font:600 20px/1.2 var(--display);color:var(--mint)}
.pinfo p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.45}
.pinfo .pcnt{margin-top:8px;color:var(--mint);display:flex;align-items:center;gap:6px}
.pinfo .x{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}

.pghost{min-height:48px;border:1px solid var(--line-2);border-radius:14px;background:transparent;color:var(--ink-2);font:600 16px var(--text);cursor:pointer;width:100%}

.ptop b{color:var(--mint)}
.play h1{font-family:var(--display);font-weight:600;letter-spacing:-.02em}

      G.reset(); if (chan) { chan.unsubscribe(); chan = null; } if (chanPos) { chanPos.unsubscribe(); chanPos = null; } Object.keys(POS).forEach(k => delete POS[k]); renderHome();
    }
  });
  home.addEventListener('change', e => { if (e.target.name === 'mode') ls.set(LS.mode, e.target.value); });
  home.addEventListener('input', e => {
    const i = e.target.dataset.name; if (i == null) return;
    const N = ls.get(LS.names, []); N[+i] = e.target.value; ls.set(LS.names, N);
  });

  /* =====================================================================
     Diaporama
     ===================================================================== */
  const show = $('#show'), stage = $('#stage');
  let cur = 0, phase = 'show', askAt = 0, tick = null, chan = null, online = {};
  // phase sur un quiz : 'ask' (chrono) → 'reveal' → 'board' ; ailleurs : 'show'

  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${k}) translate(-50%,-50%)`;
    if (!show.hidden && is3d()) setTimeout(maskLabels, 700);   // après l'animation d'entrée du panneau
  }
  addEventListener('resize', fit);

  let city = null, cityBusy = false, free = false;
  async function startShow(i) {
    home.hidden = true; show.hidden = false; fit();
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    if (mode3d() && !city && !cityBusy) {
      cityBusy = true;
      stage.innerHTML = '<section class="s dark"><p class="eb">Changchong City</p><h2>Loading the city…</h2></section>';

    show.classList.toggle('c3', on3d); $('#city').hidden = !on3d;
    connect();
    go(i);
  }
  function exitShow() {

  const is3d = () => !!city && show.classList.contains('c3');

  // barre du présentateur : seulement quand la souris bouge, puis elle disparaît avec le curseur

  show.addEventListener('mousemove', () => {
    show.classList.add('mouse'); clearTimeout(mouseT);

  function go(i) {
    i = Math.max(0, Math.min(S.length - 1, i));
    // le podium est sauté si personne n'a marqué de point
    if (S[i].podium && !winners().length) i += i >= cur ? 1 : -1;
    cur = i; G.slide = i; G.save(); stopTick();
    const s = S[i];
    phase = s.quiz ? (G.ans[s.id] && G.ans[s.id]._done ? 'reveal' : 'ask') : 'show';
    if (s.quiz && phase === 'ask') { G.ans[s.id] = {}; askAt = Date.now(); G.save(); startTick(); }
    if (is3d()) { if (free) setFree(false); city.fly(s.cam); city.ring15(s.ring); }
    render(true);
    broadcastState();
  }
  function next() {
    const s = S[cur];
    if (s.quiz) {
      if (phase === 'ask') { reveal(); return; }

    }

  }

  function startTick() {

  const playersOnline = () => Object.keys(online).filter(p => !G.banned.includes(p));
  function answersOf(id) { const A = G.ans[id] || {}; return Object.keys(A).filter(k => k !== '_done' && !G.banned.includes(k)).map(k => A[k]); }

  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const fmt = n => Number(n).toLocaleString('en-US');

  const hudInfo = () => `Code ${G.room} · ${playersOnline().length} connecté(s)${chanOk ? '' : ' · hors ligne'}${free ? ' · caméra libre (C pour revenir)' : ''}`;
  // « 3 / 5 answered » pendant la question, « 3 answers » une fois corrigée
  const answeredTxt = (tot, live) => { const on = playersOnline().length; return live && on ? `${tot} / ${on} answered` : plural(tot, 'answer'); };
  const playersTxt = n => n ? `<b>${n}</b> ${n === 1 ? 'player' : 'players'} connected` : 'Waiting for players…';
  const chipsHTML = ps => ps.map(p => `<button type="button" class="chip" data-ban="${esc(p)}" title="Exclure">${esc(online[p])}</button>`).join('');

  function render(anim) {
    if (is3d()) { render3D(anim); return; }

  function joinInner() {

  function quizHTML(s) {

    return `<section class="s quiz${rev ? ' rev' : ''} in">
      <div class="qtop"><span>${head}</span><span id="acount">${answeredTxt(tot, !rev)}</span></div>

      ${rev ? `<p class="why">${I('circle-check')}<span>${esc(Q.why)}</span></p>`
        : `<div class="qfoot"><div class="timer"><div class="tbar"><i id="tbar" style="transform:scaleX(${left / DUR})"></i></div><span class="tnum" id="tnum">${Math.ceil(left)}</span></div><div class="qjoin"><span>Scan<br>to join</span><div class="qr sm" id="qrSm"></div></div></div>`}

  }

      <div class="podium" style="grid-template-columns:repeat(${p.length},1fr);width:${p.length === 3 ? 100 : p.length * 34}%;margin:0 auto">${p.map(([r, pl]) => `<div class="pod p${pl}"><span class="nm">${esc(r.name)}</span><span class="pt">${fmt(r.pts)} points</span><div class="blk">${pl}</div></div>`).join('')}</div></section>`;
  }

    const el = $(sel); if (!el) return;

    el.innerHTML = '';
    new QRCode(el, { text: G.joinUrl(), width: size, height: size, colorDark: '#121211', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  }

  // mise à jour légère pendant le quiz (sans relancer les animations)
  function refreshLive() {
    const s = S[cur];
    if (s.join) {
      const ps = playersOnline(), c = $('#chips'), n = $('#pcount');
      if (c) c.innerHTML = chipsHTML(ps);
      if (n) n.innerHTML = playersTxt(ps.length);
      if (is3d()) maskLabels();
    }
    if (s.quiz && phase === 'ask') {
      const tot = answersOf(s.id).length, on = playersOnline().length, a = $('#acount');
      if (a) a.textContent = answeredTxt(tot, true);
      if (on && tot >= on) { const id = s.id; setTimeout(() => { if (S[cur].id === id) reveal(); }, 600); }
    }

  }

  /* ---------- Clavier, clic ---------- */
  addEventListener('keydown', e => {
    if (show.hidden) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
    else if ((e.key === 'e' || e.key === 'E') && is3d()) { city.quake(); send('fx', { t: 'quake' }); }
    else if ((e.key === 'c' || e.key === 'C') && is3d()) { setFree(!free); }
    else if ((e.key === 'g' || e.key === 'G') && is3d()) { city.bloom(); }
    else if (e.key === 'Escape' && free) { setFree(false); }
    else if (e.key === 'Escape' && !document.fullscreenElement) { exitShow(); }
  });
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));
  show.addEventListener('click', e => {
    const b = e.target.closest('[data-ban]');
    if (b) { const p = b.dataset.ban; if (!G.banned.includes(p)) G.banned.push(p); G.save(); refreshLive(); return; }
    if (e.target.closest('#hud') || free) return;
    next();
  });
  $('#hudFs').addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
  $('#hudExit').addEventListener('click', e => { e.stopPropagation(); exitShow(); });
  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  }

  /* ---------- Temps réel (présentateur) ---------- */
  let chanOk = false;
  function connect() {
    if (chan) return;
    chan = sb.channel('oral-' + G.room, { config: { broadcast: { self: false } } });
    chan.on('presence', { event: 'sync' }, () => {
      const st = chan.presenceState(); online = {};
      Object.values(st).forEach(arr => arr.forEach(m => { if (m.pid) online[m.pid] = String(m.name || '?').slice(0, 20); }));
      Object.keys(online).forEach(p => { G.players[p] = { name: online[p] }; });
      G.save(); refreshLive();
    });
    chan.on('broadcast', { event: 'hello' }, () => broadcastState());
    chan.on('broadcast', { event: 'ans' }, ({ payload: a }) => {
      const s = S[cur];
      if (!a || !s.quiz || phase !== 'ask' || a.qid !== s.id || G.banned.includes(a.pid)) return;
      const A = G.ans[s.id] || (G.ans[s.id] = {});
      if (A[a.pid]) return;                                   // une seule réponse par question
      const t = (Date.now() - askAt) / 1000, k = +a.k;
      if (t > DUR + 1 || !(k >= 0 && k < 4)) return;
      const ok = k === s.quiz.ok;
      A[a.pid] = { k, t: Math.round(t * 10) / 10, pts: ok ? Math.round(1000 * (1 - 0.5 * Math.min(1, t / DUR))) : 0 };
      if (a.name) G.players[a.pid] = { name: String(a.name).slice(0, 20) };
      G.save(); refreshLive();
    });
    chan.subscribe(st => {
      chanOk = st === 'SUBSCRIBED';
      if (chanOk) broadcastState();
      if (!show.hidden) refreshLive();
    });
    // positions des téléphones dans la ville : canal à part, écouté par le présentateur seulement
    chanPos = sb.channel('oral-' + G.room + '-pos', { config: { broadcast: { self: false } } });
    chanPos.on('broadcast', { event: 'pos' }, ({ payload: p }) => {
      if (!p || !p.pid || G.banned.includes(p.pid)) return;
      const x = +p.x, z = +p.z; if (!isFinite(x) || !isFinite(z)) return;

    });

    clearInterval(mapTimer);
    mapTimer = setInterval(shareMap, 2000);
  }
  let chanPos = null, mapTimer = null; const POS = {};
  // toutes les 2 s : drones sur l'écran + carte envoyée aux téléphones (positions et nombre par quartier)
  function shareMap() {
    const now = Date.now(), list = [], counts = {};
    Object.keys(POS).forEach(pid => {
      const p = POS[pid];
      if (now - p.t > 45000 || !online[pid] || G.banned.includes(pid)) return;
      list.push({ id: pid, name: online[pid], x: p.x, z: p.z });
      const zz = zoneAt(p.x, p.z); if (zz) counts[zz] = (counts[zz] || 0) + 1;
    });
    if (city) { city.setPlayers(list); city.setCounts(counts); }
    if (list.length || shareMap.had) send('map', { p: list.map(o => [o.id, Math.round(o.x), Math.round(o.z), o.name]), c: counts });
    shareMap.had = list.length > 0;
  }
  function send(event, payload) { if (chan && chanOk) chan.send({ type: 'broadcast', event, payload }).catch(() => {}); }
  function broadcastState() {
    const s = S[cur], st = { phase: 'wait', title: s.pt || s.title || '', slide: cur, cam: s.cam, ring: s.ring };
    if (s.quiz) {
      st.qid = s.id; st.qn = s.qn; st.qt = QUIZ.length; st.q = s.quiz.q; st.o = s.quiz.o;
      if (phase === 'ask') { st.phase = 'ask'; st.left = Math.max(0, DUR * 1000 - (Date.now() - askAt)); st.dur = DUR * 1000; }
      else { st.phase = phase; st.ok = s.quiz.ok; }
    }
    if (s.podium || s.id === 'thanks') st.phase = 'end';
    if (st.phase !== 'ask') {

      const R = G.ranking(), A = (s.quiz && G.ans[s.id]) || {};

  }
  boot();

  /* =====================================================================
     Joueur (téléphone)
     ===================================================================== */
  function startPlayer() {
    $('#homeView').hidden = true;

    document.body.style.background = 'var(--navy)';
    view.innerHTML = `<div id="pcity" hidden></div><div class="ptop" id="ptop" hidden></div><div class="ptoast" id="ptoast" hidden></div>
      <div class="pinfo" id="pinfo" hidden></div><div class="pnav" id="pnav" hidden></div><div class="pmodal" id="pmodal"><main></main></div>`;
    const P = ls.get(LS.me, null) || {};

    let ch = null, ok = false, st = null, picked = {}, tmr = null, rcvAt = 0;
    let city = null, counts = {}, lastCam = null, info = null, dismissed = null, toastT = null, posT = null, httpOk = true, posCh = null;
    const last = { x: 1e9, z: 1e9, t: 0 };
    const save = () => ls.set(LS.me, P);

    function screen(html) {
      modal.hidden = false; $('#pinfo').hidden = true;

    }
    function explore() { modal.hidden = true; }
    function toast(txt, ms = 3500) {
      const t = $('#ptoast'); t.textContent = txt; t.hidden = false;
      clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
    }

    /* ---------- Formulaires ---------- */
    function askCode(err) {
      screen(`<h1>Join Changchong City</h1><p>Type the code shown on the screen.</p>
        <form id="f" style="display:grid;gap:12px"><input id="code" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="1234" aria-label="Code" value="${esc(room)}">
        ${err ? `<p class="err">${esc(err)}</p>` : ''}<button class="pbtn">Next</button></form>`);
      $('#f').addEventListener('submit', e => { e.preventDefault(); const c = $('#code').value.replace(/\D/g, ''); if (c.length !== 4) { askCode('The code has 4 digits.'); return; } room = c; askName(); });
    }
    function askName(err) {
      screen(`<h1>Choose a nickname</h1><p>Your drone will fly over the city with this name, and it will appear on the leaderboard. Keep it friendly!</p>
        <form id="f" style="display:grid;gap:12px"><input id="nm" autocomplete="nickname" maxlength="16" placeholder="Nickname" aria-label="Nickname" value="${esc(P.name || '')}">
        ${err ? `<p class="err">${esc(err)}</p>` : ''}<button class="pbtn">Join</button></form>`);
      $('#nm').focus();
      $('#f').addEventListener('submit', e => { e.preventDefault(); const n = $('#nm').value.trim().replace(/\s+/g, ' '); if (n.length < 2) { askName('At least 2 characters.'); return; } P.name = n; save(); join(); });
    }

    /* ---------- Connexion ---------- */
    async function join() {
      screen('<h1>Connecting…</h1>');
      try {
        if (!window.supabase || !window.supabase.createClient) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = SUPABASE_JS; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
        const cl = window.supabase.createClient(C().supabaseUrl, C().supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        join.cl = cl;
        if (ch) ch.unsubscribe();
        ch = cl.channel('oral-' + room, { config: { broadcast: { self: false }, presence: { key: P.pid } } });
        ch.on('broadcast', { event: 'st' }, ({ payload }) => { st = payload; rcvAt = Date.now(); onState(); });
        ch.on('broadcast', { event: 'map' }, ({ payload }) => onMap(payload));
        ch.on('broadcast', { event: 'fx' }, ({ payload }) => {
          if (payload && payload.t === 'quake') {
            if (city) city.quake();

          }
        });
        ch.subscribe(async s => {
          if (s === 'SUBSCRIBED') {
            ok = true;
            await ch.track({ pid: P.pid, name: P.name });
            ch.send({ type: 'broadcast', event: 'hello', payload: { pid: P.pid } });
            if (!city && webgl) loadCity();
            if (!st) waiting();
          } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') {
            ok = false; screen(`<h1>Connection lost</h1><p>Check your internet connection.</p><button class="pbtn" id="re">Try again</button>`);
            $('#re').addEventListener('click', join);
          }
        });
      } catch (e) {
        screen(`<h1>Connection failed</h1><p>Check your internet connection.</p><button class="pbtn" id="re">Try again</button>`);
        $('#re').addEventListener('click', join);
      }
    }
    function waiting() {
      if (city) { explore(); toast('Explore the city: your drone is on the big screen.', 4500); return; }
      screen(`<h1>You're in, ${esc(P.name)}!</h1><p>Watch the screen. The questions will appear here.</p><p class="muted">If nothing happens, the presentation has not started yet.</p>`);
    }

    /* ---------- Ville 3D sur le téléphone ---------- */
    async function loadCity() {
      try {
        const m = await loadCityMod();
        $('#pcity').hidden = false;
        city = m.createCity($('#pcity'), { mode: 'player', zones: ZONES, lite: true, onPick: id => { follow(false); city.fly(id, 1.6); showInfo(id); }, onUser: () => follow(false) });
      } catch (e) { console.warn(e); city = null; $('#pcity').hidden = true; return; }
      view.classList.add('c3');
      const top = $('#ptop'); top.hidden = false;
      top.innerHTML = `<span><b>${esc(P.name)}</b></span><button type="button" class="pfollow" id="pfol">Follow the screen</button>`;
      $('#pfol').addEventListener('click', () => { follow(!P.follow); if (P.follow && lastCam) city.fly(lastCam, 1.6); });
      follow(P.follow);
      const nav = $('#pnav'); nav.hidden = false;
      nav.innerHTML = ZONES.map(z => `<button type="button" data-z="${z.id}">${esc(z.name)}</button>`).join('');
      nav.addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (!b) return; follow(false); city.fly(b.dataset.z, 1.6); showInfo(b.dataset.z); });
      $('#pinfo').addEventListener('click', e => { if (e.target.closest('.x')) { $('#pinfo').hidden = true; info = null; } });
      if (st && st.cam) { lastCam = st.cam; if (P.follow) city.fly(st.cam, 0.01); city.ring15(!!st.ring); }
      clearInterval(posT); posT = setInterval(sendPos, 2000);
      if (st) onState(); else waiting();
    }
    function follow(on) {
      P.follow = !!on; save();
      const b = $('#pfol'); if (b) b.classList.toggle('on', P.follow);
    }
    function showInfo(id) {
      const z = ZONES.find(q => q.id === id); if (!z) return; info = id;
      const el = $('#pinfo'), n = counts[id] || 0; el.hidden = false;
      el.innerHTML = `<button type="button" class="x" aria-label="Close">×</button><h3>${esc(z.name)}</h3><p>${esc(z.info)}</p><p class="pcnt">${I('users')} ${n} ${n === 1 ? 'person' : 'people'} here</p>`;
    }
    function onMap(m) {
      if (!m) return;
      counts = m.c || {};
      if (city) {
        city.setPlayers((m.p || []).filter(r => r[0] !== P.pid).map(r => ({ id: r[0], x: r[1], z: r[2], name: r[3] })));
        city.setCounts(counts);
      }
      if (info && !$('#pinfo').hidden) showInfo(info);
    }
    // position envoyée au présentateur (seulement s'il a bougé), par l'API HTTP pour ne pas inonder les autres téléphones
    async function sendPos() {
      if (!city || !ok) return;
      const p = city.pos(), now = Date.now();
      if (Math.hypot(p.x - last.x, p.z - last.z) < 1.5 && now - last.t < 12000) return;
      last.x = p.x; last.z = p.z; last.t = now;
      const payload = { pid: P.pid, x: p.x, z: p.z };
      if (httpOk) {
        try {
          const r = await fetch(C().supabaseUrl + '/realtime/v1/api/broadcast', {
            method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C().supabaseAnonKey },
            body: JSON.stringify({ messages: [{ topic: 'oral-' + room + '-pos', event: 'pos', payload, private: false }] })
          });
          if (r.ok) return;
          httpOk = false;
        } catch (e) { httpOk = false; }
      }
      // secours : canal temps réel (reçoit aussi les positions des autres, ignorées)
      if (!posCh && join.cl) { posCh = join.cl.channel('oral-' + room + '-pos', { config: { broadcast: { self: false } } }); posCh.subscribe(); }
      if (posCh) posCh.send({ type: 'broadcast', event: 'pos', payload }).catch(() => {});
    }

    /* ---------- État de la présentation ---------- */
    function onState() {
      if (!st) return;
      if (city && st.cam && st.cam !== lastCam) { lastCam = st.cam; if (P.follow) city.fly(st.cam, 1.8); }
      if (city) city.ring15(!!st.ring);
      draw();
    }
    function scoreLine() {
      const r = st && st.p && st.p[P.pid];
      return r ? `<p class="score">Score <b>${r[0]}</b> · rank <b>${r[3]}</b> / ${st.n}</p>` : '';
    }
    const backBtn = () => city ? '<button type="button" class="pghost" id="back">Back to the city</button>' : '';
    function bindBack(key) { const b = $('#back'); if (b) b.addEventListener('click', () => { dismissed = key; explore(); }); }
    function draw() {
      clearInterval(tmr);
      if (!st) return;
      if (st.banned && st.banned.includes(P.pid)) { screen('<h1>You have been removed from the game.</h1>'); return; }
      const key = st.phase + ':' + (st.qid || '') + ':' + st.slide;
      if (st.phase === 'ask') {
        const mine = picked[st.qid];
        screen(`<p class="score">Question ${st.qn} / ${st.qt}</p><p class="pq">${esc(st.q)}</p>
          <div class="ptbar"><i id="pt"></i></div>
          <div class="pops">${st.o.map((o, k) => `<button type="button" class="popt o${k}${mine === k ? ' pick' : ''}" data-k="${k}"${mine != null ? ' disabled' : ''}><span class="L">${LET[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
          ${mine != null ? '<p>Answer sent! Wait for the result…</p>' : ''}`);
        const end = rcvAt + st.left;
        const upd = () => { const pt = $('#pt'); if (pt) pt.style.transform = `scaleX(${Math.max(0, (end - Date.now()) / st.dur)})`; };
        upd(); tmr = setInterval(upd, 150);
        mm.querySelectorAll('.popt').forEach(b => b.addEventListener('click', () => {
          if (picked[st.qid] != null || Date.now() > end + 500) return;
          picked[st.qid] = +b.dataset.k;
          ch.send({ type: 'broadcast', event: 'ans', payload: { pid: P.pid, name: P.name, qid: st.qid, k: +b.dataset.k } });
          if (navigator.vibrate) navigator.vibrate(30);
          draw();
        }));
        return;
      }
      if (dismissed === key) { explore(); return; }
      if (st.phase === 'reveal' || st.phase === 'board') {
        const r = st.p && st.p[P.pid], k = r ? r[2] : -1;
        const good = k === st.ok;
        screen(`<p class="score">Question ${st.qn} / ${st.qt}</p>
          ${k < 0 ? '<p class="res">No answer</p>' : good ? `<p class="res ok">Correct! +${r[1].toLocaleString('en-US')}</p>` : '<p class="res ko">Wrong answer</p>'}
          <p>The answer was <b style="color:#f1eee7">${LET[st.ok]}: ${esc(st.o[st.ok])}</b></p>${scoreLine()}${backBtn()}`);
        bindBack(key);
        return;
      }
      if (st.phase === 'end') {
        const r = st.p && st.p[P.pid];
        screen((r ? `<h1>${r[3] === 1 && r[0] > 0 ? 'You won!' : r[3] <= 3 && r[0] > 0 ? 'Top 3!' : 'Thanks for playing!'}</h1><p class="score">Final score <b>${r[0].toLocaleString('en-US')}</b> · rank <b>${r[3]}</b> / ${st.n}</p>` : '<h1>Thanks for playing!</h1>') + `<p>Don’t forget to vote for Changchong City!</p>${backBtn()}`);
        bindBack(key);
        return;
      }
      if (city) { const was = modal.hidden; explore(); if (!was || draw.lastSlide !== st.slide) toast(st.title || 'Changchong City'); draw.lastSlide = st.slide; return; }
      screen(`<h1>Listen carefully…</h1><p>The next question is coming soon.</p>${scoreLine()}`);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ch && ok) ch.send({ type: 'broadcast', event: 'hello', payload: { pid: P.pid } }); });

    save();
    if (room.length !== 4) askCode(); else if (!P.name) askName(); else join();
  }
})();
</script>
</body>
</html>
