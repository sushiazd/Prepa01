<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Changchong City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="../config.js"></script>
<script defer src="../account.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Oral d'anglais « Cities of the Future » : diaporama + quiz en direct.
   - Sans paramètre : page privée (membres du groupe ESIR) → accueil présentateur, puis diaporama plein écran.
   - ?play ou ?room=1234 : page publique du public (téléphone) pour répondre au quiz.
   Temps réel : canal Supabase « oral-<code> » (broadcast + presence), sans table. */
:root{
  --navy:#0E1B2C; --navy-2:#152639; --navy-3:#1F3550;
  --mint:#6FE3B4; --mint-soft:#1D3A3A;
  --paper:#F3F6F1; --sheet:#FBFCF9; --ink:#0E1B2C; --ink-2:#4F5B68; --line:#D5DED7;
  --green:#0E7A57; --green-soft:#DDEDE4;
  --qa:#2457C5; --qb:#B85A0B; --qc:#0B7A52; --qd:#7B3BC4;
  --red:#C2362F; --gold:#E2B33C;
  --display:"Space Grotesk",Arial,sans-serif; --text:Inter,system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--text)}
[hidden]{display:none!important}
button{font:inherit}

/* ---------- Accueil présentateur (privé) ---------- */
.home{max-width:820px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 64px;display:flex;flex-direction:column;gap:22px}
.home h1{font:700 clamp(30px,6vw,44px)/1.05 var(--display);margin:6px 0 8px}
.home h2{font:700 22px/1.2 var(--display);margin:0 0 10px}
.eyebrow{font:600 13px/1.2 var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0}
.lede{color:var(--ink-2);margin:0;max-width:62ch}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.fine{font-size:14px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:600 15px/1 var(--text);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#0b6347}
.code-pill{font:700 20px/1 var(--display);letter-spacing:.12em;background:var(--green-soft);color:var(--green);border-radius:8px;padding:6px 12px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.names input{font:500 15px var(--text);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.plan li:hover{background:var(--paper)}
.plan .n{font:600 13px var(--text);color:var(--ink-2);width:24px;text-align:right;flex:none}
.plan .t{flex:1}
.plan .who{font-size:13px;color:var(--ink-2)}
.tag{font:600 12px/1 var(--text);border-radius:999px;padding:4px 9px;background:var(--green-soft);color:var(--green)}
.tag.q{background:#E7EEFB;color:var(--qa)}
kbd{font:600 13px var(--text);background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.home a{color:var(--green)}

/* ---------- Scène 1920×1080 ---------- */
#show{position:fixed;inset:0;background:#000;overflow:hidden;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.s{position:absolute;inset:0;padding:110px 128px 150px;display:flex;flex-direction:column;gap:40px;background:var(--paper);color:var(--ink)}
.s.dark{background:var(--navy);color:#EEF2EC}
.s .eb{font:600 26px/1.2 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0}
.s.dark .eb{color:var(--mint)}
.s h1{font:700 150px/1 var(--display);margin:0;letter-spacing:-.02em}
.s h2{font:700 80px/1.05 var(--display);margin:0;letter-spacing:-.01em}
.s p{margin:0}
.s .lead{font:500 40px/1.35 var(--text)}
.s .muted{color:var(--ink-2)}
.s.dark .muted{color:#AFC0CF}
.foot{position:absolute;left:128px;right:128px;bottom:56px;display:flex;justify-content:space-between;font:500 24px/1 var(--text);color:var(--ink-2)}
.s.dark .foot{color:#AFC0CF}
.cards{display:grid;gap:32px;flex:1;align-content:start}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.cards.c4{grid-template-columns:repeat(4,1fr)}
.cardS{background:var(--sheet);border:2px solid var(--line);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:16px}
.s.dark .cardS{background:var(--navy-2);border-color:var(--navy-3)}
.cardS .ic{font-size:64px;line-height:1}
.cardS h3{font:700 44px/1.1 var(--display);margin:0}
.cardS p{font:400 32px/1.4 var(--text);color:var(--ink-2)}
.s.dark .cardS p{color:#C6D3DE}
.strip{background:var(--green-soft);border-radius:20px;padding:26px 36px;font:500 34px/1.35 var(--text);color:#0B4F39}
.s.dark .strip{background:var(--mint-soft);color:#C9F5E2}
.statement{font:700 64px/1.15 var(--display);color:var(--green)}
.s.dark .statement{color:var(--mint)}
.pills{display:flex;flex-wrap:wrap;gap:16px}
.pill{font:600 32px/1 var(--text);background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:18px 30px}
.s.dark .pill{background:var(--navy-2);border-color:var(--navy-3)}
.big{font:700 260px/.9 var(--display);color:var(--green);letter-spacing:-.04em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;flex:1;align-items:center}
.bars{display:flex;flex-direction:column;gap:30px}
.bar{display:grid;grid-template-columns:200px 1fr 170px;gap:24px;align-items:center;font:600 36px/1 var(--text)}
.bar i{display:block;height:64px;border-radius:12px;background:var(--green)}
.bar.bad i{background:#5B5F66}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;flex:1;align-content:start}
.step{background:var(--sheet);border:2px solid var(--line);border-radius:24px;padding:34px;display:flex;flex-direction:column;gap:14px}
.step .no{font:700 40px/1 var(--display);width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.step h3{font:700 42px/1.1 var(--display);margin:0}
.step p{font:400 30px/1.4 var(--text);color:var(--ink-2)}
.names-row{display:flex;flex-wrap:wrap;gap:14px 40px;font:500 36px/1.2 var(--text);color:#C6D3DE}
.motto{font:600 52px/1.2 var(--display);color:var(--mint)}
.who-tag{position:absolute;top:44px;right:128px;font:600 24px/1 var(--text);color:var(--ink-2);display:flex;gap:10px;align-items:center}
.s.dark .who-tag{color:#AFC0CF}
.who-tag b{color:var(--green)}
.s.dark .who-tag b{color:var(--mint)}

/* Rejoindre */
.join{display:grid;grid-template-columns:auto 1fr;gap:80px;align-items:center;flex:1}
.qr{background:#fff;padding:28px;border-radius:28px;width:520px;height:520px;display:grid;place-items:center}
.qr img,.qr canvas{width:464px!important;height:464px!important;image-rendering:pixelated}
.qr.sm{width:230px;height:230px;padding:14px;border-radius:18px}
.qr.sm img,.qr.sm canvas{width:202px!important;height:202px!important}
.room{font:700 120px/1 var(--display);letter-spacing:.1em;color:var(--mint)}
.url{font:500 34px/1.3 var(--text);color:#C6D3DE;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:12px;max-height:250px;overflow:hidden}
.chip{font:600 28px/1 var(--text);background:var(--navy-3);color:#EEF2EC;border-radius:999px;padding:12px 22px;border:0;cursor:pointer}
.chip:hover{background:var(--red)}

/* Quiz */
.quiz{background:var(--navy);color:#EEF2EC;padding:80px 110px 120px;gap:34px}
.qtop{display:flex;justify-content:space-between;align-items:center;font:600 28px/1 var(--text);color:#AFC0CF}
.qtext{font:700 70px/1.12 var(--display);margin:0;min-height:160px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1}
.opt{position:relative;border-radius:22px;padding:30px 40px;display:flex;align-items:center;gap:30px;font:600 46px/1.15 var(--text);color:#fff;overflow:hidden;transition:opacity .3s,transform .3s}
.opt .L{flex:none;width:82px;height:82px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font:700 46px/1 var(--display)}
.opt .cnt{margin-left:auto;font:700 46px/1 var(--display)}
.opt .fill{position:absolute;inset:auto 0 0 0;height:10px;background:rgba(255,255,255,.55);transform-origin:left;transform:scaleX(0);transition:transform .6s}
.o0{background:var(--qa)}.o1{background:var(--qb)}.o2{background:var(--qc)}.o3{background:var(--qd)}
.quiz.rev .opt.no{opacity:.28}
.quiz.rev .opt.ok{box-shadow:0 0 0 8px var(--mint);transform:scale(1.02)}
.timer{display:flex;align-items:center;gap:28px}
.tnum{font:700 72px/1 var(--display);width:120px;text-align:right;color:var(--mint)}
.tbar{flex:1;height:16px;border-radius:8px;background:var(--navy-3);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--mint);transform-origin:left}
.why{font:500 34px/1.35 var(--text);color:#C9F5E2;background:var(--mint-soft);border-radius:18px;padding:22px 30px}
.board{display:flex;flex-direction:column;gap:18px;flex:1}
.brow{display:grid;grid-template-columns:90px 1fr 220px 160px;gap:24px;align-items:center;background:var(--navy-2);border-radius:18px;padding:22px 34px;font:600 44px/1 var(--text)}
.brow .r{font:700 48px/1 var(--display);color:var(--mint)}
.brow .g{color:var(--mint);font-size:34px;text-align:right}
.brow .p{text-align:right;font-family:var(--display)}
.qcorner{position:absolute;right:110px;bottom:40px;display:flex;align-items:center;gap:22px;font:600 26px/1.3 var(--text);color:#AFC0CF;text-align:right}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;align-items:end;flex:1}
.pod{display:flex;flex-direction:column;align-items:center;gap:20px}
.pod .nm{font:700 52px/1.1 var(--display);text-align:center;word-break:break-word}
.pod .pt{font:600 34px/1 var(--text);color:#AFC0CF}
.pod .blk{width:100%;border-radius:22px 22px 0 0;display:grid;place-items:start center;padding-top:24px;font:700 110px/1 var(--display);color:var(--navy)}
.pod.p1 .blk{height:420px;background:var(--gold)}
.pod.p2 .blk{height:300px;background:#C9D3DC}
.pod.p3 .blk{height:220px;background:#D69B62}

/* HUD présentateur (hors scène, discret) */
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font:500 12px/1 var(--text);color:#7d8a96;opacity:0;transition:opacity .3s;pointer-events:none}
#show:hover #hud{opacity:1}
#hud button{pointer-events:auto;background:#1F3550;color:#EEF2EC;border:0;border-radius:6px;padding:6px 10px;font:500 12px var(--text);cursor:pointer;margin-left:6px}

/* Animations d'arrivée */
@media (prefers-reduced-motion:no-preference){
  .s.in > *{animation:rise .5s both}
  .s.in > *:nth-child(2){animation-delay:.08s}
  .s.in > *:nth-child(3){animation-delay:.16s}
  .s.in > *:nth-child(4){animation-delay:.24s}
  .s.in > *:nth-child(5){animation-delay:.32s}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}}
}

/* ---------- Téléphone du public ---------- */
.play{min-height:100%;background:var(--navy);color:#EEF2EC;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.play header{display:flex;justify-content:space-between;align-items:center;font:600 14px/1.2 var(--text);color:#AFC0CF;gap:12px}
.play header b{color:var(--mint);font-family:var(--display);font-size:18px}
.play main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:18px 0;max-width:520px;width:100%;margin:0 auto}
.play h1{font:700 30px/1.15 var(--display);margin:0}
.play p{margin:0;color:#C6D3DE}
.play input{font:600 22px var(--text);padding:14px 16px;border-radius:12px;border:2px solid var(--navy-3);background:var(--navy-2);color:#fff;width:100%}
.play input:focus{outline:none;border-color:var(--mint)}
.pbtn{min-height:56px;border:0;border-radius:14px;background:var(--mint);color:var(--navy);font:700 20px var(--text);cursor:pointer;width:100%}
.pbtn:disabled{opacity:.4}
.pq{font:700 22px/1.25 var(--display);margin:0}
.pops{display:grid;gap:12px}
.popt{min-height:72px;border:0;border-radius:16px;color:#fff;font:600 19px/1.2 var(--text);display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;cursor:pointer}
.popt .L{flex:none;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font:700 22px var(--display)}
.popt:disabled{opacity:.35}
.popt.pick{opacity:1;box-shadow:0 0 0 4px #fff}
.ptbar{height:8px;border-radius:4px;background:var(--navy-3);overflow:hidden}
.ptbar i{display:block;height:100%;background:var(--mint);transform-origin:left}
.res{font:700 40px/1.1 var(--display);margin:0}
.res.ok{color:var(--mint)}.res.ko{color:#FF8F86}
.score{font:600 18px/1.4 var(--text);color:#C6D3DE}
.score b{color:#fff;font-size:24px}
.err{color:#FF8F86;font-size:15px}

/* ---------- Ville 3D ---------- */
#city,#pcity{position:fixed;inset:0;background:#07121f}
.c3-canvas{display:block;width:100%;height:100%;touch-action:none}
.c3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.c3-tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px/1.2 var(--text);letter-spacing:.08em;text-transform:uppercase;color:#C9F5E2;white-space:nowrap;text-shadow:0 0 8px rgba(111,227,180,.6)}
.c3-tag b{background:rgba(7,18,31,.72);border:1px solid rgba(111,227,180,.45);border-radius:4px;padding:3px 8px;font-weight:600}
.c3-tag span{font-size:12px;color:#fff;letter-spacing:0}
.c3-tag.on b{background:rgba(111,227,180,.25);border-color:#6FE3B4;color:#fff}
.c3-pl{position:absolute;left:0;top:0;font:600 12px/1 var(--text);color:#fff;background:rgba(7,18,31,.7);border-radius:999px;padding:3px 8px;white-space:nowrap}
#show.c3 #stage{pointer-events:none}
#show.c3.free #stage .holo{opacity:.25}
.holo{position:absolute;left:72px;top:72px;width:780px;max-height:930px;display:flex;flex-direction:column;gap:24px;padding:46px 48px;background:linear-gradient(160deg,rgba(10,28,46,.88),rgba(7,18,31,.8));border:2px solid rgba(111,227,180,.5);border-radius:8px;box-shadow:0 0 0 1px rgba(95,212,255,.15),0 0 70px rgba(111,227,180,.16);color:#EEF2EC;overflow:hidden;transition:opacity .3s}
.holo::before,.holo::after{content:"";position:absolute;width:46px;height:46px;border:4px solid var(--mint);pointer-events:none}
.holo::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.holo::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.holo .scan{position:absolute;left:0;right:0;height:140px;top:-140px;background:linear-gradient(180deg,transparent,rgba(111,227,180,.09),transparent);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.holo .scan{animation:scan 4.5s linear infinite}@keyframes scan{to{top:100%}}.holo.in{animation:holoIn .55s both}@keyframes holoIn{from{opacity:0;transform:translateX(-30px) scale(.98)}}}
.holo p{margin:0}
.holo .eb{font:600 22px/1.2 var(--text);letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin:0}
.holo h1{font:700 96px/1 var(--display)!important;margin:0}
.holo h2{font:700 60px/1.05 var(--display);margin:0}
.holo .cards{display:grid;grid-template-columns:1fr!important;gap:14px}
.holo .cards[style*="1fr 1fr"]{grid-template-columns:1fr 1fr!important}
.holo .cardS{flex-direction:row;align-items:flex-start;gap:20px;padding:18px 22px!important;background:rgba(21,38,57,.72);border:1px solid rgba(111,227,180,.25);border-radius:10px}
.holo .cardS .ic{font-size:40px}
.holo .cardS h3{font:700 30px/1.15 var(--display);margin:0 0 6px}
.holo .cardS p{font:400 23px/1.4 var(--text);color:#C6D3DE}
.holo .strip{font:500 24px/1.4 var(--text);padding:16px 22px;background:rgba(29,58,58,.8);color:#C9F5E2;border-radius:10px}
.holo .statement{font:700 38px/1.2 var(--display)!important;color:var(--mint)}
.holo .pills{display:flex;flex-wrap:wrap;gap:10px}
.holo .pill{font:600 20px/1 var(--text);padding:10px 16px;background:rgba(21,38,57,.72);border:1px solid rgba(111,227,180,.25);border-radius:999px;color:#EEF2EC}
.holo .split{display:flex;flex-direction:column;gap:22px}
.holo .big{font:700 150px/.9 var(--display)!important;color:var(--mint)}
.holo .lead{font:500 28px/1.35 var(--text)!important}
.holo .muted{color:#AFC0CF}
.holo .bars{display:flex;flex-direction:column;gap:14px}
.holo .bar{display:grid;grid-template-columns:120px 1fr 100px;gap:16px;align-items:center;font:600 24px/1 var(--text)}
.holo .bar i{display:block;height:32px;border-radius:6px;background:var(--mint)}
.holo .bar.bad i{background:#8a96a3}
.holo .steps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.holo .step{padding:18px;background:rgba(21,38,57,.72);border:1px solid rgba(111,227,180,.25);border-radius:10px;display:flex;flex-direction:column;gap:8px}
.holo .step .no{width:44px;height:44px;font:700 24px/1 var(--display);background:var(--mint);color:var(--navy);border-radius:50%;display:grid;place-items:center}
.holo .step h3{font:700 28px/1.1 var(--display);margin:0}
.holo .step p{font:400 21px/1.35 var(--text);color:#C6D3DE}
.holo .motto{font:600 40px/1.2 var(--display)!important;color:var(--mint)}
.holo .names-row{display:flex;flex-wrap:wrap;gap:8px 26px;font:500 26px/1.2 var(--text);color:#C6D3DE}
.holo .jrow{display:flex;gap:30px;align-items:center}
.holo .qr{width:340px;height:340px;padding:18px;border-radius:16px;flex:none;background:#fff;display:grid;place-items:center}
.holo .qr img,.holo .qr canvas{width:304px!important;height:304px!important}
.holo .room{font:700 92px/1 var(--display);letter-spacing:.1em;color:var(--mint)}
.holo .url{font:500 22px/1.3 var(--text);color:#C6D3DE;word-break:break-all}
.holo .chips{display:flex;flex-wrap:wrap;gap:10px;max-height:150px;overflow:hidden}
.holo .chip{font:600 20px/1 var(--text);padding:8px 14px;pointer-events:auto}
.s.over{background:rgba(7,18,31,.84)!important;backdrop-filter:blur(5px)}
.h3d-top{position:absolute;top:40px;right:72px;font:600 24px/1 var(--text);color:#C9F5E2;display:flex;gap:10px;align-items:center;text-shadow:0 0 10px rgba(0,0,0,.8)}
.h3d-top b{color:var(--mint)}
.h3d-bot{position:absolute;left:72px;right:72px;bottom:36px;display:flex;justify-content:space-between;align-items:center;font:600 24px/1 var(--text);color:#AFC0CF;letter-spacing:.06em;text-shadow:0 0 10px rgba(0,0,0,.9)}
.h3d-bot b{color:var(--mint);font:700 34px/1 var(--display);letter-spacing:.1em}
.h3d-free{position:absolute;top:40px;left:50%;transform:translateX(-50%);font:600 26px/1 var(--text);color:var(--navy);background:var(--mint);padding:10px 20px;border-radius:999px}
.modes{display:flex;gap:10px;flex-wrap:wrap}
.modes label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff}
.modes label:has(input:checked){border-color:var(--green);background:var(--green-soft)}

/* téléphone : ville + interface par-dessus */
.play.c3{background:transparent;padding:0}
.ptop{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(7,18,31,.9),rgba(7,18,31,0));font:600 13px/1.2 var(--text);color:#C6D3DE;z-index:3}
.ptop b{color:var(--mint);font-family:var(--display)}
.pfollow{border:1px solid rgba(111,227,180,.5);background:rgba(7,18,31,.7);color:#C9F5E2;border-radius:999px;padding:8px 12px;font:600 13px var(--text);cursor:pointer}
.pfollow.on{background:var(--mint);color:var(--navy)}
.pnav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(7,18,31,.92),rgba(7,18,31,0));z-index:3;scrollbar-width:none}
.pnav button{flex:none;border:1px solid rgba(111,227,180,.45);background:rgba(7,18,31,.75);color:#EEF2EC;border-radius:999px;padding:10px 14px;font:600 14px var(--text);cursor:pointer}
.pinfo{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(10,28,46,.94);border:1px solid rgba(111,227,180,.5);border-radius:14px;padding:16px 18px;z-index:4;color:#EEF2EC}
.pinfo h3{margin:0 0 6px;font:700 20px/1.2 var(--display);color:var(--mint)}
.pinfo p{margin:0;color:#C6D3DE;font-size:15px;line-height:1.45}
.pinfo .x{position:absolute;top:8px;right:10px;border:0;background:none;color:#AFC0CF;font-size:22px;cursor:pointer}
.ptoast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(7,18,31,.85);border:1px solid rgba(111,227,180,.4);color:#C9F5E2;border-radius:999px;padding:8px 14px;font:600 13px var(--text);z-index:3;white-space:nowrap}
.pmodal{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:var(--navy);overflow-y:auto}
.play.c3 .pmodal{background:rgba(7,18,31,.86);backdrop-filter:blur(4px)}
.pmodal main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:18px 0;max-width:520px;width:100%;margin:0 auto}
.pghost{min-height:48px;border:1px solid rgba(111,227,180,.5);border-radius:14px;background:transparent;color:#C9F5E2;font:600 16px var(--text);cursor:pointer;width:100%}
</style>
</head>
<body>

<div id="homeView" class="home"><section class="card"><p class="fine">Loading…</p></section></div>

<div id="show" hidden>
  <div id="city" hidden></div>
  <div id="stage"></div>
  <div id="hud"><span id="hudL"></span><span><span id="hudR"></span><button type="button" id="hudFs">Plein écran (F)</button><button type="button" id="hudExit">Quitter (Échap)</button></span></div>
</div>

<div id="playView" class="play" hidden></div>

<script>
(function () {
  'use strict';
  const GROUP_ID = '7b6b51f8-8bca-44e2-b4b3-b9a030633127';   // groupe « ESIR » du QCM maths
  const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
  const DUR = 20;                                               // secondes par question
  const LS = { names: 'oral.names.v1', game: 'oral.game.v1', me: 'oral.player.v1', mode: 'oral.mode.v1' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
  };
  const LET = ['A', 'B', 'C', 'D'];
  const params = new URLSearchParams(location.search);

  /* =====================================================================
     Contenu : diapos (sp = orateur 1 à 5) et questions du quiz
     ===================================================================== */
  const S = [
    { id: 'cover', sp: 1, dark: true, title: 'Cover', html: N => `
      <p class="eb">Cities of the Future · Final Task</p>
      <h1>Changchong City</h1>
      <p class="motto">Smart for people, green for the planet.</p>
      <div class="names-row" style="margin-top:auto">${N.map(n => `<span>${esc(n)}</span>`).join('')}</div>` },
    { id: 'join', sp: 1, dark: true, join: true, title: 'Join the game (QR code)' },
    { id: 'q1', sp: 1, quiz: { q: 'By 2050, what share of humans will live in cities?', o: ['About 38 %', 'About 52 %', 'About 68 %', 'About 85 %'], ok: 2, why: 'About 68 %: two people out of three (United Nations, World Urbanization Prospects).' } },
    { id: 'challenges', sp: 1, title: 'Three challenges', html: () => `
      <p class="eb">The problem</p>
      <h2>Three challenges for 2050</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🌡️</div><h3>Climate change</h3><p>Heat waves, floods and storms are more and more frequent.</p></div>
        <div class="cardS"><div class="ic">⛏️</div><h3>Depletion of natural resources</h3><p>Oil, gas, metals and even clean water are limited.</p></div>
        <div class="cardS"><div class="ic">👥</div><h3>Increase in population</h3><p>68 % of humans will live in cities by 2050.</p></div>
      </div>
      <p class="statement">How can we solve all three at the same time?</p>` },
    { id: 'meet', sp: 1, title: 'Meet Changchong', html: () => `
      <p class="eb">Our answer</p>
      <h2>Meet Changchong</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🤖</div><h3>Smart</h3><p>Big data, AI and sensors collect data in real time.</p></div>
        <div class="cardS"><div class="ic">🌿</div><h3>Green</h3><p>Its goal: a smaller carbon footprint and zero waste.</p></div>
        <div class="cardS"><div class="ic">🔁</div><h3>Sustainable</h3><p>It lives on its own local resources.</p></div>
      </div>
      <div class="strip">📍 On the coast of southern China: strong wind, a port for trade… and earthquakes.</div>
      <div class="pills"><span class="pill">Architecture</span><span class="pill">Transport</span><span class="pill">Energy</span><span class="pill">Education</span><span class="pill">Health care</span><span class="pill">Security</span></div>` },
    { id: 'archi', sp: 1, title: 'Smart architecture', html: () => `
      <p class="eb">Pillar 1</p>
      <h2>Smart architecture</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🏗️</div><h3>Earthquake-proof</h3><p>Every building stands on rubber shock absorbers, a technology Japan has used for decades.</p></div>
        <div class="cardS"><div class="ic">🌳</div><h3>Green buildings</h3><p>Vertical gardens and parks on the roofs, like Singapore's Supertrees.</p></div>
        <div class="cardS"><div class="ic">🪵</div><h3>Low-carbon materials</h3><p>Wood, recycled steel, low-carbon concrete and solar glass.</p></div>
      </div>
      <p class="statement">A building that protects you… and produces energy.</p>` },
    { id: 'q2', sp: 1, quiz: { q: 'What keeps Changchong\'s buildings safe during an earthquake?', o: ['Giant magnets', 'Rubber shock absorbers', 'Floating foundations', 'Thick steel walls'], ok: 1, why: 'Rubber shock absorbers: the building moves slowly instead of breaking.' } },
    { id: 'transport', sp: 2, title: 'Smart transport', html: () => `
      <p class="eb">Pillar 2</p>
      <h2>Smart transport</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🚲</div><h3>Bikes</h3><p>Safe bike lanes everywhere. Get on a shared e-bike with an app.</p></div>
        <div class="cardS"><div class="ic">🚌</div><h3>Self-driving buses</h3><p>Electric, guided by sensors and AI. Track your bus in real time.</p></div>
        <div class="cardS"><div class="ic">🚇</div><h3>Metro</h3><p>Fast, electric and underground. It links all the districts.</p></div>
      </div>
      <div class="strip">🚦 Traffic lights adapt in real time &nbsp;·&nbsp; 💡 Street lights dim when the street is empty</div>` },
    { id: 'fifteen', sp: 2, title: 'The 15-minute city', html: () => `
      <p class="eb">Pillar 2 · Urban mobility</p>
      <div class="split">
        <div style="display:flex;flex-direction:column;gap:28px"><div class="big">15 min</div><p class="lead">Everything you need is 15 minutes away, on foot or by bike.</p><p class="muted lead" style="font-size:30px">An idea by Carlos Moreno, adopted by Paris.</p></div>
        <div style="display:flex;flex-direction:column;gap:30px"><div class="pills"><span class="pill">🏫 School</span><span class="pill">🛒 Shops</span><span class="pill">🩺 Doctor</span><span class="pill">🌳 Park</span><span class="pill">💼 Offices</span><span class="pill">⚽ Sport</span></div>
        <p class="statement" style="font-size:54px">If you lived here, you wouldn't need a car.</p></div>
      </div>` },
    { id: 'q3', sp: 2, quiz: { q: 'In which city are almost half of the trips to work or school made by bike?', o: ['London', 'Copenhagen', 'Rome', 'New York'], ok: 1, why: 'Copenhagen: between 43 % and 49 % of trips to work or school, depending on the year.' } },
    { id: 'q4', sp: 3, quiz: { q: 'Per kilowatt-hour, how much more CO₂ does coal emit than nuclear power?', o: ['2 times more', '10 times more', 'About 70 times more', '1,000 times more'], ok: 2, why: 'Coal: about 820 g of CO₂ per kWh. Nuclear: about 12 g (IPCC).' } },
    { id: 'energy', sp: 3, title: 'Smart energy', html: () => `
      <p class="eb">Pillar 3</p>
      <h2>A clean energy mix</h2>
      <div class="split" style="align-items:start">
        <div class="cards" style="grid-template-columns:1fr 1fr;gap:24px">
          <div class="cardS" style="padding:28px"><h3>⚛️ Nuclear</h3><p>Stable, day and night.</p></div>
          <div class="cardS" style="padding:28px"><h3>☀️ Solar</h3><p>Roofs and solar glass.</p></div>
          <div class="cardS" style="padding:28px"><h3>🌬️ Wind</h3><p>Turbines out at sea.</p></div>
          <div class="cardS" style="padding:28px"><h3>♻️ Waste</h3><p>Turned into power.</p></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:30px">
          <p class="lead" style="font-weight:600">CO₂ per kilowatt-hour</p>
          <div class="bars"><div class="bar bad"><span>Coal</span><i style="width:100%"></i><span>820 g</span></div><div class="bar"><span>Nuclear</span><i style="width:2%"></i><span>12 g</span></div></div>
          <p class="muted" style="font-size:26px">Source: IPCC, life-cycle emissions</p>
          <div class="strip">⚡ A smart grid: AI balances supply and demand, and batteries store the extra energy.</div>
        </div>
      </div>` },
    { id: 'waste', sp: 3, title: 'Waste becomes energy', html: () => `
      <p class="eb">Pillar 3 · Waste to energy</p>
      <h2>Garbage is a resource</h2>
      <div class="steps">
        <div class="step"><div class="no">1</div><h3>Sort</h3><p>Smart bins and underground pipes. No garbage trucks, no litter.</p></div>
        <div class="step"><div class="no">2</div><h3>Recycle</h3><p>Plastic, glass and metal get a second life.</p></div>
        <div class="step"><div class="no">3</div><h3>Transform</h3><p>Food waste becomes biogas. The rest is burnt with filters.</p></div>
        <div class="step"><div class="no">4</div><h3>Power</h3><p>Electricity and heat for the whole city.</p></div>
      </div>
      <div class="strip">🇸🇪 Sweden already sends less than 1 % of its household waste to landfill.</div>` },
    { id: 'education', sp: 4, title: 'Smart education', html: () => `
      <p class="eb">Pillar 4</p>
      <h2>Smart education</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🧑‍🏫</div><h3>AI hologram teachers</h3><p>A 3D teacher that explains again and again, at your own speed.</p></div>
        <div class="cardS"><div class="ic">💻</div><h3>Free online courses</h3><p>Open to everyone: students, workers and retired people.</p></div>
        <div class="cardS"><div class="ic">🥽</div><h3>VR school trips</h3><p>Walk on the Moon or visit ancient Rome without a bus.</p></div>
      </div>
      <div class="strip">👩‍🏫 Human teachers are still there to guide the class and help pupils who are struggling.</div>` },
    { id: 'health', sp: 4, title: 'Smart health care', html: () => `
      <p class="eb">Pillar 5</p>
      <h2>Smart health care</h2>
      <div class="split">
        <div class="cardS"><div class="ic">⌚</div><h3>Your AI health assistant</h3><p>It tracks your heart rate and your sleep, reminds you to take your medicine and books a real doctor when something is wrong.</p></div>
        <div style="display:flex;flex-direction:column;gap:30px"><p class="statement" style="font-size:84px">AI helps,<br>doctors decide.</p><p class="lead muted">And your health data stays private.</p></div>
      </div>` },
    { id: 'food', sp: 4, title: 'Smart restaurants', html: () => `
      <p class="eb">And also…</p>
      <h2>Smart restaurants</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🤖</div><h3>Robot chefs</h3><p>Fast, clean, always the same quality.</p></div>
        <div class="cardS"><div class="ic">🍜</div><h3>Robot waiters</h3><p>As in some restaurants in China and Japan today.</p></div>
        <div class="cardS"><div class="ic">📉</div><h3>Less food waste</h3><p>AI predicts how many customers will come.</p></div>
      </div>` },
    { id: 'q5', sp: 4, quiz: { q: 'In Changchong, who makes the final decision about your health?', o: ['The AI assistant', 'Your smartwatch', 'A real doctor', 'A robot chef'], ok: 2, why: 'AI helps, doctors decide: a machine never makes the final decision.' } },
    { id: 'security', sp: 5, title: 'Smart security', html: () => `
      <p class="eb">Pillar 6</p>
      <h2>Smart security</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🌱</div><h3>Smart credit</h3><p>Recycle, cycle, volunteer: earn green points for free transport and cheaper concerts. It never punishes.</p></div>
        <div class="cardS"><div class="ic">🔑</div><h3>Smart prison</h3><p>A second chance: training, online courses and an AI coach to find a job, like Halden in Norway.</p></div>
        <div class="cardS"><div class="ic">🔒</div><h3>Privacy first</h3><p>Data is protected by law, anonymous and never sold.</p></div>
      </div>` },
    { id: 'q6', sp: 5, quiz: { q: 'How do you earn green points in Changchong?', o: ['By buying a bigger car', 'By recycling and cycling to work', 'By paying more taxes', 'By watching adverts'], ok: 1, why: 'Good actions for the city earn points: recycling, cycling, helping a neighbour, volunteering.' } },
    { id: 'vote', sp: 5, dark: true, title: 'Why vote for Changchong?', html: () => `
      <p class="eb">To conclude</p>
      <h2>Why vote for Changchong?</h2>
      <div class="cards c3">
        <div class="cardS"><div class="ic">🌿</div><h3>Green</h3><p>Clean energy, garbage turned into power, nature on every building.</p></div>
        <div class="cardS"><div class="ic">🤖</div><h3>Smart</h3><p>AI saves time on the roads, energy in the grid and lives in hospitals.</p></div>
        <div class="cardS"><div class="ic">🤝</div><h3>Human</h3><p>Education and health care for everyone, and a second chance.</p></div>
      </div>
      <p class="motto" style="font-size:72px">“Smart for people, green for the planet!”</p>` },
    { id: 'podium', sp: 5, dark: true, podium: true, title: 'Quiz podium' },
    { id: 'thanks', sp: 5, dark: true, title: 'Thank you', html: N => `
      <p class="eb">Changchong City</p>
      <h1 style="font-size:130px">Thank you for listening!</h1>
      <p class="lead" style="color:#C6D3DE">Any questions?</p>
      <p class="motto" style="margin-top:auto">Smart for people, green for the planet.</p>
      <div class="names-row">${N.map(n => `<span>${esc(n)}</span>`).join('')}</div>` }
  ];
  /* ---------- La ville 3D : quartiers (coordonnées dans la scène) et caméra de chaque diapo ---------- */
  const ZONES = [
    { id: 'core', name: 'Changchong Core', x: 0, z: 0, r: 20, cam: [40, 60, 64], look: 26, info: 'The AI brain of the city: big data from thousands of sensors, in real time.' },
    { id: 'archi', name: 'Smart Architecture', x: -68, z: -25, r: 24, info: 'Earthquake-proof towers on rubber shock absorbers, vertical gardens, parks on the roofs and solar glass.' },
    { id: 'security', name: 'Smart Security', x: -30, z: -66, r: 22, info: 'Green points for good actions, a prison that gives a second chance, and data that is never sold.' },
    { id: 'transport', name: 'Smart Transport', x: 36, z: -62, r: 20, info: 'Self-driving electric buses, safe bike lanes, an underground metro and traffic lights that adapt in real time.' },
    { id: 'energy', name: 'Energy Coast', x: 92, z: -12, r: 28, cam: [-58, 40, 24], info: 'Nuclear power for a stable base, solar panels, wind turbines at sea, and a smart grid managed by AI.' },
    { id: 'waste', name: 'Waste to Energy', x: 55, z: 46, r: 18, info: 'Smart bins and underground pipes: garbage is sorted, recycled and turned into electricity and heat.' },
    { id: 'food', name: 'Robot Restaurants', x: 6, z: 72, r: 16, info: 'Robot chefs and robot waiters. AI predicts how many customers will come, so there is less food waste.' },
    { id: 'school', name: 'Smart School', x: -46, z: 56, r: 20, info: 'AI hologram teachers, free online courses and VR school trips.' },
    { id: 'hospital', name: 'Smart Hospital', x: -78, z: 21, r: 20, info: 'An AI health assistant tracks your heart and your sleep. AI helps, doctors decide.' }
  ];
  const zoneAt = (x, z) => { const f = ZONES.find(q => Math.hypot(x - q.x, z - q.z) <= q.r + 3); return f ? f.id : null; };
  const CAM = { meet: 'core', archi: 'archi', q2: 'archi', transport: 'transport', q3: 'transport', q4: 'energy', energy: 'energy', waste: 'waste', education: 'school', health: 'hospital', food: 'food', q5: 'hospital', security: 'security', q6: 'security' };
  S.forEach(s => { s.cam = CAM[s.id] || 'overview'; s.ring = s.id === 'fifteen'; });
  const webgl = (() => { try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; } })();
  const loadCityMod = () => import('./city.js?v=2026111504');

  const QUIZ = S.filter(s => s.quiz);
  QUIZ.forEach((s, i) => { s.qn = i + 1; s.title = 'Quiz ' + (i + 1) + ' · ' + s.quiz.q; });

  const names = () => { const n = ls.get(LS.names, []); return [0, 1, 2, 3, 4].map(i => (n[i] || '').trim() || 'Speaker ' + (i + 1)); };
  const mode3d = () => webgl && ls.get(LS.mode, '3d') === '3d';

  /* =====================================================================
     Téléphone du public (?play ou ?room=…) : page publique, sans compte
     ===================================================================== */
  if (params.has('play') || params.has('room')) { startPlayer(); return; }

  /* =====================================================================
     Page privée : connexion + membre du groupe ESIR
     ===================================================================== */
  const home = $('#homeView');
  document.documentElement.lang = 'fr';
  let sb = null, me = null, booted = false;
  function gate(html) { home.innerHTML = `<section class="card">${html}</section>`; }
  function boot() {
    const A = window.SiteAccount;
    if (!A) { setTimeout(boot, 200); return; }
    if (!boot.hooked) { boot.hooked = true; A.on('change', boot); }
    if (!A.user || !A.client) {
      gate(`<p class="eyebrow">Page privée</p><h2>Connecte-toi d'abord</h2><p class="fine">Cette page est réservée au groupe ESIR. Connecte-toi sur <a href="../">l'accueil</a> (le compte est partagé par tout le site), puis reviens ici.</p>`);
      return;
    }
    if (booted) return;
    booted = true; sb = A.client; me = A.user;
    checkMember();
  }
  async function checkMember() {
    const { data, error } = await sb.from('memberships').select('user_id').eq('group_id', GROUP_ID).eq('user_id', me.id).maybeSingle();
    if (error || !data) { gate(`<p class="eyebrow">Page privée</p><h2>Accès réservé</h2><p class="fine">Cette page est réservée aux membres du groupe ESIR.</p><p><a class="btn" href="../">Retour à l'accueil</a></p>`); return; }
    G.load(); renderHome();
  }

  /* ---------- Partie (scores), gardée dans le navigateur pour survivre à un rechargement ---------- */
  const G = {
    room: null, players: {}, ans: {}, banned: [], slide: 0,
    load() {
      const g = ls.get(LS.game, null);
      if (g && g.room) Object.assign(this, { room: g.room, players: g.players || {}, ans: g.ans || {}, banned: g.banned || [], slide: g.slide || 0 });
      else this.reset();
    },
    reset() { this.room = String(1000 + Math.floor(Math.random() * 9000)); this.players = {}; this.ans = {}; this.banned = []; this.slide = 0; this.save(); },
    save() { ls.set(LS.game, { room: this.room, players: this.players, ans: this.ans, banned: this.banned, slide: this.slide }); },
    joinUrl() { return location.origin + location.pathname + '?room=' + this.room; },
    shortUrl() { return (location.host + location.pathname).replace(/index\.html$/, '') + '?play'; },
    total(pid) { let t = 0; Object.values(this.ans).forEach(q => { if (q[pid]) t += q[pid].pts || 0; }); return t; },
    ranking() {
      return Object.keys(this.players).filter(p => !this.banned.includes(p))
        .map(p => ({ pid: p, name: this.players[p].name, pts: this.total(p) })).sort((a, b) => b.pts - a.pts);
    }
  };

  function renderHome() {
    const N = ls.get(LS.names, []);
    home.innerHTML = `
      <header><p class="eyebrow">Groupe ESIR · page privée</p><h1>Oral d'anglais : Changchong City</h1>

  function go(i) {

  /* ---------- Clavier, clic ---------- */
  addEventListener('keydown', e => {
    if (show.hidden) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
    else if ((e.key === 'e' || e.key === 'E') && is3d()) { city.quake(); send('fx', { t: 'quake' }); }

  /* ---------- Temps réel (présentateur) ---------- */
  let chanOk = false;
  function connect() {
    if (chan) return;
    chan = sb.channel('oral-' + G.room, { config: { broadcast: { self: false } } });
    chan.on('presence', { event: 'sync' }, () => {
      const st = chan.presenceState(); online = {};
      Object.values(st).forEach(arr => arr.forEach(m => { if (m.pid) online[m.pid] = String(m.name || '?').slice(0, 20); }));
      Object.keys(online).forEach(p => { G.players[p] = { name: online[p] }; });
      G.save(); refreshLive();
    });
    chan.on('broadcast', { event: 'hello' }, () => broadcastState());
    chan.on('broadcast', { event: 'ans' }, ({ payload: a }) => {
      const s = S[cur];
      if (!a || !s.quiz || phase !== 'ask' || a.qid !== s.id || G.banned.includes(a.pid)) return;
      const A = G.ans[s.id] || (G.ans[s.id] = {});
      if (A[a.pid]) return;                                   // une seule réponse par question
      const t = (Date.now() - askAt) / 1000, k = +a.k;
      if (t > DUR + 1 || !(k >= 0 && k < 4)) return;
      const ok = k === s.quiz.ok;
      A[a.pid] = { k, t: Math.round(t * 10) / 10, pts: ok ? Math.round(1000 * (1 - 0.5 * Math.min(1, t / DUR))) : 0 };
      if (a.name) G.players[a.pid] = { name: String(a.name).slice(0, 20) };
      G.save(); refreshLive();
    });
    chan.subscribe(st => {
      chanOk = st === 'SUBSCRIBED';
      if (chanOk) broadcastState();
      if (!show.hidden) refreshLive();
    });
    // positions des téléphones dans la ville : canal à part, écouté par le présentateur seulement
    chanPos = sb.channel('oral-' + G.room + '-pos', { config: { broadcast: { self: false } } });
    chanPos.on('broadcast', { event: 'pos' }, ({ payload: p }) => {
      if (!p || !p.pid || G.banned.includes(p.pid)) return;
      const x = +p.x, z = +p.z; if (!isFinite(x) || !isFinite(z)) return;
      POS[p.pid] = { x: Math.max(-160, Math.min(160, x)), z: Math.max(-160, Math.min(160, z)), t: Date.now() };
    });
    chanPos.subscribe();
    clearInterval(mapTimer);
    mapTimer = setInterval(shareMap, 2000);
  }
  let chanPos = null, mapTimer = null; const POS = {};
  // toutes les 2 s : drones sur l'écran + carte envoyée aux téléphones (positions et nombre par quartier)
  function shareMap() {
    const now = Date.now(), list = [], counts = {};
    Object.keys(POS).forEach(pid => {
      const p = POS[pid];
      if (now - p.t > 45000 || !online[pid] || G.banned.includes(pid)) return;
      list.push({ id: pid, name: online[pid], x: p.x, z: p.z });
      const zz = zoneAt(p.x, p.z); if (zz) counts[zz] = (counts[zz] || 0) + 1;
    });
    if (city) { city.setPlayers(list); city.setCounts(counts); }
    if (list.length || shareMap.had) send('map', { p: list.map(o => [o.id, Math.round(o.x), Math.round(o.z), o.name]), c: counts });
    shareMap.had = list.length > 0;
  }
  function send(event, payload) { if (chan && chanOk) chan.send({ type: 'broadcast', event, payload }).catch(() => {}); }
  function broadcastState() {
    const s = S[cur], st = { phase: 'wait', title: s.title || '', slide: cur, cam: s.cam, ring: s.ring };
    if (s.quiz) {
      st.qid = s.id; st.qn = s.qn; st.qt = QUIZ.length; st.q = s.quiz.q; st.o = s.quiz.o;
      if (phase === 'ask') { st.phase = 'ask'; st.left = Math.max(0, DUR * 1000 - (Date.now() - askAt)); st.dur = DUR * 1000; }
      else { st.phase = phase; st.ok = s.quiz.ok; }
    }
    if (s.podium || s.id === 'thanks') st.phase = 'end';
    if (st.phase !== 'ask') {
      // résultat de chacun : [total, gain à cette question, réponse (-1 = aucune), rang]
      const R = G.ranking(), A = (s.quiz && G.ans[s.id]) || {};
      st.p = {}; R.forEach((r, i) => { st.p[r.pid] = [r.pts, A[r.pid] ? A[r.pid].pts : 0, A[r.pid] ? A[r.pid].k : -1, i + 1]; });
      st.n = R.length;
    }
    st.banned = G.banned;
    send('st', st);
  }

  function startPlayer() {
    $('#homeView').hidden = true;
    const view = $('#playView'); view.hidden = false;
    document.body.style.background = 'var(--navy)';
    view.innerHTML = `<div id="pcity" hidden></div><div class="ptop" id="ptop" hidden></div><div class="ptoast" id="ptoast" hidden></div>
      <div class="pinfo" id="pinfo" hidden></div><div class="pnav" id="pnav" hidden></div><div class="pmodal" id="pmodal"><main></main></div>`;
    const P = ls.get(LS.me, null) || {};
    if (!P.pid) P.pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    if (P.follow == null) P.follow = true;
    let room = (params.get('room') || '').replace(/\D/g, '').slice(0, 4);
    let ch = null, ok = false, st = null, picked = {}, tmr = null, rcvAt = 0;
    let city = null, counts = {}, lastCam = null, info = null, dismissed = null, toastT = null, posT = null, httpOk = true, posCh = null;
    const last = { x: 1e9, z: 1e9, t: 0 };
    const save = () => ls.set(LS.me, P);
    const modal = $('#pmodal'), mm = modal.querySelector('main');
    const C = () => window.QCM_CONFIG;

    function screen(html) {
      modal.hidden = false; $('#pinfo').hidden = true;
      mm.innerHTML = (room && P.name ? `<p class="score" style="text-align:center">${esc(P.name)} · code <b>${room}</b></p>` : '<p class="score" style="text-align:center">Changchong City</p>') + html;
    }
    function explore() { modal.hidden = true; }
    function toast(txt, ms = 3500) {
      const t = $('#ptoast'); t.textContent = txt; t.hidden = false;
      clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
    }

    /* ---------- Formulaires ---------- */
    function askCode(err) {
      screen(`<h1>Join Changchong City</h1><p>Type the code shown on the screen.</p>
        <form id="f" style="display:grid;gap:12px"><input id="code" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="1234" aria-label="Code" value="${esc(room)}">
        ${err ? `<p class="err">${esc(err)}</p>` : ''}<button class="pbtn">Next</button></form>`);
      $('#f').addEventListener('submit', e => { e.preventDefault(); const c = $('#code').value.replace(/\D/g, ''); if (c.length !== 4) { askCode('The code has 4 digits.'); return; } room = c; askName(); });
    }
    function askName(err) {
      screen(`<h1>Choose a nickname</h1><p>Your drone will fly over the city with this name, and it will appear on the leaderboard. Keep it friendly!</p>
        <form id="f" style="display:grid;gap:12px"><input id="nm" autocomplete="nickname" maxlength="16" placeholder="Nickname" aria-label="Nickname" value="${esc(P.name || '')}">
        ${err ? `<p class="err">${esc(err)}</p>` : ''}<button class="pbtn">Join</button></form>`);
      $('#nm').focus();
      $('#f').addEventListener('submit', e => { e.preventDefault(); const n = $('#nm').value.trim().replace(/\s+/g, ' '); if (n.length < 2) { askName('At least 2 characters.'); return; } P.name = n; save(); join(); });
    }

    /* ---------- Connexion ---------- */
    async function join() {
      screen('<h1>Connecting…</h1>');
      try {
        if (!window.supabase || !window.supabase.createClient) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = SUPABASE_JS; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
        const cl = window.supabase.createClient(C().supabaseUrl, C().supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
        join.cl = cl;
        if (ch) ch.unsubscribe();
        ch = cl.channel('oral-' + room, { config: { broadcast: { self: false }, presence: { key: P.pid } } });
        ch.on('broadcast', { event: 'st' }, ({ payload }) => { st = payload; rcvAt = Date.now(); onState(); });
        ch.on('broadcast', { event: 'map' }, ({ payload }) => onMap(payload));
        ch.on('broadcast', { event: 'fx' }, ({ payload }) => {
          if (payload && payload.t === 'quake') {
            if (city) city.quake();
            if (navigator.vibrate) navigator.vibrate([300, 80, 400, 80, 600]);
            toast('🌍 Earthquake! The towers are moving… but they stand.', 4500);
          }
        });
        ch.subscribe(async s => {
          if (s === 'SUBSCRIBED') {
            ok = true;
            await ch.track({ pid: P.pid, name: P.name });
            ch.send({ type: 'broadcast', event: 'hello', payload: { pid: P.pid } });
            if (!city && webgl) loadCity();
            if (!st) waiting();
          } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') {
            ok = false; screen(`<h1>Connection lost</h1><p>Check your internet connection.</p><button class="pbtn" id="re">Try again</button>`);
            $('#re').addEventListener('click', join);
          }
        });
      } catch (e) {
        screen(`<h1>Connection failed</h1><p>Check your internet connection.</p><button class="pbtn" id="re">Try again</button>`);
        $('#re').addEventListener('click', join);
      }
    }
    function waiting() {
      if (city) { explore(); toast('👋 Explore the city! Your drone is on the big screen.', 4500); return; }
      screen(`<h1>You're in, ${esc(P.name)}!</h1><p>Watch the screen. The questions will appear here.</p><p class="score">Code ${room}. If nothing happens, the presentation may not have started yet.</p>`);
    }

    /* ---------- Ville 3D sur le téléphone ---------- */
    async function loadCity() {
      try {
        const m = await loadCityMod();
        $('#pcity').hidden = false;
        city = m.createCity($('#pcity'), { mode: 'player', zones: ZONES, lite: true, onPick: id => { follow(false); city.fly(id, 1.6); showInfo(id); }, onUser: () => follow(false) });
      } catch (e) { console.warn(e); city = null; $('#pcity').hidden = true; return; }
      view.classList.add('c3');
      const top = $('#ptop'); top.hidden = false;
      top.innerHTML = `<span>${esc(P.name)} · <b>${room}</b></span><button type="button" class="pfollow" id="pfol">📡 Follow the screen</button>`;
      $('#pfol').addEventListener('click', () => { follow(!P.follow); if (P.follow && lastCam) city.fly(lastCam, 1.6); });
      follow(P.follow);
      const nav = $('#pnav'); nav.hidden = false;
      nav.innerHTML = ZONES.map(z => `<button type="button" data-z="${z.id}">${esc(z.name)}</button>`).join('');
      nav.addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (!b) return; follow(false); city.fly(b.dataset.z, 1.6); showInfo(b.dataset.z); });
      $('#pinfo').addEventListener('click', e => { if (e.target.closest('.x')) { $('#pinfo').hidden = true; info = null; } });
      if (st && st.cam) { lastCam = st.cam; if (P.follow) city.fly(st.cam, 0.01); city.ring15(!!st.ring); }
      clearInterval(posT); posT = setInterval(sendPos, 2000);
      if (st) onState(); else waiting();
    }
    function follow(on) {
      P.follow = !!on; save();
      const b = $('#pfol'); if (b) b.classList.toggle('on', P.follow);
    }
    function showInfo(id) {
      const z = ZONES.find(q => q.id === id); if (!z) return; info = id;
      const el = $('#pinfo'), n = counts[id] || 0; el.hidden = false;
      el.innerHTML = `<button type="button" class="x" aria-label="Close">×</button><h3>${esc(z.name)}</h3><p>${esc(z.info)}</p><p style="margin-top:8px;color:#6FE3B4">👥 ${n} ${n === 1 ? 'person' : 'people'} here</p>`;
    }
    function onMap(m) {
      if (!m) return;
      counts = m.c || {};
      if (city) {
        city.setPlayers((m.p || []).filter(r => r[0] !== P.pid).map(r => ({ id: r[0], x: r[1], z: r[2], name: r[3] })));
        city.setCounts(counts);
      }
      if (info && !$('#pinfo').hidden) showInfo(info);
    }
    // position envoyée au présentateur (seulement s'il a bougé), par l'API HTTP pour ne pas inonder les autres téléphones
    async function sendPos() {
      if (!city || !ok) return;
      const p = city.pos(), now = Date.now();
      if (Math.hypot(p.x - last.x, p.z - last.z) < 1.5 && now - last.t < 12000) return;
      last.x = p.x; last.z = p.z; last.t = now;
      const payload = { pid: P.pid, x: p.x, z: p.z };
      if (httpOk) {
        try {
          const r = await fetch(C().supabaseUrl + '/realtime/v1/api/broadcast', {
            method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C().supabaseAnonKey },
            body: JSON.stringify({ messages: [{ topic: 'oral-' + room + '-pos', event: 'pos', payload, private: false }] })
          });
          if (r.ok) return;
          httpOk = false;
        } catch (e) { httpOk = false; }
      }
      // secours : canal temps réel (reçoit aussi les positions des autres, ignorées)
      if (!posCh && join.cl) { posCh = join.cl.channel('oral-' + room + '-pos', { config: { broadcast: { self: false } } }); posCh.subscribe(); }
      if (posCh) posCh.send({ type: 'broadcast', event: 'pos', payload }).catch(() => {});
    }

    /* ---------- État de la présentation ---------- */
    function onState() {
      if (!st) return;
      if (city && st.cam && st.cam !== lastCam) { lastCam = st.cam; if (P.follow) city.fly(st.cam, 1.8); }
      if (city) city.ring15(!!st.ring);
      draw();
    }
    function scoreLine() {
      const r = st && st.p && st.p[P.pid];
      return r ? `<p class="score">Score <b>${r[0]}</b> · rank <b>${r[3]}</b> / ${st.n}</p>` : '';
    }
    const backBtn = () => city ? '<button type="button" class="pghost" id="back">🌆 Back to the city</button>' : '';
    function bindBack(key) { const b = $('#back'); if (b) b.addEventListener('click', () => { dismissed = key; explore(); }); }
    function draw() {
      clearInterval(tmr);
      if (!st) return;
      if (st.banned && st.banned.includes(P.pid)) { screen('<h1>You have been removed from the game.</h1>'); return; }
      const key = st.phase + ':' + (st.qid || '') + ':' + st.slide;
      if (st.phase === 'ask') {
        const mine = picked[st.qid];
        screen(`<p class="score">Question ${st.qn} / ${st.qt}</p><p class="pq">${esc(st.q)}</p>
          <div class="ptbar"><i id="pt"></i></div>
          <div class="pops">${st.o.map((o, k) => `<button type="button" class="popt o${k}${mine === k ? ' pick' : ''}" data-k="${k}"${mine != null ? ' disabled' : ''}><span class="L">${LET[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
          ${mine != null ? '<p>Answer sent! Wait for the result…</p>' : ''}`);
        const end = rcvAt + st.left;
        const upd = () => { const pt = $('#pt'); if (pt) pt.style.transform = `scaleX(${Math.max(0, (end - Date.now()) / st.dur)})`; };
        upd(); tmr = setInterval(upd, 150);
        mm.querySelectorAll('.popt').forEach(b => b.addEventListener('click', () => {
          if (picked[st.qid] != null || Date.now() > end + 500) return;
          picked[st.qid] = +b.dataset.k;
          ch.send({ type: 'broadcast', event: 'ans', payload: { pid: P.pid, name: P.name, qid: st.qid, k: +b.dataset.k } });
          if (navigator.vibrate) navigator.vibrate(30);
          draw();
        }));
        return;
      }
      if (dismissed === key) { explore(); return; }
      if (st.phase === 'reveal' || st.phase === 'board') {
        const r = st.p && st.p[P.pid], k = r ? r[2] : -1;
        const good = k === st.ok;
        screen(`<p class="score">Question ${st.qn} / ${st.qt}</p>
          ${k < 0 ? '<p class="res">⏱ No answer</p>' : good ? `<p class="res ok">✓ Correct! +${r[1]}</p>` : '<p class="res ko">✗ Wrong answer</p>'}
          <p>The answer was <b style="color:#fff">${LET[st.ok]}: ${esc(st.o[st.ok])}</b></p>${scoreLine()}${backBtn()}`);
        bindBack(key);
        return;
      }
      if (st.phase === 'end') {
        const r = st.p && st.p[P.pid];
        screen((r ? `<h1>${r[3] === 1 ? '🏆 You won!' : r[3] <= 3 ? '🥇 Top 3!' : 'Thanks for playing!'}</h1><p class="score">Final score <b>${r[0]}</b> · rank <b>${r[3]}</b> / ${st.n}</p>` : '<h1>Thanks for playing!</h1>') + `<p>Don't forget to vote for Changchong City!</p>${backBtn()}`);
        bindBack(key);
        return;
      }
      if (city) { const was = modal.hidden; explore(); if (!was || draw.lastSlide !== st.slide) toast('📍 ' + (st.title || 'Changchong City')); draw.lastSlide = st.slide; return; }
      screen(`<h1>Listen carefully…</h1><p>The next question is coming soon.</p>${scoreLine()}`);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ch && ok) ch.send({ type: 'broadcast', event: 'hello', payload: { pid: P.pid } }); });

    save();
    if (room.length !== 4) askCode(); else if (!P.name) askName(); else join();
  }
})();
</script>
</body>
