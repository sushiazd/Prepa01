const IRREG = new Set([41, 44, 45, 46]);   // Nb, Ru, Rh, Pd : hors des règles du cours, jamais demandés
function klech(Z) { const o = {}; let e = Z; for (const s of ORDER) { if (e <= 0) break; const k = Math.min(e, CAP[s[1]]); o[s] = k; e -= k; } return o; }

}
const isExc = Z => JSON.stringify(conf(Z)) !== JSON.stringify(klech(Z));
const subKey = s => +s[0] * 10 + 'spdf'.indexOf(s[1]);
const sorted = o => Object.keys(o).filter(k => o[k] > 0).sort((a, b) => subKey(a) - subKey(b));

GEN.prop = (d, g) => {
  const mk = () => {
    const kind = g.pick(d === 0 ? ['EIp', 'EIc', 'Rp', 'Rc'] : d === 1 ? ['EIp', 'Rc', 'ENp', 'ENc', 'ion'] : ['anom', 'anom', 'ion', 'ENp', 'EIc']);
    const per = g.int(2, 4), base = [0, 0, 2, 10, 18][per];
    const mainCols = [1, 2, 13, 14, 15, 16, 17], colZ = col => base + (col <= 2 ? col : col - 10 + (per >= 4 ? 10 : 0));
    if (kind === 'EIp' || kind === 'Rp' || kind === 'ENp') {
      // paires écartées : voisines, et pour E.I. celles touchées par une anomalie (col. 2/13 ; 15/16)
      const anomal = (x, y) => [x, y].sort((u, v) => u - v).join() === '2,13' || [x, y].sort((u, v) => u - v).join() === '15,16';

      if (kind === 'ENp') return [`Lequel est le plus électronégatif : ${sym(A)} ou ${sym(B)} ?`, [A, B], right, `dans une période, \\(\\chi\\) augmente de gauche à droite : \\(\\chi(${sym(right)}) = ${String(EN[right]).replace('.', '{,}')}\\) contre \\(${String(EN[left]).replace('.', '{,}')}\\).`];
      return [`Lequel a le plus grand rayon atomique : ${sym(A)} ou ${sym(B)} ?`, [A, B], left, `dans une période, le rayon diminue de gauche à droite (\\(Z^*\\) augmente, les O.A. se contractent) : ${sym(left)}.`];
    }
    if (kind === 'EIc' || kind === 'Rc' || kind === 'ENc') {
      const col = g.pick([1, 2, 16, 17]), fams = { 1: [3, 11, 19, 37, 55], 2: [4, 12, 20, 38, 56], 16: [8, 16, 34, 52], 17: [9, 17, 35, 53] }[col];
      let A, B; do { [A, B] = g.shuffle(fams).slice(0, 2); } while (kind === 'ENc' && EN[A] === EN[B]);
      const up = A < B ? A : B, down = A < B ? B : A;
      if (kind === 'EIc') return [`Lequel a la plus grande énergie de 1<sup>re</sup> ionisation : ${sym(A)} ou ${sym(B)} ?`, [A, B], up, `dans une colonne, E.I. diminue quand \\(n\\) augmente (l'électron externe est plus loin du noyau) : ${sym(up)}.`];
      if (kind === 'ENc') return [`Lequel est le plus électronégatif : ${sym(A)} ou ${sym(B)} ?`, [A, B], up, `dans une colonne, \\(\\chi\\) diminue vers le bas : ${sym(up)}.`];
      return [`Lequel a le plus grand rayon atomique : ${sym(A)} ou ${sym(B)} ?`, [A, B], down, `dans une colonne, le rayon augmente quand \\(n\\) augmente (nouvelle couche) : ${sym(down)}.`];
    }
    if (kind === 'ion') {
      const [Z, q] = g.pick([[11, 1], [13, 3], [12, 2], [17, -1], [8, -2], [7, -3], [16, -2]]);
      const a = `\\mathrm{${sym(Z)}}`, b = `\\mathrm{${sym(Z)}}${chargeTex(q)}`;
      return [`Lequel est le plus gros : \\(${a}\\) ou \\(${b}\\) ?`, [['a', a], ['b', b]], q > 0 ? 'a' : 'b', q > 0 ? 'un cation est plus petit que l\'atome (moins d\'électrons, moins d\'écran, plus attirés).' : 'un anion est plus gros que l\'atome (plus d\'électrons, plus d\'écran et de répulsion).'];
    }
    const [A, B, why] = g.pick([[4, 5, 'Be (2s<sup>2</sup>, sous-couche pleine) est plus stable que B (2p<sup>1</sup>)'], [12, 13, 'Mg (3s<sup>2</sup> pleine) est plus stable que Al (3p<sup>1</sup>)'], [7, 8, 'N (2p<sup>3</sup>, demi-pleine) est plus stable que O (2p<sup>4</sup>)'], [15, 16, 'P (3p<sup>3</sup> demi-pleine) est plus stable que S (3p<sup>4</sup>)'], [30, 31, 'Zn (3d<sup>10</sup> 4s<sup>2</sup> pleines) est plus stable que Ga (4p<sup>1</sup>)']]);
    return [`Lequel a la plus grande énergie de 1<sup>re</sup> ionisation : ${sym(A)} ou ${sym(B)} ?`, [A, B], A, `<b>anomalie</b> : ${why}, donc E.I.(${sym(A)}) > E.I.(${sym(B)}) alors que ${sym(B)} est plus à droite.`];
  };
  const qs = [mk(), mk()];
  const opt = x => Array.isArray(x) ? { v: String(x[0]), t: `\\(${x[1]}\\)` } : { v: String(x), t: `${sym(x)}` };
  return { title: 'Évolution des propriétés', q: 'Répondre en justifiant (sur ta feuille) :',
    items: qs.map(([q, opts, ans], i) => ({ type: 'choice', label: `\\text{(${'ab'[i]})}`, pre: q, opts: opts.map(opt), ans: String(ans) })),
    corr: `<ul>${qs.map(([, , , why], i) => `<li>(${'ab'[i]}) ${why}</li>`).join('')}</ul>` };

  return { title: d === 2 ? 'Charges formelles et mésomérie' : 'Charges formelles', q: `Dans le schéma de Lewis de ${e.f} : ${e.s} Donner la charge formelle de chaque atome demandé${d === 2 ? ', puis le nombre de formes mésomères équivalentes (on déplace la liaison double)' : ''}.`, items,

};

// VSEPR : figure de répulsion selon n + p, géométrie selon (n, p), angles du cours
const FIG = { 2: 'linéaire', 3: 'triangle (plane triangulaire)', 4: 'tétraèdre', 5: 'bipyramide à base triangulaire', 6: 'octaèdre' };
const GEO = { '2,0': 'linéaire', '3,0': 'triangulaire plane', '2,1': 'coudée', '4,0': 'tétraédrique', '3,1': 'pyramide à base triangulaire', '2,2': 'coudée', '5,0': 'bipyramide à base triangulaire',
  '4,1': 'balançoire', '3,2': 'en forme de T', '2,3': 'linéaire', '6,0': 'octaédrique', '5,1': 'pyramide à base carrée', '4,2': 'plan carré' };
const ANG = { '2,0': '180°', '3,0': '120°', '2,1': 'un peu moins de 120°', '4,0': '109°28′', '3,1': 'un peu moins de 109°28′', '2,2': 'nettement moins de 109°28′', '5,0': '90° et 120°', '2,3': '180°', '6,0': '90°', '4,2': '90°' };
const AXE = (n, p) => `AX${n}${p ? 'E' + (p > 1 ? p : '') : ''}`;
GEN.vsepr = (d, g) => {
  const m = g.pick(MOL.filter(x => d === 0 ? x.p === 0 && x.n + x.p <= 4 : d === 1 ? x.p > 0 && x.n + x.p <= 4 : x.n + x.p >= 5)), key = m.n + ',' + m.p;
  const axes = [...new Set([AXE(m.n, m.p), AXE(m.n + m.p, 0), AXE(m.n, m.p + 1), AXE(Math.max(2, m.n - 1), m.p + 1), AXE(m.n + 1, m.p)])];
  const items = [{ type: 'choice', label: 'formulation', opts: optsOf(axes, AXE(m.n, m.p), 4, g).map(o => ({ v: o.v, t: o.v.replace(/(\d)/g, '<sub>$1</sub>') })), ans: AXE(m.n, m.p) },
    { type: 'choice', label: 'figure de répulsion', opts: optsOf(Object.values(FIG), FIG[m.n + m.p], 4, g), ans: FIG[m.n + m.p] },
    { type: 'choice', label: 'géométrie', opts: optsOf([...new Set(Object.values(GEO))], GEO[key], 4, g), ans: GEO[key] }];
  if (ANG[key] && d < 2) items.push({ type: 'choice', label: 'angle entre liaisons', opts: optsOf([...new Set(Object.values(ANG))], ANG[key], 4, g), ans: ANG[key] });
  return { title: 'Géométrie VSEPR', q: `Prévoir la géométrie de ${m.f} par la méthode VSEPR (atome central : ${m.A}).` + zData(m.f), items,
    corr: `<p>Autour de ${m.A} : n = ${m.n} atome${m.n > 1 ? 's' : ''} lié${m.n > 1 ? 's' : ''} et p = ${m.p} doublet${m.p > 1 ? 's' : ''} non liant${m.p > 1 ? 's' : ''} : <b>${AXE(m.n, m.p)}</b>. Les ${m.n + m.p} doublets (une liaison multiple compte pour une seule direction) se placent selon un <b>${FIG[m.n + m.p]}</b>.</p><p>Géométrie (on ne regarde que les atomes) : <b>${GEO[key]}</b>${ANG[key] ? `, angle ${ANG[key]}` : ''}.${m.p && m.n + m.p <= 4 ? ' Un doublet non liant prend plus de place qu\'un doublet liant : il resserre les angles (CH<sub>4</sub> 109°28′, NH<sub>3</sub> 107°, H<sub>2</sub>O 104,5°).' : ''}${m.n + m.p === 5 && m.p ? ' Sur la bipyramide, les doublets non liants vont en position équatoriale (plus de place).' : ''}</p>` };
};

// Hybridation de l'atome demandé, liaisons σ et π de la molécule (TD VI)
const HYB = [
  ['CH<sub>4</sub>', 'C', 'sp3', 4, 0, 0], ['NH<sub>3</sub>', 'N', 'sp3', 3, 0, 0], ['H<sub>2</sub>O', 'O', 'sp3', 2, 0, 0], ['BF<sub>3</sub>', 'B', 'sp2', 3, 0, 0], ['BeCl<sub>2</sub>', 'Be', 'sp', 2, 0, 0],
  ['C<sub>2</sub>H<sub>4</sub> (éthylène)', 'chaque C', 'sp2', 5, 1, 1], ['C<sub>2</sub>H<sub>2</sub> (acétylène)', 'chaque C', 'sp', 3, 2, 1], ['CO<sub>2</sub>', 'C', 'sp', 2, 2, 1], ['HCN', 'C', 'sp', 2, 2, 1], ['HCHO (méthanal)', 'C', 'sp2', 3, 1, 1],
  ['CH<sub>3</sub>CN', 'le C du groupe CN', 'sp', 5, 2, 2], ['CH<sub>3</sub>CN', 'le C du groupe CH<sub>3</sub>', 'sp3', 5, 2, 2], ['CH<sub>3</sub>OH', 'O', 'sp3', 5, 0, 2], ['N<sub>2</sub>H<sub>4</sub> (hydrazine)', 'chaque N', 'sp3', 5, 0, 2],
  ['HNO<sub>3</sub>', 'N', 'sp2', 4, 1, 2], ['H<sub>2</sub>O<sub>2</sub>', 'chaque O', 'sp3', 3, 0, 2]
];
const HYB_T = { sp: 'sp', sp2: 'sp²', sp3: 'sp³' }, HYB_A = { sp: '180°', sp2: '120°', sp3: '109°28′' }, HYB_N = { sp: 2, sp2: 3, sp3: 4 };
GEN.hyb = (d, g) => {
  const [f, at, h, sig, pi] = g.pick(HYB.filter(x => x[5] === d));
  const items = [{ type: 'choice', label: `hybridation de ${at.replace(/<[^>]+>/g, '')}`, opts: ['sp', 'sp2', 'sp3'].map(x => ({ v: x, t: HYB_T[x] })), ans: h }];
  if (d >= 1) items.push({ type: 'int', label: 'liaisons σ (molécule)', val: sig }, { type: 'int', label: 'liaisons π (molécule)', val: pi });
  if (d !== 1) items.push({ type: 'choice', label: 'angle autour de cet atome', opts: ['180°', '120°', '109°28′'].map(x => ({ v: x, t: x })), ans: HYB_A[h] });
  return { title: 'Hybridation', q: `Dans ${f}, quelle est l'hybridation de ${at}${d >= 1 ? ' ? Combien la molécule compte-t-elle de liaisons σ et de liaisons π' : ''}${d !== 1 ? ' ? Quel angle théorique autour de cet atome' : ''} ?` + zData(f), items,
    corr: `<p>Autour de ${at} : ${HYB_N[h]} directions (atomes liés + doublets non liants, une liaison multiple compte une fois), soit AX<sub>n</sub>E<sub>p</sub> avec n + p = ${HYB_N[h]} : hybridation <b>${HYB_T[h]}</b>, angles de ${HYB_A[h]}.</p>${d >= 1 ? `<p>Toute liaison simple est σ ; une double = 1 σ + 1 π ; une triple = 1 σ + 2 π. Ici : <b>${sig} σ</b> et <b>${pi} π</b>.</p>` : ''}<p class="fine">Correspondance : n + p = 2 → sp (linéaire, 2 orbitales p pures pour les π) ; 3 → sp² (plan, 1 p pure) ; 4 → sp³ (tétraèdre). L'hybridation explique en plus la planéité de C<sub>2</sub>H<sub>4</sub> : la liaison π bloque la rotation autour de C=C.</p>` };
};

// Polarité : différence d'électronégativité (Pauling, tableau du cours), polarité des molécules, caractère ionique partiel (TD IV ex. 9)
const BONDS = [[7, 1], [6, 8], [8, 1], [6, 17], [1, 17], [1, 35], [6, 1], [11, 17], [19, 9], [12, 8], [3, 9], [7, 8], [16, 8]];
const HX = [['HF', 1.83, 0.92], ['HCl', 1.08, 1.28], ['HBr', 0.82, 1.45], ['HI', 0.44, 1.66]];
const TEB = [['H<sub>2</sub>O', 'H<sub>2</sub>S', 'hb', 'H<sub>2</sub>O : liaisons hydrogène entre molécules (H lié à O très électronégatif)'], ['HF', 'HCl', 'hb', 'HF : liaisons hydrogène (H lié à F)'], ['NH<sub>3</sub>', 'PH<sub>3</sub>', 'hb', 'NH<sub>3</sub> : liaisons hydrogène (H lié à N)'],
  ['C<sub>2</sub>H<sub>5</sub>OH (éthanol)', 'CH<sub>3</sub>OCH<sub>3</sub> (méthoxyméthane)', 'hb', 'l\'éthanol : son groupe O–H fait des liaisons hydrogène, pas l\'éther'], ['C<sub>2</sub>H<sub>6</sub>', 'CH<sub>4</sub>', 'lo', 'C<sub>2</sub>H<sub>6</sub> : plus d\'électrons, plus polarisable, interactions de London plus fortes'], ['Br<sub>2</sub>', 'Cl<sub>2</sub>', 'lo', 'Br<sub>2</sub> : plus gros, plus polarisable (London)']];
const INTER = { hb: 'liaison hydrogène', ke: 'Keesom (entre dipôles permanents)', lo: 'London (dispersion, molécules polarisables)', io: 'liaison ionique' };
GEN.polar = (d, g) => {
  if (d === 0) {
    const [a, b] = g.pick(BONDS), dx = Math.round(Math.abs(EN[a] - EN[b]) * 10) / 10, neg = EN[a] > EN[b] ? a : b, ty = dx > 1.7 ? 'io' : 'co';
    return { title: 'Polarité d\'une liaison', q: `Liaison ${sym(a)}–${sym(b)}. Électronégativités (Pauling) : χ(${sym(a)}) = ${String(EN[a]).replace('.', ',')}, χ(${sym(b)}) = ${String(EN[b]).replace('.', ',')}.`,
      items: [{ type: 'num', label: 'Δχ', val: dx, unit: '', tol: 0.01 }, { type: 'choice', label: 'type de liaison', opts: [{ v: 'co', t: 'covalente polarisée' }, { v: 'io', t: 'ionique' }], ans: ty }, { type: 'choice', label: 'porte la charge δ−', opts: [a, b].map(z => ({ v: String(z), t: sym(z) })), ans: String(neg) }],
      corr: `<p>Δχ = |${String(EN[a]).replace('.', ',')} − ${String(EN[b]).replace('.', ',')}| = <b>${String(dx).replace('.', ',')}</b> ${dx > 1.7 ? '> 1,7 : liaison <b>ionique</b>' : '≤ 1,7 : liaison <b>covalente polarisée</b>'}. L'atome le plus électronégatif, <b>${sym(neg)}</b>, attire les électrons de la liaison et porte δ−.</p>` };
  }
  if (d === 1) {
    const ms = g.shuffle(MOL.filter(m => m.mu !== null)).slice(0, 2);
    return { title: 'Molécule polaire ou apolaire ?', q: 'Ces molécules ont-elles un moment dipolaire permanent ? (pense à leur géométrie VSEPR)',
      items: ms.map(m => ({ type: 'choice', label: m.f.replace(/<[^>]+>/g, '').replace(/ \(.*\)/, ''), opts: [{ v: 'p', t: 'polaire' }, { v: 'a', t: 'apolaire' }], ans: m.mu ? 'p' : 'a' })),
      corr: `<ul>${ms.map(m => `<li>${m.f} : ${AXE(m.n, m.p)}, ${GEO[m.n + ',' + m.p]} : ${m.mu ? 'les moments des liaisons ne se compensent pas, molécule <b>polaire</b>' : 'les moments des liaisons se compensent par symétrie, molécule <b>apolaire</b>'}.</li>`).join('')}</ul><p class="fine">Le moment dipolaire de la molécule est la somme vectorielle des moments des liaisons : une molécule symétrique (linéaire AX<sub>2</sub>, plane AX<sub>3</sub>, tétraèdre AX<sub>4</sub> avec 4 atomes identiques…) est apolaire même si ses liaisons sont polarisées.</p>` };
  }
  if (g.r() < 0.55) {
    const [hx, mu, L] = g.pick(HX), pct = mu * 3.33e-30 / (1.602e-19 * L * 1e-10) * 100;
    return { title: 'Caractère ionique partiel', q: `Pour ${hx} : moment dipolaire μ = ${String(mu).replace('.', ',')} D, longueur de liaison L = ${String(L).replace('.', ',')} Å. 1 D = 3,33·10⁻³⁰ C·m, e = 1,602·10⁻¹⁹ C. Calculer le caractère ionique de la liaison et la charge partielle δ (en fraction de e).`,
      items: [{ type: 'num', label: 'caractère ionique', val: pct, unit: '%', tol: 0.03 }, { type: 'num', label: 'δ (fraction de e)', val: pct / 100, unit: '', tol: 0.03 }],
      corr: `<p>Si la liaison était totalement ionique : μ<sub>ionique</sub> = e·L = 1,602·10⁻¹⁹ × ${String(L).replace('.', ',')}·10⁻¹⁰ = ${txt(1.602e-19 * L * 1e-10)} C·m. Réel : μ = ${String(mu).replace('.', ',')} × 3,33·10⁻³⁰ = ${txt(mu * 3.33e-30)} C·m.</p><p>Caractère ionique = μ / μ<sub>ionique</sub> = <b>${txt(pct, 3)} %</b>, soit δ = ${txt(pct / 100, 3)} e.</p><p class="fine">De HF à HI, χ(X) baisse : la liaison est de moins en moins polarisée.</p>` };
  }
  const [x, y, kind, why] = g.pick(TEB), sw = g.r() < 0.5;
  return { title: 'Interactions entre molécules (complément)', q: `Complément, hors des slides du cours : laquelle a la température d'ébullition la plus haute, et à cause de quelle interaction entre les molécules ?`,
    items: [{ type: 'choice', label: 'ébullition la plus haute', opts: (sw ? [y, x] : [x, y]).map(z => ({ v: z, t: z })), ans: x }, { type: 'choice', label: 'surtout grâce à', opts: Object.keys(INTER).map(k => ({ v: k, t: INTER[k] })), ans: kind }],
    corr: `<p>${why}.</p><p class="fine">Forces de Van der Waals : Keesom (dipôles permanents), Debye (dipôle induit), London (dispersion, d'autant plus forte que la molécule a d'électrons). La liaison hydrogène (H lié à F, O ou N face à un doublet de F, O ou N) est plus forte : elle explique les températures d'ébullition élevées de H<sub>2</sub>O, HF, NH<sub>3</sub>.</p>` };
};

function check(it, raw) {
  if (it.type === 'choice') return raw ? { st: raw === it.ans ? 'ok' : 'bad' } : { st: 'empty' };
  if (it.type === 'int') {
    const s = String(raw || '').trim().replace(/\s/g, '').replace('−', '-'); if (!s) return { st: 'empty' };
    if (!/^[-+]?\d+$/.test(s)) return { st: 'err', msg: 'écris un nombre entier' };
    return { st: +s === it.val ? 'ok' : 'bad' };
  }
  if (it.type === 'num') {
    const p = parseNum(raw || '', it.unit); if (p.err !== undefined) return { st: p.err ? 'err' : 'empty', msg: p.err };
    const tol = it.tol || 0.02, ok = Math.abs(p.v - it.val) <= tol * Math.abs(it.val) + 1e-12;
    if (!ok && Math.abs(p.v + it.val) <= tol * Math.abs(it.val)) return { st: 'bad', msg: 'au signe près : attention au signe.' };
    if (!ok && Math.abs(p.v / it.val) > 0 && Math.abs(Math.log10(Math.abs(p.v / it.val)) - Math.round(Math.log10(Math.abs(p.v / it.val)))) < 0.01 && Math.round(Math.log10(Math.abs(p.v / it.val)))) return { st: 'bad', msg: 'erreur de puissance de 10 : vérifie tes conversions d\'unités.' };
    return { st: ok ? 'ok' : 'bad' };
  }
  if (it.type === 'conf') {
    const p = parseConf(raw || ''); if (p.err !== undefined) return { st: p.err ? 'err' : 'empty', msg: p.err };
    if (sameConf(p.o, it.conf)) {
      const order = String(raw).match(/[1-7][spdf]/g) || [], byN = order.slice().sort((a, b) => subKey(a) - subKey(b));
      return { st: 'ok', msg: order.join() !== byN.join() ? 'juste. Le cours demande d\'écrire la configuration finale dans l\'ordre des n croissants (3d avant 4s).' : '' };
    }
    if (it.Z && isExc(it.Z) && sameConf(p.o, klech(it.Z))) return { st: 'bad', msg: 'c\'est le remplissage normal, mais cet élément est une exception (d⁵ ou d¹⁰ plus stable).' };
    const tot = Object.values(p.o).reduce((a, b) => a + b, 0), exp = Object.values(it.conf).reduce((a, b) => a + b, 0);
    return { st: 'bad', msg: tot !== exp ? `tu as placé ${tot} électrons au lieu de ${exp}.` : '' };
  }
  return { st: 'empty' };
}
function preview(it, raw) {
  if (!raw) return '';
  if (it.type === 'num') { const p = parseNum(raw, it.unit); return p.err ? `<span class="err">${esc(p.err)}</span>` : `lu : ${txt(p.v)} ${esc(it.unit)}`; }
  if (it.type === 'conf') { const p = parseConf(raw); return p.err ? `<span class="err">${esc(p.err)}</span>` : 'lu : ' + katexStr(confTex(p.o)); }
  return '';
}
const katexStr = s => window.katex ? katex.renderToString(s, { throwOnError: false }) : esc(s);

function itemHTML(it, id, val) {

function showFb(root, it) {

  return r;
}

const FICHES = [
  ['I. Structure de l\'atome', `<p>Un atome = un <b>noyau</b> (\\(Z\\) protons + \\(N\\) neutrons = \\(A\\) nucléons) et \\(Z\\) <b>électrons</b>. Notation \\({}^{A}_{Z}\\mathrm{X}\\), avec \\(A = Z + N\\).</p>
    <ul><li>\\(Z\\) (numéro atomique) caractérise l'<b>élément</b> ; \\(A\\) le <b>nucléide</b>.</li><li><b>Isotopes</b> : même \\(Z\\), \\(A\\) différents (même élément). <b>Isobares</b> : même \\(A\\), \\(Z\\) différents.</li><li>Ion : \\(\\mathrm{X}^{q+}\\) a perdu \\(q\\) électrons (cation), \\(\\mathrm{X}^{q-}\\) en a gagné \\(q\\) (anion). Le noyau ne change pas.</li><li>Masses : \\(m_p \\approx m_n \\approx 1{,}67\\times10^{-27}\\) kg, \\(m_e = 9{,}11\\times10^{-31}\\) kg. Presque toute la masse est dans le noyau.</li></ul>
    <h4>Mole et masse molaire</h4><p>1 mol = \\(N_A = 6{,}022\\times10^{23}\\) entités (autant que d'atomes dans 12 g de \\({}^{12}\\mathrm{C}\\)). 1 u.m.a. = 1/12 de la masse d'un atome de \\({}^{12}\\mathrm{C}\\).</p>
    <div class="box key"><h5>À savoir faire</h5>Masse molaire d'un élément naturel : \\(M = \\sum_i x_i M_i\\) (\\(x_i\\) = abondances, \\(\\sum x_i = 1\\)). Avec deux isotopes, \\(x_1 = \\dfrac{M - M_2}{M_1 - M_2}\\).</div>`],
  ['II. Spectres atomiques', `<p>La lumière est à la fois une <b>onde</b> (\\(\\lambda\\), \\(\\nu = c/\\lambda\\), \\(\\bar\\nu = 1/\\lambda\\)) et un flux de <b>photons</b> d'énergie \\(E = h\\nu = \\dfrac{hc}{\\lambda}\\) (Planck, Einstein). De Broglie : toute particule a une onde associée \\(\\lambda = \\dfrac{h}{mv}\\).</p>
    <h4>Atome d'hydrogène (Bohr)</h4><p>L'énergie est <b>quantifiée</b> : \\(E_n = -\\dfrac{13{,}6}{n^2}\\ \\text{eV}\\) (\\(n\\) = couche). Fondamental : \\(n = 1\\), \\(E_1 = -13{,}6\\) eV. Ionisation : \\(E_i = 13{,}6\\) eV.</p>
    <ul><li><b>Absorption</b> : l'électron monte (\\(\\Delta E > 0\\)), un photon est absorbé. <b>Émission</b> : il redescend, un photon est émis.</li><li>Photon : \\(h\\nu = |E_p - E_n| = 13{,}6\\left(\\dfrac{1}{n^2} - \\dfrac{1}{p^2}\\right)\\) eV. Ritz : \\(\\dfrac1\\lambda = R_H\\left(\\dfrac{1}{n^2} - \\dfrac{1}{p^2}\\right)\\), \\(R_H = 1{,}097\\times10^{7}\\ \\text{m}^{-1}\\).</li></ul>
    <table class="t"><tr><th>Retour sur</th><th>Série</th><th>Domaine</th></tr><tr><td>n = 1</td><td>Lyman</td><td>UV</td></tr><tr><td>n = 2</td><td>Balmer</td><td>visible (4 raies : 410, 434, 486, 656 nm)</td></tr><tr><td>n = 3</td><td>Paschen</td><td>IR</td></tr><tr><td>n = 4, 5</td><td>Brackett, Pfund</td><td>IR</td></tr></table>
    <div class="box key"><h5>Hydrogénoïdes</h5>Un seul électron (He<sup>+</sup>, Li<sup>2+</sup>, Be<sup>3+</sup>) : \\(E_n = -13{,}6\\,\\dfrac{Z^2}{n^2}\\) eV. Les énergies sont \\(Z^2\\) fois plus grandes, les longueurs d'onde \\(Z^2\\) fois plus petites.</div>
    <div class="box warn"><h5>Pièges</h5>Convertir nm → m et eV → J (1 eV = \\(1{,}602\\times10^{-19}\\) J). Raies limites : \\(\\lambda_{max}\\) pour \\(p = n + 1\\), \\(\\lambda_{min}\\) pour \\(p \\to \\infty\\). Depuis le niveau \\(p\\), on peut observer \\(p(p-1)/2\\) raies.</div>`],
  ['III. Modèle quantique', `<p>Plus de trajectoire : l'électron est décrit par une <b>fonction d'onde</b> \\(\\psi\\), solution de l'équation de Schrödinger \\(\\hat H\\psi = E\\psi\\). \\(|\\psi|^2\\) = densité de probabilité de présence ; \\(\\psi\\) est normée. <b>Heisenberg</b> : \\(\\Delta x\\,\\Delta p \\geq \\dfrac{h}{4\\pi}\\).</p>
    <h4>Les 4 nombres quantiques</h4><table class="t"><tr><th>Nombre</th><th>Valeurs</th><th>Rôle</th></tr><tr><td>\\(n\\)</td><td>1, 2, 3…</td><td>couche, énergie, taille</td></tr><tr><td>\\(\\ell\\)</td><td>0 à \\(n - 1\\)</td><td>sous-couche, forme (s, p, d, f)</td></tr><tr><td>\\(m_\\ell\\)</td><td>\\(-\\ell\\) à \\(+\\ell\\)</td><td>orientation (\\(2\\ell + 1\\) O.A.)</td></tr><tr><td>\\(m_s\\)</td><td>\\(\\pm\\tfrac12\\)</td><td>spin</td></tr></table>
    <ul><li>Une O.A. = un triplet \\((n, \\ell, m_\\ell)\\) = une case quantique, au plus 2 électrons.</li><li>La couche \\(n\\) contient \\(n^2\\) O.A. et \\(2n^2\\) électrons au maximum. s : 1 O.A. (2 e⁻), p : 3 (6 e⁻), d : 5 (10 e⁻), f : 7 (14 e⁻).</li><li>O.A. s : sphérique ; p : deux lobes selon un axe (px, py, pz).</li></ul>`],
  ['IV. Atomes polyélectroniques', `<p>Plusieurs électrons : l'énergie dépend de \\(n\\) <b>et</b> de \\(\\ell\\) (effet d'écran, modèle de Slater : \\(Z^* = Z - \\sigma\\)).</p>
    <h4>Les 3 règles de remplissage</h4><ul><li><b>Pauli</b> : deux électrons ne peuvent pas avoir les 4 mêmes nombres quantiques → 2 électrons de spins opposés par case.</li><li><b>Klechkowski</b> : on remplit par \\(n + \\ell\\) croissant, puis \\(n\\) croissant : 1s 2s 2p 3s 3p <b>4s 3d</b> 4p 5s 4d 5p 6s 4f 5d 6p.</li><li><b>Hund</b> : dans des cases de même énergie, un électron par case (spins parallèles) avant d'apparier.</li></ul>
    <div class="box warn"><h5>Exceptions à connaître</h5>\\((n-1)d^4\\,ns^2 \\to (n-1)d^5\\,ns^1\\) et \\((n-1)d^9\\,ns^2 \\to (n-1)d^{10}\\,ns^1\\) : Cr (Z = 24) = (Ar) 3d<sup>5</sup> 4s<sup>1</sup>, Cu (Z = 29) = (Ar) 3d<sup>10</sup> 4s<sup>1</sup>, de même Mo et Ag.</div>
    <div class="box key"><h5>Écriture</h5>On remplit dans l'ordre de Klechkowski, mais on <b>écrit</b> la configuration par \\(n\\) croissant : V (Z = 23) → 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>3</sup> 4s<sup>2</sup>, ou en abrégé (Ar) 3d<sup>3</sup> 4s<sup>2</sup>. Électrons de valence = ceux de \\(n\\) maximal + sous-couches en cours de remplissage.</div>`],
  ['V. Tableau périodique et propriétés', `<p>Classement par \\(Z\\) croissant : 7 <b>périodes</b> (même \\(n\\) externe), 18 <b>colonnes</b> (même configuration externe → propriétés analogues).</p>
    <div class="box key"><h5>Retrouver la place d'un élément</h5>Période = \\(n\\) le plus grand. Colonne : \\(ns^x\\) → \\(x\\) ; \\(ns^x np^y\\) → \\(x + y + 10\\) ; \\((n-1)d^y ns^x\\) → \\(x + y\\). Exception : He en colonne 18. Blocs s (col. 1-2), d (3-12), p (13-18), f (lanthanides, actinides).</div>
    <p>Familles : alcalins (col. 1, ns<sup>1</sup>, sauf H), alcalino-terreux (2), chalcogènes (16), halogènes (17), gaz rares (18), métaux de transition (3 à 12).</p>
    <h4>Évolutions</h4><table class="t"><tr><th></th><th>dans une période (→)</th><th>dans une colonne (↓)</th></tr><tr><td>Rayon atomique</td><td>diminue (\\(Z^*\\) ↑)</td><td>augmente (\\(n\\) ↑)</td></tr><tr><td>Énergie d'ionisation</td><td>augmente</td><td>diminue</td></tr><tr><td>Électronégativité</td><td>augmente</td><td>diminue</td></tr><tr><td>Caractère métallique</td><td>diminue</td><td>augmente</td></tr></table>
    <ul><li>Cation plus petit que l'atome, anion plus gros.</li><li>Électronégativité max : F (4,0) ; nulle pour les gaz rares.</li><li>Ions : colonnes 1, 2, 13 → +I, +II, +III ; colonnes 16, 17 → −II, −I (structure du gaz rare le plus proche).</li><li>\\(\\Delta\\chi > 1{,}7\\) : liaison ionique ; sinon covalente (à droite) ou métallique (à gauche).</li></ul>
    <div class="box warn"><h5>Anomalies d'énergie d'ionisation</h5>E.I.(Be) > E.I.(B) et E.I.(Mg) > E.I.(Al) : ns<sup>2</sup> pleine est stable. E.I.(N) > E.I.(O) et E.I.(P) > E.I.(S) : np<sup>3</sup> demi-pleine est stable. E.I.(Zn) > E.I.(Ga) : 3d<sup>10</sup> 4s<sup>2</sup> pleines.</div>`],
  ['VI. Liaison covalente : modèle de Lewis (partie 2)', `<p>Une liaison de covalence = un <b>doublet d'électrons mis en commun</b> par deux atomes (recouvrement de deux O.A.), représenté par un tiret. Δχ ≤ 1,7 : covalente (à droite du tableau) ou métallique (à gauche) ; Δχ &gt; 1,7 : ionique (NaCl, CaO).</p>
    <h4>Construire un schéma de Lewis</h4><ol style="padding-left:22px;margin-top:10px"><li>Compter les électrons de valence de tous les atomes, <b>moins la charge</b> pour un cation, <b>plus la charge</b> pour un anion ; diviser par 2 : nombre de doublets.</li><li>Relier l'atome central aux autres par des liaisons simples.</li><li>Compléter les octets des atomes externes (H : un seul doublet, le duet), puis placer les doublets restants sur l'atome central.</li><li>Si l'atome central n'a pas son octet : transformer des doublets non liants voisins en liaisons multiples (CO<sub>2</sub> : O=C=O ; HCN : H–C≡N).</li></ol>
    <div class="box warn"><h5>Exceptions à l'octet</h5><b>Lacune électronique</b> : BF<sub>3</sub>, AlCl<sub>3</sub>, BeCl<sub>2</sub> (moins de 8 électrons autour de B, Al, Be) : acides de Lewis, BF<sub>3</sub> accepte le doublet de NH<sub>3</sub> (BF<sub>3</sub>NH<sub>3</sub>). <b>Hypervalence</b> : plus de 8 électrons pour les éléments de la 3<sup>e</sup> période et au-delà (PCl<sub>5</sub>, SF<sub>6</sub>, SF<sub>4</sub>, XeF<sub>2</sub>) ; <b>jamais</b> pour C, N, O, F (2<sup>e</sup> période).</div>
    <div class="box key"><h5>Charge formelle</h5>CF = (électrons de valence de l'atome isolé) − (électrons non liants) − (nombre de liaisons). Ex. NH<sub>4</sub><sup>+</sup> : N = 5 − 0 − 4 = +1 ; CO : C = 4 − 2 − 3 = −1, O = 6 − 2 − 3 = +1. La somme des CF est la charge de l'édifice ; la meilleure structure a des CF petites, la charge négative sur l'atome le plus électronégatif.</div>
    <h4>Mésomérie</h4><p>Quand plusieurs schémas ne diffèrent que par la place des doublets (pas des atomes), ce sont des <b>formes mésomères</b> ; la molécule réelle est l'<b>hybride de résonance</b>. CO<sub>3</sub><sup>2−</sup>, NO<sub>3</sub><sup>−</sup>, SO<sub>3</sub> : 3 formes (liaisons C–O toutes identiques, charge répartie) ; SO<sub>2</sub>, NO<sub>2</sub><sup>−</sup>, O<sub>3</sub> : 2 formes. Les formes qui respectent l'octet pèsent le plus.</p>`],
  ['VII. Géométrie : VSEPR et hybridation (partie 2)', `<p><b>VSEPR</b> (Gillespie) : autour de l'atome central A, les doublets liants et non liants se repoussent et s'écartent au maximum. On écrit <b>AX<sub>n</sub>E<sub>p</sub></b> : n atomes liés à A (une liaison multiple compte une fois), p doublets non liants (ou électron célibataire).</p>
    <table class="t"><tr><th>n + p</th><th>Figure de répulsion</th><th>Géométries</th></tr><tr><td>2</td><td>linéaire (180°)</td><td>AX<sub>2</sub> linéaire (CO<sub>2</sub>, HCN)</td></tr><tr><td>3</td><td>triangle (120°)</td><td>AX<sub>3</sub> triangulaire plane (BF<sub>3</sub>, CO<sub>3</sub><sup>2−</sup>) · AX<sub>2</sub>E coudée (SO<sub>2</sub>, O<sub>3</sub>)</td></tr><tr><td>4</td><td>tétraèdre (109°28′)</td><td>AX<sub>4</sub> tétraédrique (CH<sub>4</sub>) · AX<sub>3</sub>E pyramide à base triangulaire (NH<sub>3</sub>, 107°) · AX<sub>2</sub>E<sub>2</sub> coudée (H<sub>2</sub>O, 104,5°)</td></tr><tr><td>5</td><td>bipyramide à base triangulaire (90° et 120°)</td><td>AX<sub>5</sub> (PCl<sub>5</sub>) · AX<sub>4</sub>E balançoire (SF<sub>4</sub>) · AX<sub>3</sub>E<sub>2</sub> en T (ClF<sub>3</sub>) · AX<sub>2</sub>E<sub>3</sub> linéaire (XeF<sub>2</sub>)</td></tr><tr><td>6</td><td>octaèdre (90°)</td><td>AX<sub>6</sub> octaédrique (SF<sub>6</sub>) · AX<sub>5</sub>E pyramide à base carrée (BrF<sub>5</sub>) · AX<sub>4</sub>E<sub>2</sub> plan carré (XeF<sub>4</sub>)</td></tr></table>
    <div class="box warn"><h5>Pièges</h5>La <b>figure de répulsion</b> compte tous les doublets ; la <b>géométrie</b> ne décrit que les atomes (H<sub>2</sub>O : tétraèdre, mais molécule coudée) · un doublet non liant prend plus de place : il resserre les angles · sur la bipyramide, les doublets non liants vont en position équatoriale · une liaison double repousse plus qu'une simple (HCHO : H–C–H &lt; 120°).</div>
    <h4>Hybridation</h4><p>Les O.A. de valence de A se combinent en orbitales hybrides équivalentes, une par direction (n + p) : <b>sp</b> (2, 180°, il reste 2 orbitales p pures), <b>sp²</b> (3, 120°, 1 p pure), <b>sp³</b> (4, 109°28′). Les O.A. hybrides forment des liaisons <b>σ</b> (recouvrement axial) ; les p pures forment des liaisons <b>π</b> (recouvrement latéral).</p>
    <div class="box key"><h5>À savoir faire</h5>Liaison simple = 1 σ ; double = 1 σ + 1 π ; triple = 1 σ + 2 π. CH<sub>4</sub> : C sp³, 4 σ ; C<sub>2</sub>H<sub>4</sub> : C sp², 5 σ + 1 π, molécule plane (la π bloque la rotation) ; C<sub>2</sub>H<sub>2</sub> : C sp, 3 σ + 2 π, linéaire ; CH<sub>3</sub>CN : C du CH<sub>3</sub> sp³, C du CN sp.</div>`],
  ['VIII. Polarité des molécules (partie 2)', `<p>Dans une liaison entre atomes d'électronégativités différentes, le plus électronégatif attire les électrons : charges partielles δ− et δ+, <b>moment dipolaire</b> μ = q·d, orienté de δ− vers δ+ (convention des physiciens, celle du cours), avec q = δ·e (0 ≤ δ ≤ 1). Unité : C·m ou debye, 1 D = 3,33·10⁻³⁰ C·m.</p>
    <div class="box key"><h5>Caractère ionique partiel</h5>Si la liaison était totalement ionique : μ<sub>ionique</sub> = e·d. Caractère ionique = μ<sub>réel</sub> / μ<sub>ionique</sub> (en %), charge partielle δ = (caractère ionique) × e. HF : 1,83 D, 0,92 Å → environ 41 %.</div>
    <p>Le moment dipolaire de la molécule est la <b>somme vectorielle</b> des moments des liaisons : CO<sub>2</sub> (linéaire), BF<sub>3</sub> (plane), CCl<sub>4</sub> (tétraèdre) sont <b>apolaires</b> malgré des liaisons polarisées ; H<sub>2</sub>O (coudée), NH<sub>3</sub> (pyramidale), CHCl<sub>3</sub> sont <b>polaires</b>. HCl, polaire, se dissout bien dans l'eau ; Cl<sub>2</sub>, apolaire, très peu.</p>
    <div class="box warn"><h5>Complément (pas dans les slides du cours)</h5>Entre molécules : forces de <b>Van der Waals</b> (Keesom entre dipôles permanents, Debye dipôle–dipôle induit, London entre molécules polarisables, d'autant plus fortes qu'il y a d'électrons) et <b>liaison hydrogène</b> (H lié à F, O ou N face à un doublet de F, O ou N), plus forte : températures d'ébullition élevées de H<sub>2</sub>O, HF, NH<sub>3</sub>.</div>`]
];
function vCours(open) {
  app.innerHTML = `<div><p class="eyebrow">Partie 1 · L'atome (CC, date à confirmer) · Partie 2 · Liaisons (CC du 16/12)</p><h1>Le cours utile</h1><p class="lede">Le cours de V. Bouquet condensé : les 5 chapitres de « L'atome » (fiches I à V), puis la liaison covalente, la VSEPR, l'hybridation et la polarité (fiches VI à VIII). Définitions, formules, méthodes et pièges.</p></div>
    ${FICHES.map(([t, b], i) => `<details class="fiche" id="fiche${i}"${open === i ? ' open' : ''}><summary>${esc(t)}</summary><div class="body">${b}</div></details>`).join('')}
    <section class="card"><h2>Constantes (poly de TD)</h2><p class="sub">\\(h = 6{,}626\\times10^{-34}\\) J·s · \\(c = 3{,}00\\times10^{8}\\) m/s · \\(N_A = 6{,}022\\times10^{23}\\) mol⁻¹ · \\(R_H = 1{,}097\\times10^{7}\\) m⁻¹ · \\(e = 1{,}602\\times10^{-19}\\) C · \\(m_e = 9{,}11\\times10^{-31}\\) kg · \\(m_n = 1{,}675\\times10^{-27}\\) kg</p></section>`;
  typeset(app);
  if (open != null) { const f = $('#fiche' + open); if (f) setTimeout(() => f.scrollIntoView({ behavior: 'smooth' }), 60); }
}

/* ---------- Sujet blanc ---------- */
let EXAM = null;
// Calqué sur le CC du 16/11/2021 : isotopes (4), spectre d'un hydrogénoïde (8), nombres quantiques (3,5), configurations et classification (9,5), ramené sur 20
const EXAM_PLAN = [['A · Isotopes', [['noyau', 1], ['iso', 0]], 3], ['B · Spectres atomiques (hydrogénoïde)', [['niv', 1], ['trans', 0]], 7], ['C · Nombres quantiques', [['nq', 2]], 3], ['D · Configuration électronique et classification', [['exc', 0], ['place', 1], ['prop', 2]], 7]];
function examExos(seed) {
  const g = G(rng(seed));
  return examPlan(EXAM_PLAN).map(([title, parts, pts]) => ({ title, pts, parts: parts.map(([id, d]) => build(id, d, Math.floor(g.r() * 4294967296))) }));
}
function vBlanc() {
  const E = ls.get(EK, null);
  if (E && !E.closed && !EXAM) { EXAM = E; EXAM.running = true; }
  if (EXAM) return renderExam();
  const H = ls.get(HK, []);
  app.innerHTML = `<div><p class="eyebrow">Conditions réelles · 1 h · noté sur 20</p><h1>Sujet blanc</h1><p class="lede">Même plan que le CC de novembre 2021 : isotopes (3 pts), spectre d'un ion hydrogénoïde comme He<sup>+</sup> (7 pts), nombres quantiques (3 pts), configurations électroniques et tableau périodique (7 pts). Au CC 2021, la calculatrice était autorisée pour les calculs numériques seulement.</p></div>
    <section class="card"><div class="row"><button type="button" class="btn btn-primary btn-lg" data-act="exam">Commencer (60 min)</button>${weakButton()}<span class="fine">Prévois une feuille : les justifications se font sur papier, seuls les résultats sont saisis ici.</span></div></section>
    <section class="card"><h2>Mes copies</h2>${H.length ? `<table class="hist"><tr><th>Date</th><th>Note</th><th>Durée</th></tr>${H.slice().reverse().map(r => `<tr><td>${new Date(r.ts).toLocaleDateString('fr-FR')}${copyTag(r)}</td><td><b>${String(r.note.toFixed(1)).replace('.', ',')}/20</b></td><td>${Math.round(r.dur / 60)} min</td></tr>`).join('')}</table>` : '<p class="sub">Aucune copie pour l\'instant.</p>'}</section>`;
}
function renderExam() {
  const exs = examExos(EXAM.seed);
  app.innerHTML = `<div><p class="eyebrow">${EXAM.target ? 'Sujet ciblé (points faibles) · ' : ''}Sujet blanc d'atomistique</p><h1>CC · 1 h</h1></div>`
    + exs.map((ex, i) => `<section class="card"><h2>${esc(ex.title)} <span class="fine">(${ex.pts} points)</span></h2>${ex.parts.map(p => `<div class="ex" style="margin-top:14px"><div class="q">${p.q}</div><div class="items">${p.items.map(it => itemHTML(it, it.id, EXAM.ans[it.id] || '')).join('')}</div>${EXAM.done ? `<details class="corr" open><summary>Correction</summary><div class="expl">${p.corr}</div></details>` : ''}</div>`).join('')}</section>`).join('')
    + (EXAM.done ? `<section class="card"><div class="row"><span class="score">${String(EXAM.note.toFixed(1)).replace('.', ',')}</span><span class="sub">/ 20</span><span class="sp"></span><button type="button" class="btn btn-primary" data-act="examNew">Nouveau sujet</button></div></section>`
      : `<div class="row" style="justify-content:center"><button type="button" class="btn btn-primary btn-lg" data-act="submit">Rendre la copie</button></div>`);
  typeset(app);
  if (EXAM.done) exs.forEach(ex => ex.parts.forEach(p => p.items.forEach(it => showFb(app, it))));
  if (EXAM.done) hideCorr();   // corrigés des parties ratées masqués
  startTick();
}
function submitExam(auto) {
  if (!EXAM || EXAM.done) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  const exs = examExos(EXAM.seed); let note = 0;
  exs.forEach(ex => { const its = [].concat(...ex.parts.map(p => p.items)); const ok = its.filter(it => tally(it, check(it, EXAM.ans[it.id] || '').st === 'ok' ? 1 : 0)).length; note += ex.pts * ok / its.length; });
  EXAM.done = true; EXAM.note = note; EXAM.running = false;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(3600, Math.round((Date.now() - EXAM.t0) / 1000)), ...examRecord() }); ls.set(HK, H);
  ls.set(EK, Object.assign({}, EXAM, { closed: true }));   // gardé « rendu » : les autres appareils le retirent
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
  const fi = e.target.closest('[data-fiche]'); if (fi) { setTab('cours'); vCours(+fi.dataset.fiche); return; }
  const go = e.target.closest('[data-go]');
  if (go) { if (CUR && CUR.mode === 'path' && !CUR.done && CUR.k.id === go.dataset.go) { $('#exHost').scrollIntoView({ behavior: 'smooth' }); return; } startEx(skById(go.dataset.go), { user: true }); renderPathTop(); renderMap(); return; }
  const ft = e.target.closest('[data-ft]'); if (ft) { FREE.id = ft.dataset.ft; vExos(); return; }
  const fd = e.target.closest('[data-fd]'); if (fd) { FREE.d = +fd.dataset.fd; vExos(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'check') checkCur();
  else if (act === 'next') nextPath();
  else if (act === 'skip') { const P = pst(); P.cur = null; P.curT = Date.now(); ls.set(PK, P); CUR = null; nextPath({ fresh: true, user: true }); }
  else if (act === 'again') startEx(skById(FREE.id), { d: FREE.d, mode: 'free' });
  else if (act === 'exam') { EXAM = { seed: newSeed(), t0: Date.now(), ans: {}, running: true, done: false }; ls.set(EK, EXAM); renderExam(); }
  else if (act === 'submit') submitExam(false);
  else if (act === 'examNew') { EXAM = null; vBlanc(); $('#clock').hidden = true; }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.matches('input')) return;
  const id = t.dataset.id || t.name; if (!id) return;
  if (EXAM && !EXAM.done && VIEW === 'blanc') { EXAM.ans[id] = t.value; ls.set(EK, EXAM); }
  else if (CUR && !CUR.done && VIEW !== 'blanc') { CUR.ans[id] = t.value; clearTimeout(saveT); saveT = setTimeout(saveCur, 400); }
  if (t.type === 'text') {
    const it = (CUR && CUR.ex.items.find(x => x.id === id)) || (EXAM && [].concat(...examExos(EXAM.seed).map(x => [].concat(...x.parts.map(p => p.items)))).find(x => x.id === id));
    const pv = t.closest('.it') && $('.prev', t.closest('.it')); if (it && pv) pv.innerHTML = preview(it, t.value);
  }
});
let saveT = 0;
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#exHost input[type=text]')) { e.preventDefault(); checkCur(); } });

window.__ATO = { GEN, build, check, parseConf, parseNum, conf, klech, place, unpaired, ionConf, SK };   // tests
E.start();
})();
