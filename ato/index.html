<style>
:root{
  color-scheme:light;
  --paper:#f4f2ec; --sheet:#fffefb; --sheet-2:#f8f6f1;
  --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;
  --rule:#e4e0d6; --rule-strong:#cdc8bb;
  --pen:#2446c8; --pen-hover:#1c389f; --pen-ink:#ffffff; --pen-soft:#eaeefc; --pen-line:#bccaf5;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --bad:#c2352b; --bad-soft:#fbeceb; --warn:#9a5b00; --warn-soft:#fcf2da;
  --chem:#0f766e; --chem-soft:#e0f2ef;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px -18px rgba(28,27,25,.25);
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
    --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
    --rule:#2e2d2a; --rule-strong:#45433e;
    --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340; --pen-line:#34437a;
    --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
    --chem:#3fc4b4; --chem-soft:#10302c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
  --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --rule:#2e2d2a; --rule-strong:#45433e;
  --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340; --pen-line:#34437a;
  --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
  --chem:#3fc4b4; --chem-soft:#10302c;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none !important}
.katex{font-size:1.05em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 24px;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--chem);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--sans)}
.brand strong{display:block;font:600 15px/1.2 var(--sans)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:500 14px/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--sheet-2)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer}
.clock{font:800 22px/1 var(--sans);font-variant-numeric:tabular-nums}
.clock.rush{color:var(--bad)}
main{max-width:980px;margin:32px auto 90px;padding:0 24px;display:grid;gap:20px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--chem);margin-bottom:10px}
h1{font:600 clamp(28px,4.6vw,42px)/1.08 var(--serif);letter-spacing:-.02em}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:680px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px}
.card h2{font:600 21px/1.25 var(--serif)}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.fine{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn-primary:hover:not(:disabled){background:var(--pen-hover)}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:600 12.5px/1 var(--sans);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.part{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font:800 clamp(40px,7vw,58px)/1 var(--sans);letter-spacing:-.04em;color:var(--chem);font-variant-numeric:tabular-nums}
.count span{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* exercices */
.ex .q{font:17.5px/1.6 var(--serif);margin-top:8px}
.ex .q .katex{font-size:1.04em}
.items{display:grid;gap:12px;margin-top:16px}
.it{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:4px 12px;align-items:center}
.it-lab{text-align:right;font-size:16px;white-space:nowrap}
.it-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.it-in input[type=text]{flex:1;min-width:0;width:100%;font:15px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:9px;padding:9px 12px;min-height:42px}
.unit{font:600 14px var(--sans);color:var(--ink-2);white-space:nowrap}
.prev,.fb{grid-column:2;font-size:14px;color:var(--ink-2);min-width:0;overflow-x:auto}
.prev:empty,.fb:empty{display:none}
.prev .err{color:var(--muted);font-style:italic}
.ch{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);cursor:pointer}
.ch:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.ch input{accent-color:var(--pen);margin:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
details.corr{margin-top:14px}
details.corr>summary{cursor:pointer;font:600 14px/1 var(--sans);color:var(--pen);padding:6px 0}
.expl{margin-top:8px;padding:14px 18px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule);font:16px/1.65 var(--serif);overflow-x:auto}
.expl p+p{margin-top:8px}
.strip{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--chem-soft);border:1px solid color-mix(in srgb,var(--chem) 35%,transparent)}
.strip b{font:600 17px/1.3 var(--serif)}
.lvl{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)} .lvl i.on{background:var(--chem)}
.tag-rev{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:600 11.5px/1 var(--sans)}
.res{border-color:color-mix(in srgb,var(--pen) 40%,transparent)}
.psk{display:grid;grid-template-columns:24px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.psk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.psk.val .ic{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.psk.cur .ic{background:var(--chem);color:#fff;border-color:transparent}
.psk.rev .ic{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.psk.lock{opacity:.5}
.psk .nm small{display:block;color:var(--muted);font-size:12.5px}
.pch h3{font:600 17px/1.3 var(--serif);margin:16px 0 4px}
/* cours */
.fiche{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.fiche>summary{display:flex;gap:12px;align-items:center;padding:16px 22px;cursor:pointer;list-style:none;font:600 18px/1.3 var(--serif)}
.fiche>summary::-webkit-details-marker{display:none}
.fiche>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.fiche[open]>summary::before{transform:rotate(90deg)}
.fiche .body{padding:4px 24px 22px;border-top:1px solid var(--rule);font:16.5px/1.65 var(--serif)}
.fiche .body p,.fiche .body ul{margin-top:10px}
.fiche .body ul{padding-left:22px}
.fiche h4{font:700 11.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:20px}
.box{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.box.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.box.key{background:var(--chem-soft);border-color:color-mix(in srgb,var(--chem) 30%,transparent)}
.box h5{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;color:var(--ink-2)}
table.t{border-collapse:collapse;margin-top:10px;font:14.5px/1.4 var(--sans)}
table.t td,table.t th{border:1px solid var(--rule);padding:5px 10px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);font:500 13.5px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.score{font:800 clamp(48px,9vw,72px)/1 var(--sans);letter-spacing:-.03em}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--rule);text-align:left}
@media (max-width:760px){
  .topbar{padding:8px 16px}
  .brand small{display:none}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  main{padding:0 16px;margin-top:22px}
  .card{padding:18px}
  .grid2{grid-template-columns:1fr}
  .it{grid-template-columns:1fr}
  .it-lab{text-align:left}
  .prev,.fb{grid-column:1}
  .psk{grid-template-columns:24px minmax(0,1fr) auto} .psk .bar{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>

<script>
(function () {
'use strict';
/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// générateur pseudo-aléatoire à graine (un exercice se retrouve à l'identique)
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const newSeed = () => Math.floor(Math.random() * 4294967296);

/* ---------- Nombres ---------- */
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function sig(x, n = 3) { return +x.toPrecision(n); }
// TeX : 4{,}86\times10^{-7}
function T(x, n = 3) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e-2 && a < 1e5) return String(sig(x, n)).replace('.', '{,}');
  const e = Math.floor(Math.log10(a)); let m = sig(x / 10 ** e, n);
  if (Math.abs(m) >= 10) return T(x, n + 0);   // arrondi qui déborde : rare

}
// texte : 4,86·10⁻⁷
function txt(x, n = 4) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e-2 && a < 1e5) return String(sig(x, n)).replace('.', ',');
  const e = Math.floor(Math.log10(a)), m = sig(x / 10 ** e, n);

// unités acceptées : facteur vers l'unité affichée
const UNITS = {
  nm: { nm: 1, m: 1e9, pm: 1e-3, 'å': 0.1, a: 0.1, 'µm': 1e3, um: 1e3, mm: 1e6, cm: 1e7 },
  m: { m: 1, nm: 1e-9, pm: 1e-12, 'å': 1e-10, a: 1e-10, 'µm': 1e-6, um: 1e-6, mm: 1e-3, cm: 1e-2, km: 1e3 },
  pm: { pm: 1, nm: 1e3, m: 1e12, 'å': 100, a: 100 },
  eV: { ev: 1, j: 1 / 1.602e-19 },
  J: { j: 1, ev: 1.602e-19 },
  Hz: { hz: 1, khz: 1e3, mhz: 1e6, ghz: 1e9, thz: 1e12, phz: 1e15, 's-1': 1 },
  'cm⁻¹': { 'cm-1': 1, 'cm⁻¹': 1, 'm-1': 0.01, 'm⁻¹': 0.01 },
  'm⁻¹': { 'm-1': 1, 'm⁻¹': 1, 'cm-1': 100, 'cm⁻¹': 100 },
  'g/mol': { 'g/mol': 1, 'g.mol-1': 1, 'gmol-1': 1, g: 1 },
  '%': { '%': 1 },
  'm/s': { 'm/s': 1, 'm.s-1': 1, 'ms-1': 1, 'km/s': 1e3 }

function parseNum(input, unit) {
  let s = String(input).trim().replace(/\s+/g, '').replace(/,/g, '.').replace(/[−–]/g, '-').replace(/[×·∙*]/g, 'x').replace(/⁻/g, '-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => SUP.indexOf(c));
  if (!s) return { err: '' };
  s = s.replace(/^10\^/, '1x10^');
  const m = /^([-+]?(?:\d+\.?\d*|\.\d+))(?:[eE]([-+]?\d+)|x10\^?\(?([-+]?\d+)\)?|\.10\^\(?([-+]?\d+)\)?)?(.*)$/.exec(s);

  let v = parseFloat(m[1]); const ex = m[2] || m[3] || m[4]; if (ex) v *= 10 ** +ex;
  const u = (m[5] || '').toLowerCase();
  if (!u) return { v };
  const map = UNITS[unit] || {}, f = map[u];
  if (f == null) return { err: `unité non reconnue (attendu : ${unit || 'sans unité'})` };
  return { v: v * f };

/* =====================================================================
   DONNÉES : éléments (Z = 1 à 56), configurations électroniques
   ===================================================================== */
const EL = [null, ['H', 'hydrogène'], ['He', 'hélium'], ['Li', 'lithium'], ['Be', 'béryllium'], ['B', 'bore'], ['C', 'carbone'], ['N', 'azote'], ['O', 'oxygène'], ['F', 'fluor'], ['Ne', 'néon'],
  ['Na', 'sodium'], ['Mg', 'magnésium'], ['Al', 'aluminium'], ['Si', 'silicium'], ['P', 'phosphore'], ['S', 'soufre'], ['Cl', 'chlore'], ['Ar', 'argon'], ['K', 'potassium'], ['Ca', 'calcium'],
  ['Sc', 'scandium'], ['Ti', 'titane'], ['V', 'vanadium'], ['Cr', 'chrome'], ['Mn', 'manganèse'], ['Fe', 'fer'], ['Co', 'cobalt'], ['Ni', 'nickel'], ['Cu', 'cuivre'], ['Zn', 'zinc'],
  ['Ga', 'gallium'], ['Ge', 'germanium'], ['As', 'arsenic'], ['Se', 'sélénium'], ['Br', 'brome'], ['Kr', 'krypton'], ['Rb', 'rubidium'], ['Sr', 'strontium'], ['Y', 'yttrium'], ['Zr', 'zirconium'],
  ['Nb', 'niobium'], ['Mo', 'molybdène'], ['Tc', 'technétium'], ['Ru', 'ruthénium'], ['Rh', 'rhodium'], ['Pd', 'palladium'], ['Ag', 'argent'], ['Cd', 'cadmium'], ['In', 'indium'], ['Sn', 'étain'],
  ['Sb', 'antimoine'], ['Te', 'tellure'], ['I', 'iode'], ['Xe', 'xénon'], ['Cs', 'césium'], ['Ba', 'baryum']];

const CAP = { s: 2, p: 6, d: 10, f: 14 };
const NOBLE = { He: 2, Ne: 10, Ar: 18, Kr: 36, Xe: 54 };

function klech(Z) { const o = {}; let e = Z; for (const s of ORDER) { if (e <= 0) break; const k = Math.min(e, CAP[s[1]]); o[s] = k; e -= k; } return o; }
// règles du cours : (n-1)d4 ns2 → (n-1)d5 ns1 et (n-1)d9 ns2 → (n-1)d10 ns1
function conf(Z) {
  const o = klech(Z);
  for (const [d, s] of [['3d', '4s'], ['4d', '5s']]) if (o[s] === 2 && (o[d] === 4 || o[d] === 9)) { o[d]++; o[s] = 1; }
  return o;
}
const isExc = Z => JSON.stringify(conf(Z)) !== JSON.stringify(klech(Z));
const subKey = s => +s[0] * 10 + 'spdf'.indexOf(s[1]);
const sorted = o => Object.keys(o).filter(k => o[k] > 0).sort((a, b) => subKey(a) - subKey(b));
const confTex = o => sorted(o).map(k => `${k}^{${o[k]}}`).join('\\,');
function coreOf(o) {   // gaz rare de cœur le plus grand
  let best = null;
  for (const [g, z] of Object.entries(NOBLE)) { const c = conf(z); if (Object.keys(c).every(k => (o[k] || 0) >= c[k]) && Object.values(o).reduce((a, b) => a + b, 0) > z) best = g; }
  return best;
}
function confShortTex(o) {
  const g = coreOf(o); if (!g) return confTex(o);
  const c = conf(NOBLE[g]), rest = {}; Object.keys(o).forEach(k => { const r = o[k] - (c[k] || 0); if (r > 0) rest[k] = r; });
  return `(${g})\\,${confTex(rest)}`;
}
function ionConf(Z, q) {   // ions des blocs s et p : on retire les électrons de la couche externe (ou on en ajoute)
  const o = conf(Z);
  if (q > 0) { let k = q; for (const s of sorted(o).reverse()) { const t = Math.min(k, o[s]); o[s] -= t; k -= t; if (!k) break; } }
  else { let k = -q; for (const s of ORDER) { const free = CAP[s[1]] - (o[s] || 0); if (free > 0 && k > 0) { const t = Math.min(k, free); o[s] = (o[s] || 0) + t; k -= t; } if (!k) break; } }
  Object.keys(o).forEach(k => { if (!o[k]) delete o[k]; });
  return o;
}
function parseConf(input) {
  let s = String(input).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => SUP.indexOf(c)).replace(/[\^\s,;.]/g, '').replace(/[\[\]\(\)]/g, '');
  if (!s) return { err: '' };
  const o = {};
  const core = /^(He|Ne|Ar|Kr|Xe)/i.exec(s);
  if (core) { const g = core[1][0].toUpperCase() + core[1][1].toLowerCase(); Object.assign(o, conf(NOBLE[g])); s = s.slice(2); }
  const re = /([1-7])([spdf])(\d{1,2}?)(?=[1-7][spdf]|$)/gy;
  let m, pos = 0;
  while (pos < s.length) {
    re.lastIndex = pos; m = re.exec(s);
    if (!m) return { err: `je ne comprends pas « ${s.slice(pos, pos + 6)} » : écris par exemple 1s2 2s2 2p6 ou (Ar) 3d5 4s1` };
    const k = m[1] + m[2], v = +m[3];
    if (v > CAP[m[2]]) return { err: `${k} ne peut pas contenir ${v} électrons (maximum ${CAP[m[2]]})` };

}
const sameConf = (a, b) => { const ks = new Set([...Object.keys(a), ...Object.keys(b)]); for (const k of ks) if ((a[k] || 0) !== (b[k] || 0)) return false; return true; };
const unpaired = o => Object.keys(o).reduce((s, k) => { const orb = CAP[k[1]] / 2, e = o[k]; return s + (e <= orb ? e : 2 * orb - e); }, 0);

function check(it, raw) {
  if (it.type === 'choice') return raw ? { st: raw === it.ans ? 'ok' : 'bad' } : { st: 'empty' };
  if (it.type === 'int') {
    const s = String(raw || '').trim().replace(/\s/g, '').replace('−', '-'); if (!s) return { st: 'empty' };
    if (!/^[-+]?\d+$/.test(s)) return { st: 'err', msg: 'écris un nombre entier' };
    return { st: +s === it.val ? 'ok' : 'bad' };
  }
  if (it.type === 'num') {
    const p = parseNum(raw || '', it.unit); if (p.err !== undefined) return { st: p.err ? 'err' : 'empty', msg: p.err };
    const tol = it.tol || 0.02, ok = Math.abs(p.v - it.val) <= tol * Math.abs(it.val) + 1e-12;
    if (!ok && Math.abs(p.v + it.val) <= tol * Math.abs(it.val)) return { st: 'bad', msg: 'au signe près : attention au signe.' };
    if (!ok && Math.abs(p.v / it.val) > 0 && Math.abs(Math.log10(Math.abs(p.v / it.val)) - Math.round(Math.log10(Math.abs(p.v / it.val)))) < 0.01 && Math.round(Math.log10(Math.abs(p.v / it.val)))) return { st: 'bad', msg: 'erreur de puissance de 10 : vérifie tes conversions d\'unités.' };
    return { st: ok ? 'ok' : 'bad' };
  }
  if (it.type === 'conf') {
    const p = parseConf(raw || ''); if (p.err !== undefined) return { st: p.err ? 'err' : 'empty', msg: p.err };
    if (sameConf(p.o, it.conf)) {
      const order = String(raw).match(/[1-7][spdf]/g) || [], byN = order.slice().sort((a, b) => subKey(a) - subKey(b));
      return { st: 'ok', msg: order.join() !== byN.join() ? 'juste. Le cours demande d\'écrire la configuration finale dans l\'ordre des n croissants (3d avant 4s).' : '' };
    }

  ['II. Spectres atomiques', `<p>La lumière est à la fois une <b>onde</b> (\\(\\lambda\\), \\(\\nu = c/\\lambda\\), \\(\\bar\\nu = 1/\\lambda\\)) et un flux de <b>photons</b> d'énergie \\(E = h\\nu = \\dfrac{hc}{\\lambda}\\) (Planck, Einstein). De Broglie : toute particule a une onde associée \\(\\lambda = \\dfrac{h}{mv}\\).</p>
    <h4>Atome d'hydrogène (Bohr)</h4><p>L'énergie est <b>quantifiée</b> : \\(E_n = -\\dfrac{13{,}6}{n^2}\\ \\text{eV}\\) (\\(n\\) = couche). Fondamental : \\(n = 1\\), \\(E_1 = -13{,}6\\) eV. Ionisation : \\(E_i = 13{,}6\\) eV.</p>
    <ul><li><b>Absorption</b> : l'électron monte (\\(\\Delta E > 0\\)), un photon est absorbé. <b>Émission</b> : il redescend, un photon est émis.</li><li>Photon : \\(h\\nu = |E_p - E_n| = 13{,}6\\left(\\dfrac{1}{n^2} - \\dfrac{1}{p^2}\\right)\\) eV. Ritz : \\(\\dfrac1\\lambda = R_H\\left(\\dfrac{1}{n^2} - \\dfrac{1}{p^2}\\right)\\), \\(R_H = 1{,}097\\times10^{7}\\ \\text{m}^{-1}\\).</li></ul>
    <table class="t"><tr><th>Retour sur</th><th>Série</th><th>Domaine</th></tr><tr><td>n = 1</td><td>Lyman</td><td>UV</td></tr><tr><td>n = 2</td><td>Balmer</td><td>visible (4 raies : 410, 434, 486, 656 nm)</td></tr><tr><td>n = 3</td><td>Paschen</td><td>IR</td></tr><tr><td>n = 4, 5</td><td>Brackett, Pfund</td><td>IR</td></tr></table>
    <div class="box key"><h5>Hydrogénoïdes</h5>Un seul électron (He<sup>+</sup>, Li<sup>2+</sup>, Be<sup>3+</sup>) : \\(E_n = -13{,}6\\,\\dfrac{Z^2}{n^2}\\) eV. Les énergies sont \\(Z^2\\) fois plus grandes, les longueurs d'onde \\(Z^2\\) fois plus petites.</div>
    <div class="box warn"><h5>Pièges</h5>Convertir nm → m et eV → J (1 eV = \\(1{,}602\\times10^{-19}\\) J). Raies limites : \\(\\lambda_{max}\\) pour \\(p = n + 1\\), \\(\\lambda_{min}\\) pour \\(p \\to \\infty\\). Depuis le niveau \\(p\\), on peut observer \\(p(p-1)/2\\) raies.</div>`],
  ['III. Modèle quantique', `<p>Plus de trajectoire : l'électron est décrit par une <b>fonction d'onde</b> \\(\\psi\\), solution de l'équation de Schrödinger \\(\\hat H\\psi = E\\psi\\). \\(|\\psi|^2\\) = densité de probabilité de présence ; \\(\\psi\\) est normée. <b>Heisenberg</b> : \\(\\Delta x\\,\\Delta p \\geq \\dfrac{h}{4\\pi}\\).</p>
    <h4>Les 4 nombres quantiques</h4><table class="t"><tr><th>Nombre</th><th>Valeurs</th><th>Rôle</th></tr><tr><td>\\(n\\)</td><td>1, 2, 3…</td><td>couche, énergie, taille</td></tr><tr><td>\\(\\ell\\)</td><td>0 à \\(n - 1\\)</td><td>sous-couche, forme (s, p, d, f)</td></tr><tr><td>\\(m_\\ell\\)</td><td>\\(-\\ell\\) à \\(+\\ell\\)</td><td>orientation (\\(2\\ell + 1\\) O.A.)</td></tr><tr><td>\\(m_s\\)</td><td>\\(\\pm\\tfrac12\\)</td><td>spin</td></tr></table>
    <ul><li>Une O.A. = un triplet \\((n, \\ell, m_\\ell)\\) = une case quantique, au plus 2 électrons.</li><li>La couche \\(n\\) contient \\(n^2\\) O.A. et \\(2n^2\\) électrons au maximum. s : 1 O.A. (2 e⁻), p : 3 (6 e⁻), d : 5 (10 e⁻), f : 7 (14 e⁻).</li><li>O.A. s : sphérique ; p : deux lobes selon un axe (px, py, pz).</li></ul>`],
  ['IV. Atomes polyélectroniques', `<p>Plusieurs électrons : l'énergie dépend de \\(n\\) <b>et</b> de \\(\\ell\\) (effet d'écran, modèle de Slater : \\(Z^* = Z - \\sigma\\)).</p>
    <h4>Les 3 règles de remplissage</h4><ul><li><b>Pauli</b> : deux électrons ne peuvent pas avoir les 4 mêmes nombres quantiques → 2 électrons de spins opposés par case.</li><li><b>Klechkowski</b> : on remplit par \\(n + \\ell\\) croissant, puis \\(n\\) croissant : 1s 2s 2p 3s 3p <b>4s 3d</b> 4p 5s 4d 5p 6s 4f 5d 6p.</li><li><b>Hund</b> : dans des cases de même énergie, un électron par case (spins parallèles) avant d'apparier.</li></ul>
    <div class="box warn"><h5>Exceptions à connaître</h5>\\((n-1)d^4\\,ns^2 \\to (n-1)d^5\\,ns^1\\) et \\((n-1)d^9\\,ns^2 \\to (n-1)d^{10}\\,ns^1\\) : Cr (Z = 24) = (Ar) 3d<sup>5</sup> 4s<sup>1</sup>, Cu (Z = 29) = (Ar) 3d<sup>10</sup> 4s<sup>1</sup>, de même Mo et Ag.</div>
    <div class="box key"><h5>Écriture</h5>On remplit dans l'ordre de Klechkowski, mais on <b>écrit</b> la configuration par \\(n\\) croissant : V (Z = 23) → 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>3</sup> 4s<sup>2</sup>, ou en abrégé (Ar) 3d<sup>3</sup> 4s<sup>2</sup>. Électrons de valence = ceux de \\(n\\) maximal + sous-couches en cours de remplissage.</div>`],
  ['V. Tableau périodique et propriétés', `<p>Classement par \\(Z\\) croissant : 7 <b>périodes</b> (même \\(n\\) externe), 18 <b>colonnes</b> (même configuration externe → propriétés analogues).</p>
    <div class="box key"><h5>Retrouver la place d'un élément</h5>Période = \\(n\\) le plus grand. Colonne : \\(ns^x\\) → \\(x\\) ; \\(ns^x np^y\\) → \\(x + y + 10\\) ; \\((n-1)d^y ns^x\\) → \\(x + y\\). Exception : He en colonne 18. Blocs s (col. 1-2), d (3-12), p (13-18), f (lanthanides, actinides).</div>
    <p>Familles : alcalins (col. 1, ns<sup>1</sup>, sauf H), alcalino-terreux (2), chalcogènes (16), halogènes (17), gaz rares (18), métaux de transition (3 à 12).</p>
    <h4>Évolutions</h4><table class="t"><tr><th></th><th>dans une période (→)</th><th>dans une colonne (↓)</th></tr><tr><td>Rayon atomique</td><td>diminue (\\(Z^*\\) ↑)</td><td>augmente (\\(n\\) ↑)</td></tr><tr><td>Énergie d'ionisation</td><td>augmente</td><td>diminue</td></tr><tr><td>Électronégativité</td><td>augmente</td><td>diminue</td></tr><tr><td>Caractère métallique</td><td>diminue</td><td>augmente</td></tr></table>
    <ul><li>Cation plus petit que l'atome, anion plus gros.</li><li>Électronégativité max : F (4,0) ; nulle pour les gaz rares.</li><li>Ions : colonnes 1, 2, 13 → +I, +II, +III ; colonnes 16, 17 → −II, −I (structure du gaz rare le plus proche).</li><li>\\(\\Delta\\chi > 1{,}7\\) : liaison ionique ; sinon covalente (à droite) ou métallique (à gauche).</li></ul>
    <div class="box warn"><h5>Anomalies d'énergie d'ionisation</h5>E.I.(Be) > E.I.(B) et E.I.(Mg) > E.I.(Al) : ns<sup>2</sup> pleine est stable. E.I.(N) > E.I.(O) et E.I.(P) > E.I.(S) : np<sup>3</sup> demi-pleine est stable. E.I.(Zn) > E.I.(Ga) : 3d<sup>10</sup> 4s<sup>2</sup> pleines.</div>`]
];
function vCours(open) {
  app.innerHTML = `<div><p class="eyebrow">Partie 1 · L'atome (CC du 20/10)</p><h1>Le cours utile</h1><p class="lede">Les 5 chapitres du cours de V. Bouquet, condensés : définitions, formules, méthodes et pièges.</p></div>
    ${FICHES.map(([t, b], i) => `<details class="fiche" id="fiche${i}"${open === i ? ' open' : ''}><summary>${esc(t)}</summary><div class="body">${b}</div></details>`).join('')}
    <section class="card"><h2>Constantes (poly de TD)</h2><p class="sub">\\(h = 6{,}626\\times10^{-34}\\) J·s · \\(c = 3{,}00\\times10^{8}\\) m/s · \\(N_A = 6{,}022\\times10^{23}\\) mol⁻¹ · \\(R_H = 1{,}097\\times10^{7}\\) m⁻¹ · \\(e = 1{,}602\\times10^{-19}\\) C · \\(m_e = 9{,}11\\times10^{-31}\\) kg · \\(m_n = 1{,}675\\times10^{-27}\\) kg</p></section>`;
  typeset(app);
  if (open != null) { const f = $('#fiche' + open); if (f) setTimeout(() => f.scrollIntoView({ behavior: 'smooth' }), 60); }
}

/* ---------- Sujet blanc ---------- */
let EXAM = null, tick = 0;
const EXAM_PLAN = [['Exercice 1 · Structure de l\'atome', [['noyau', 1], ['iso', 0]], 4], ['Exercice 2 · Spectre de l\'hydrogène', [['trans', 0], ['serie', 2]], 6], ['Exercice 3 · Nombres quantiques et configurations', [['nq', 2], ['exc', 0], ['conf', 1]], 6], ['Exercice 4 · Classification périodique', [['place', 1], ['prop', 2]], 4]];
function examExos(seed) {
  const g = G(rng(seed));
  return EXAM_PLAN.map(([title, parts, pts]) => ({ title, pts, parts: parts.map(([id, d]) => build(id, d, Math.floor(g.r() * 4294967296))) }));
}
function vBlanc() {
  const E = ls.get('ato.exam.v1', null);
  if (E && !EXAM) { EXAM = E; EXAM.running = true; }
  if (EXAM) return renderExam();
  const H = ls.get(HK, []);
  app.innerHTML = `<div><p class="eyebrow">Conditions réelles · 1 h · noté sur 20</p><h1>Sujet blanc</h1><p class="lede">4 exercices dans le style des TD : structure de l'atome (4 pts), spectre de l'hydrogène (6 pts), nombres quantiques et configurations (6 pts), classification périodique (4 pts). Calculatrice autorisée pour l'entraînement : vérifie la règle le jour du CC.</p></div>
    <section class="card"><div class="row"><button type="button" class="btn btn-primary btn-lg" data-act="exam">Commencer (60 min)</button><span class="fine">Prévois une feuille : les justifications se font sur papier, seuls les résultats sont saisis ici.</span></div></section>
    <section class="card"><h2>Mes copies</h2>${H.length ? `<table class="hist"><tr><th>Date</th><th>Note</th><th>Durée</th></tr>${H.slice().reverse().map(r => `<tr><td>${new Date(r.ts).toLocaleDateString('fr-FR')}</td><td><b>${String(r.note.toFixed(1)).replace('.', ',')}/20</b></td><td>${Math.round(r.dur / 60)} min</td></tr>`).join('')}</table>` : '<p class="sub">Aucune copie pour l\'instant.</p>'}</section>`;
}
function renderExam() {
  const exs = examExos(EXAM.seed);
  app.innerHTML = `<div><p class="eyebrow">Sujet blanc d'atomistique</p><h1>CC · 1 h</h1></div>`
    + exs.map((ex, i) => `<section class="card"><h2>${esc(ex.title)} <span class="fine">(${ex.pts} points)</span></h2>${ex.parts.map(p => `<div class="ex" style="margin-top:14px"><div class="q">${p.q}</div><div class="items">${p.items.map(it => itemHTML(it, it.id, EXAM.ans[it.id] || '')).join('')}</div>${EXAM.done ? `<details class="corr" open><summary>Correction</summary><div class="expl">${p.corr}</div></details>` : ''}</div>`).join('')}</section>`).join('')
    + (EXAM.done ? `<section class="card"><div class="row"><span class="score">${String(EXAM.note.toFixed(1)).replace('.', ',')}</span><span class="sub">/ 20</span><span class="sp"></span><button type="button" class="btn btn-primary" data-act="examNew">Nouveau sujet</button></div></section>`
      : `<div class="row" style="justify-content:center"><button type="button" class="btn btn-primary btn-lg" data-act="submit">Rendre la copie</button></div>`);
  typeset(app);
  if (EXAM.done) exs.forEach(ex => ex.parts.forEach(p => p.items.forEach(it => showFb(app, it))));
  startTick();
}
function startTick() {
  clearInterval(tick); const clk = $('#clock');
  if (!EXAM || EXAM.done) { clk.hidden = true; return; }
  clk.hidden = false;
  const upd = () => { const left = 3600 - (Date.now() - EXAM.t0) / 1000; clk.textContent = `${Math.max(0, Math.floor(left / 60))}:${String(Math.max(0, Math.floor(left % 60))).padStart(2, '0')}`; clk.classList.toggle('rush', left < 300); if (left <= 0) submitExam(true); };
  upd(); tick = setInterval(upd, 1000);
}
function submitExam(auto) {
  if (!EXAM || EXAM.done) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  const exs = examExos(EXAM.seed); let note = 0;
  exs.forEach(ex => { const its = [].concat(...ex.parts.map(p => p.items)); const ok = its.filter(it => check(it, EXAM.ans[it.id] || '').st === 'ok').length; note += ex.pts * ok / its.length; });
  EXAM.done = true; EXAM.note = note; EXAM.running = false;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(3600, Math.round((Date.now() - EXAM.t0) / 1000)) }); ls.set(HK, H);
  try { localStorage.removeItem('ato.exam.v1'); } catch (e) { /* ignore */ }
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
  const fi = e.target.closest('[data-fiche]'); if (fi) { setTab('cours'); vCours(+fi.dataset.fiche); return; }
  const go = e.target.closest('[data-go]');
  if (go) { if (CUR && CUR.mode === 'path' && !CUR.done && CUR.k.id === go.dataset.go) { $('#exHost').scrollIntoView({ behavior: 'smooth' }); return; } startEx(skById(go.dataset.go), { user: true }); renderPathTop(); renderMap(); return; }
  const ft = e.target.closest('[data-ft]'); if (ft) { FREE.id = ft.dataset.ft; vExos(); return; }
  const fd = e.target.closest('[data-fd]'); if (fd) { FREE.d = +fd.dataset.fd; vExos(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'check') checkCur();
  else if (act === 'next') nextPath();
  else if (act === 'skip') { const P = pst(); P.cur = null; P.curT = Date.now(); ls.set(PK, P); CUR = null; nextPath({ fresh: true, user: true }); }
  else if (act === 'again') startEx(skById(FREE.id), { d: FREE.d, mode: 'free' });
  else if (act === 'exam') { EXAM = { seed: newSeed(), t0: Date.now(), ans: {}, running: true, done: false }; ls.set('ato.exam.v1', EXAM); renderExam(); }
  else if (act === 'submit') submitExam(false);
  else if (act === 'examNew') { EXAM = null; vBlanc(); $('#clock').hidden = true; }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.matches('input')) return;
  const id = t.dataset.id || t.name; if (!id) return;
  if (EXAM && !EXAM.done && VIEW === 'blanc') { EXAM.ans[id] = t.value; try { localStorage.setItem('ato.exam.v1', JSON.stringify(EXAM)); } catch (err) { /* ignore */ } }
  else if (CUR && !CUR.done) { CUR.ans[id] = t.value; clearTimeout(saveT); saveT = setTimeout(saveCur, 400); }
  if (t.type === 'text') {
    const it = (CUR && CUR.ex.items.find(x => x.id === id)) || (EXAM && [].concat(...examExos(EXAM.seed).map(x => [].concat(...x.parts.map(p => p.items)))).find(x => x.id === id));
    const pv = t.closest('.it') && $('.prev', t.closest('.it')); if (it && pv) pv.innerHTML = preview(it, t.value);
  }
});
document.addEventListener('change', e => { if (e.target.type === 'radio') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
let saveT = 0;
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#exHost input[type=text]')) { e.preventDefault(); checkCur(); } });
document.addEventListener('toggle', e => { if (CUR && !CUR.done && e.target.matches && e.target.matches('#exHost details.corr') && e.target.open) { CUR.peek = true; saveCur(); } }, true);

/* ---------- Thème ---------- */
(function () {
  const ICON = { sun: '☀', moon: '☾', auto: '◐' }, KEY = 'qcm-maths-theme', btn = $('#themeBtn');
  function apply(t) { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; btn.textContent = ICON[t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon']; btn.dataset.mode = t; btn.title = 'Thème : ' + ({ auto: 'automatique', light: 'clair', dark: 'sombre' })[t]; }
  let t = 'auto'; try { t = localStorage.getItem(KEY) || 'auto'; } catch (e) { /* ignore */ }
  apply(t);
  btn.addEventListener('click', () => { const nx = ({ auto: 'light', light: 'dark', dark: 'auto' })[btn.dataset.mode]; try { localStorage.setItem(KEY, nx); } catch (e) { /* ignore */ } apply(nx); });
})();

/* ---------- Synchronisation (progression venue d'un autre appareil) ---------- */
function wireAccount() {
  const A = window.SiteAccount; if (!A) return;
  A.on('data', keys => {
    if (!keys.some(k => k.startsWith('ato.'))) return;
    if (CUR && CUR.mode === 'path' && !CUR.done && !Object.keys(CUR.first).length && !Object.keys(CUR.ans).length) CUR = null;
    if (VIEW === 'path') vPath(); else if (VIEW === 'home') vHome();
  });
}
if (window.SiteAccount) wireAccount(); else window.addEventListener('siteaccount', wireAccount, { once: true });

window.__ATO = { GEN, build, check, parseConf, parseNum, conf, klech, place, unpaired, ionConf, SK };   // tests
function boot() { const h = location.hash.slice(1); setTab(['home', 'path', 'cours', 'exos', 'blanc'].includes(h) ? h : 'home'); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
