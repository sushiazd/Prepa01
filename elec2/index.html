<!DOCTYPE html>
<html lang="fr">
<head>

<title>Électronique CC2 · Entraînement</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="../presence.js" data-external></script>
<script defer src="../account.js" data-lazy></script>
<style>
:root{
  color-scheme:light;
  --paper:#f4f2ec; --sheet:#fffefb; --sheet-2:#f8f6f1;
  --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;
  --rule:#e4e0d6; --rule-strong:#cdc8bb;
  --pen:#2446c8; --pen-hover:#1c389f; --pen-ink:#ffffff; --pen-soft:#eaeefc;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --bad:#c2352b; --bad-soft:#fbeceb; --warn:#9a5b00; --warn-soft:#fcf2da;
  --phys:#b45309; --phys-soft:#fcf0e1;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px -18px rgba(28,27,25,.25);
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
    --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
    --rule:#2e2d2a; --rule-strong:#45433e;
    --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340;
    --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
    --phys:#fbbf24; --phys-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
  --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --rule:#2e2d2a; --rule-strong:#45433e;
  --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340;
  --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
  --phys:#fbbf24; --phys-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none !important}
code{font-family:var(--mono);font-size:.9em;background:var(--sheet-2);padding:1px 5px;border-radius:5px;border:1px solid var(--rule)}
.katex{font-size:1.05em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 24px;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--phys);color:#fff;display:grid;place-items:center;font:italic 700 17px/1 var(--serif)}
.brand strong{display:block;font:600 15px/1.2 var(--sans)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:500 14px/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--sheet-2)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer}
.clock{font:800 22px/1 var(--sans);font-variant-numeric:tabular-nums}
.clock.rush{color:var(--bad)}
main{max-width:980px;margin:32px auto 90px;padding:0 24px;display:grid;gap:20px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--phys);margin-bottom:10px}
h1{font:600 clamp(28px,4.6vw,42px)/1.08 var(--serif);letter-spacing:-.02em}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:720px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px;min-width:0}
.card h2{font:600 21px/1.25 var(--serif)}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.fine{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn-primary:hover:not(:disabled){background:var(--pen-hover)}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:600 12.5px/1 var(--sans);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.part{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font:800 clamp(40px,7vw,58px)/1 var(--sans);letter-spacing:-.04em;color:var(--phys);font-variant-numeric:tabular-nums}
.count span{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* exercices */
.ex .q{font:17px/1.6 var(--serif);margin-top:8px}
.ex .q p+p{margin-top:8px}
.items{display:grid;gap:12px;margin-top:16px}
.it{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:4px 12px;align-items:center}
.it-lab{text-align:right;font:16px/1.3 var(--serif);overflow-wrap:anywhere}
.it-lab.w{font:15px/1.4 var(--sans);text-align:left}
.it.full{grid-template-columns:minmax(0,1fr)}
.it.full .fb,.it.full .pv,.it.full .vh{grid-column:1}
.it-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.it-in input[type=text]{flex:1;min-width:0;width:100%;max-width:340px;font:15px/1.3 var(--mono);font-variant-ligatures:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:9px;padding:9px 12px;min-height:42px}
.it.ex-expr .it-in input[type=text]{max-width:none}
.unit{font:15px/1 var(--sans);color:var(--ink-2);white-space:nowrap}
.pv,.vh{grid-column:2;min-width:0;overflow-x:auto;overflow-y:hidden}
.pv{padding:3px 0}
.pv{font-size:15px;color:var(--ink-2);min-height:0}
.pv:empty{display:none}
.vh{font-size:12.5px;color:var(--muted)}
.fb{grid-column:2;font-size:14px;color:var(--ink-2);min-width:0;overflow-x:auto;overflow-y:hidden}
.fb:empty{display:none}
.ch{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);cursor:pointer;font-size:14.5px}
.ch:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.ch input{accent-color:var(--pen);margin:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
details.corr{margin-top:14px}
details.corr>summary{cursor:pointer;font:600 14px/1 var(--sans);color:var(--pen);padding:6px 0}
.expl{margin-top:8px;padding:14px 18px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule);font:16px/1.6 var(--serif);overflow-x:auto}
.expl p+p,.expl ul{margin-top:8px}
.expl ul{padding-left:20px}
.strip{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--phys-soft);border:1px solid color-mix(in srgb,var(--phys) 35%,transparent)}
.strip b{font:600 17px/1.3 var(--serif)}
.lvl{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)} .lvl i.on{background:var(--phys)}
.tag-rev{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:600 11.5px/1 var(--sans)}
.res{border-color:color-mix(in srgb,var(--pen) 40%,transparent)}
.psk{display:grid;grid-template-columns:24px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.psk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.psk.val .ic{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.psk.cur .ic{background:var(--phys);color:#fff;border-color:transparent}
.psk.rev .ic{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.psk.lock{opacity:.5}
.psk .nm small{display:block;color:var(--muted);font-size:12.5px}
.pch h3{font:600 17px/1.3 var(--serif);margin:16px 0 4px}
/* cours */
.fiche{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.fiche>summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;cursor:pointer;list-style:none;font:600 18px/1.3 var(--serif)}
.fiche>summary::-webkit-details-marker{display:none}
.fiche>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.fiche[open]>summary::before{transform:rotate(90deg)}
.fiche>summary .tag{margin-left:auto;font:600 11.5px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--phys-soft);color:var(--phys)}
.fiche .body{padding:4px 24px 22px;border-top:1px solid var(--rule);font:16.5px/1.65 var(--serif);overflow-x:auto}
.fiche .body p,.fiche .body ul,.fiche .body ol{margin-top:10px}
.fiche .body ul,.fiche .body ol{padding-left:22px}
.box{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.box.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.box.key{background:var(--phys-soft);border-color:color-mix(in srgb,var(--phys) 30%,transparent)}
.box h5{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;color:var(--ink-2)}
table.t{border-collapse:collapse;margin-top:10px;font:14.5px/1.4 var(--sans)}
table.t td,table.t th{border:1px solid var(--rule);padding:6px 10px;text-align:left}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);font:500 13.5px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.score{font:800 clamp(48px,9vw,72px)/1 var(--sans);letter-spacing:-.03em}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--rule);text-align:left}
.fig{display:block;width:100%;max-width:470px;height:auto;margin:14px auto 0}
.fig .wr,.fig .wrp{stroke:var(--ink);stroke-width:2;fill:none}
.fig .cp{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.fig .nd{fill:var(--ink)}
.fig .ua{stroke:var(--bad);stroke-width:2}
.fig .mku{fill:var(--bad)}
.fig text{fill:var(--ink);font:600 14px/1 var(--sans)}
.fig text.sg{font-size:12px}
.fig text.ul{fill:var(--bad)}
.fig text.nA{fill:var(--pen)}
@media (max-width:760px){
  .topbar{padding:8px 16px}
  .brand small{display:none}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  main{padding:0 16px;margin-top:22px}
  .card{padding:18px}
  .grid2{grid-template-columns:1fr}
  .it{grid-template-columns:1fr}
  .it-lab{text-align:left}
  .fb,.pv,.vh{grid-column:1}
  .psk{grid-template-columns:24px minmax(0,1fr) auto} .psk .bar{display:none}
  .fiche .body{padding:4px 16px 18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>

    <div class="box key"><h5>Pont diviseur de courant</h5>Schéma : \\(I\\) arrive sur \\(N\\) résistances en parallèle, même tension \\(U\\). Loi des nœuds \\(I = \\sum_k I_k\\) ; loi d'Ohm \\(I_k = \\frac{U}{R_k}\\) ; donc \\(I = U\\sum_k\\frac1{R_k}\\) et \\[I_k = \\frac{1/R_k}{\\sum_{j=1}^N 1/R_j}\\,I\\]</div>
    <div class="box key"><h5>Millman (3 branches)</h5>Loi des nœuds en A : \\(I_1 + I_2 + I_3 = 0\\) ; loi d'Ohm \\(I_k = \\frac{V_k - V_A}{R_k}\\) ; donc \\[V_A = \\frac{\\frac{V_1}{R_1} + \\frac{V_2}{R_2} + \\frac{V_3}{R_3}}{\\frac1{R_1} + \\frac1{R_2} + \\frac1{R_3}}\\]</div>
    <div class="box key"><h5>Pont diviseur de tension</h5>Résistances en série, même courant \\(I\\) : \\(U = I\\sum R_j\\), \\(U_k = R_kI\\), donc \\(U_k = \\frac{R_k}{\\sum_j R_j}U\\).</div>
    <div class="box warn"><h5>Pièges</h5>Oublier le schéma avec les sens des courants et tensions · confondre les deux ponts diviseurs (courant : inverses des résistances).</div>`],
  ['2. Théorème de Thévenin', 'Thévenin (6-8 pts)', `<p>Tout circuit linéaire vu de deux bornes équivaut à une source \\(E_{TH}\\) en série avec \\(R_{TH}\\). Alors \\(U_L = \\dfrac{R_L}{R_{TH} + R_L}E_{TH}\\) (pont diviseur).</p>
    <ol><li><b>\\(R_{TH}\\)</b> : on enlève \\(R_L\\), on <b>éteint les sources</b> (source de tension → fil, source de courant → circuit ouvert) et on calcule la résistance vue des bornes.</li><li><b>\\(E_{TH}\\)</b> : tension à vide (sans \\(R_L\\)). La résistance entre le nœud et la borne ne porte aucun courant, donc \\(E_{TH} = V_A\\), calculé par <b>Millman</b>.</li><li>Remplacer dans le pont diviseur, puis faire l'A.N. sans calculatrice (simplifier les fractions).</li></ol>
    <div class="box key"><h5>Le circuit des annales (trois années de suite)</h5>\\(E_1\\) – \\(3R\\) – nœud A – deux branches \\(3R\\) (dont une avec \\(E_2\\)) – \\(R\\) – \\(R_L\\) : \\(3R\\parallel3R\\parallel3R = R\\), \\(R_{TH} = 2R\\) ; \\(E_{TH} = \\frac{E_1 + E_2}{3}\\) ; \\(U_L = \\frac{R_L}{2R + R_L}\\cdot\\frac{E_1 + E_2}{3}\\).</div>
    <div class="box warn"><h5>Pièges</h5>Une branche sans source compte pour \\(\\frac{0}{R}\\) au numérateur de Millman mais compte au dénominateur · une source à l'envers compte avec un signe moins.</div>`],
  ['3. Condensateur et bobine', 'C et L', `<table class="t"><tr><th></th><th>Condensateur</th><th>Bobine</th></tr><tr><td>Relation</td><td>\\(i = C\\dfrac{du}{dt}\\)</td><td>\\(u = L\\dfrac{di}{dt}\\)</td></tr><tr><td>Très basse fréquence (continu)</td><td>circuit ouvert</td><td>fil</td></tr><tr><td>Très haute fréquence</td><td>fil</td><td>circuit ouvert</td></tr><tr><td>Grandeur continue</td><td>la tension</td><td>le courant</td></tr><tr><td>Énergie</td><td>\\(\\frac12Cu^2\\)</td><td>\\(\\frac12Li^2\\)</td></tr></table>
    <div class="box key"><h5>Questions 1 à 3 de l'exercice 3</h5>Redessiner le schéma en BF puis en HF avec l'équivalent, en déduire \\(u(t)\\) (\\(e(t)\\) ou 0), puis la nature du filtre : si \\(u = e\\) en BF et 0 en HF, passe-bas ; l'inverse, passe-haut.</div>`],
  ['4. Circuits du premier ordre', 'équations (8-10 pts)', `<table class="t"><tr><th>Circuit (sortie)</th><th>Équation</th><th>\\(\\tau\\)</th><th>Filtre</th></tr><tr><td>R puis C (u aux bornes de C)</td><td>\\(u + \\tau u' = e\\)</td><td>\\(RC\\)</td><td>passe-bas</td></tr><tr><td>C puis R (u aux bornes de R)</td><td>\\(u + \\tau u' = \\tau e'\\)</td><td>\\(RC\\)</td><td>passe-haut</td></tr><tr><td>L puis R (u aux bornes de R)</td><td>\\(u + \\tau u' = e\\)</td><td>\\(L/R\\)</td><td>passe-bas</td></tr><tr><td>R puis L (u aux bornes de L)</td><td>\\(u + \\tau u' = \\tau e'\\)</td><td>\\(L/R\\)</td><td>passe-haut</td></tr></table>
    <ul><li>Méthode : loi des mailles, relation de l'élément, éliminer l'autre inconnue, mettre sous la forme canonique.</li><li>Échelon \\(e = E\\) à \\(t = 0\\), \\(u(0) = 0\\) : \\(u(t) = U_1 + U_2e^{-t/\\tau}\\) avec \\(U_1 = E\\) (régime permanent) et \\(U_2 = -E\\) (condition initiale) : \\(u = E(1 - e^{-t/\\tau})\\).</li><li>Graphe : \\(0{,}63E\\) à \\(t = \\tau\\), tangente à l'origine qui coupe \\(u = E\\) en \\(\\tau\\), 95 % à \\(3\\tau\\), quasi fini à \\(5\\tau\\).</li></ul>
    <div class="box key"><h5>« Vérifier qu'une expression est solution »</h5>Dériver l'expression proposée, la remplacer dans l'équation, simplifier, et lire la condition (CC 2024-25 : \\(U_1 = E\\) ; CC 2025-26 : \\(e(t) = E_0\\cos\\omega t\\) ou \\(e = E_0\\)).</div>`],
  ['5. Régime sinusoïdal', 'sinusoïdal', `<ul><li>\\(e(t) = E_0\\cos(\\omega t)\\) : \\(\\omega\\) est la <b>pulsation</b> (rad/s), \\(\\omega = 2\\pi f\\), période \\(T = \\frac1f\\).</li><li>Passe-bas du 1<sup>er</sup> ordre : amplitude de sortie \\(\\dfrac{E_0}{\\sqrt{1 + (\\omega\\tau)^2}}\\), égale à \\(E_0/\\sqrt2\\) à la pulsation de coupure \\(\\omega_c = \\frac1\\tau\\), soit \\(f_c = \\frac{1}{2\\pi\\tau}\\).</li></ul>`],
  ['6. Méthode pour le CC2', 'méthode', `<p>1 h, sans document ni calculatrice, toujours le même plan : <b>Ex. 1</b> démo (4 pts), <b>Ex. 2</b> Thévenin à deux sources (6 à 8 pts), <b>Ex. 3</b> RC ou RL (8 à 10 pts). Les questions de l'exercice 3 précisent souvent « vous pouvez répondre sans avoir répondu à la question précédente » : ne reste pas bloqué.</p>
    <ol><li>Apprends par cœur les trois démos (fiche 1) : 4 points sûrs.</li><li>Thévenin : refais le circuit des annales jusqu'à le faire en 10 minutes.</li><li>RC/RL : BF/HF, filtre, relation de l'élément, équation, \\(\\tau\\), solution : toujours dans cet ordre.</li></ol>`]
];
function vCours(open) {
  app.innerHTML = `<div><p class="eyebrow">Électronique analogique · CC2 du 2/11</p><h1>Le cours utile</h1><p class="lede">Ce qu'il faut savoir pour le CC2, dans l'ordre des exercices des annales : démonstrations, Thévenin, condensateur et bobine, circuits du premier ordre.</p></div>
    ${FICHES.map(([t, tag, b], i) => `<details class="fiche" id="fiche${i}"${open === i ? ' open' : ''}><summary>${esc(t)}<span class="tag">${esc(tag)}</span></summary><div class="body">${b}</div></details>`).join('')}`;
  mathIn(app);
  if (open != null) { const f = $('#fiche' + open); if (f) setTimeout(() => f.scrollIntoView({ behavior: 'smooth' }), 60); }
}

/* ---------- Sujet blanc ---------- */
let tick = 0;
const DUR = 3600;
const EXAM_PLAN = [['Exercice 1 · Démonstration', [['demos', 0]], 4], ['Exercice 2 · Théorème de Thévenin', [['rth', 1], ['eth', 1], ['thev', 1]], 8], ['Exercice 3 · Circuit du premier ordre', [['bfhf', 1], ['edo', 1], ['reponse', 0]], 8]];
function examExos(seed) { const g = G(rng(seed)); return EXAM_PLAN.map(([title, parts, pts]) => ({ title, pts, parts: parts.map(([id, d]) => build(id, d, Math.floor(g.r() * 4294967296))) })); }
function vBlanc() {
  const E = ls.get(EK, null);
  if (E && !EXAM) { EXAM = E; EXAM.running = !E.done; }
  if (EXAM) return renderExam();
  const H = ls.get(HK, []);
  app.innerHTML = `<div><p class="eyebrow">Conditions réelles · 1 h · noté sur 20</p><h1>Sujet blanc</h1><p class="lede">Le format des quatre dernières annales : une démonstration (4 pts), Thévenin avec deux sources (8 pts), un circuit RC ou RL (8 pts).</p></div>
    <section class="card"><div class="row"><button type="button" class="btn btn-primary btn-lg" data-act="exam">Commencer (1 h)</button><span class="fine">Sans calculatrice : rédige la démo et les schémas sur une feuille, puis reporte les résultats.</span></div></section>
    <section class="card"><h2>Mes copies</h2>${H.length ? `<table class="hist"><tr><th>Date</th><th>Note</th><th>Durée</th></tr>${H.slice().reverse().map(r => `<tr><td>${new Date(r.ts).toLocaleDateString('fr-FR')}</td><td><b>${String(r.note.toFixed(1)).replace('.', ',')}/20</b></td><td>${Math.round(r.dur / 60)} min</td></tr>`).join('')}</table>` : '<p class="sub">Aucune copie pour l\'instant.</p>'}</section>`;
}
function renderExam() {
  EXAM.exs = examExos(EXAM.seed);
  app.innerHTML = `<div><p class="eyebrow">Sujet blanc d'électronique</p><h1>CC2 · 1 h</h1></div>`
    + EXAM.exs.map(ex => `<section class="card"><h2>${esc(ex.title)} <span class="fine">(${ex.pts} points)</span></h2>${ex.parts.map(p => `<div class="ex" style="margin-top:14px"><h3 style="font:600 17px/1.3 var(--serif)">${esc(p.title)}</h3><div class="q">${p.q}</div>${p.fig || ''}<div class="items">${p.items.map(it => itemHTML(it, it.id, EXAM.ans[it.id] || '')).join('')}</div>${EXAM.done ? `<details class="corr" open><summary>Correction</summary><div class="expl">${p.corr}${p.items.filter(it => it.type === 'expr').map(it => `<p>Formule attendue : \\(${it.sol}\\)</p>`).join('')}</div></details>` : ''}</div>`).join('')}</section>`).join('')
    + (EXAM.done ? `<section class="card"><div class="row"><span class="score">${String(EXAM.note.toFixed(1)).replace('.', ',')}</span><span class="sub">/ 20</span><span class="sp"></span><button type="button" class="btn btn-primary" data-act="examNew">Nouveau sujet</button></div></section>`
      : `<section class="card">${HELP}<div class="row" style="justify-content:center;margin-top:12px"><button type="button" class="btn btn-primary btn-lg" data-act="submit">Rendre la copie</button></div></section>`);
  mathIn(app);
  $$('input[data-expr]', app).forEach(preview);
  if (EXAM.done && EXAM.fb) Object.entries(EXAM.fb).forEach(([id, h]) => { const fb = $(`.it[data-id="${id}"] .fb`, app); if (fb) fb.innerHTML = h; });
  startTick();
}
function startTick() {
  clearInterval(tick); const clk = $('#clock');
  if (!EXAM || EXAM.done) { clk.hidden = true; return; }
  clk.hidden = false;
  const upd = () => { const left = DUR - (Date.now() - EXAM.t0) / 1000; clk.textContent = `${Math.floor(Math.max(0, left) / 3600)}:${String(Math.floor(Math.max(0, left) % 3600 / 60)).padStart(2, '0')}:${String(Math.floor(Math.max(0, left) % 60)).padStart(2, '0')}`; clk.classList.toggle('rush', left < 600); if (left <= 0) submitExam(true); };
  upd(); tick = setInterval(upd, 1000);
}
const saveExam = () => { const { exs, ...rest } = EXAM; try { localStorage.setItem(EK, JSON.stringify(rest)); } catch (e) { /* ignore */ } };
function submitExam(auto) {
  if (!EXAM || EXAM.done) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  clearInterval(tick);
  const exs = examExos(EXAM.seed); let note = 0; const fb = {};
  for (const ex of exs) {
    const its = [].concat(...ex.parts.map(p => p.items)); let got = 0;
    for (const it of its) { const r = check(it, EXAM.ans[it.id] || ''); fb[it.id] = fbHTML(r); got += r.st === 'ok' ? 1 : 0; }
    note += ex.pts * got / its.length;
  }
  EXAM.done = true; EXAM.running = false; EXAM.note = note; EXAM.fb = fb;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(DUR, Math.round((Date.now() - EXAM.t0) / 1000)) }); ls.set(HK, H);
  try { localStorage.removeItem(EK); } catch (e) { /* ignore */ }
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
let saveT = 0;
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
  const fi = e.target.closest('[data-fiche]'); if (fi) { setTab('cours'); vCours(+fi.dataset.fiche); return; }
  const go = e.target.closest('[data-go]');
  if (go) { if (CUR && CUR.mode === 'path' && !CUR.done && CUR.k.id === go.dataset.go) { $('#exHost').scrollIntoView({ behavior: 'smooth' }); return; } startEx(skById(go.dataset.go), { user: true }); renderPathTop(); renderMap(); return; }
  const ft = e.target.closest('[data-ft]'); if (ft) { FREE.id = ft.dataset.ft; vExos(); return; }
  const fd = e.target.closest('[data-fd]'); if (fd) { FREE.d = +fd.dataset.fd; vExos(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'check') checkCur();
  else if (act === 'next') nextPath();
  else if (act === 'skip') { const P = pst(); P.cur = null; P.curT = Date.now(); ls.set(PK, P); CUR = null; nextPath({ fresh: true, user: true }); }
  else if (act === 'again') startEx(skById(FREE.id), { d: FREE.d, mode: 'free' });
  else if (act === 'exam') { EXAM = { seed: newSeed(), t0: Date.now(), ans: {}, running: true, done: false }; saveExam(); renderExam(); }
  else if (act === 'submit') submitExam(false);
  else if (act === 'examNew') { EXAM = null; vBlanc(); $('#clock').hidden = true; }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.matches('input')) return;
  const id = t.dataset.id || t.name; if (!id) return;
  if (t.dataset.expr) preview(t);
  if (EXAM && !EXAM.done && VIEW === 'blanc') { EXAM.ans[id] = t.value; saveExam(); }
  else if (CUR && !CUR.done) { CUR.ans[id] = t.value; clearTimeout(saveT); saveT = setTimeout(saveCur, 400); }
});
document.addEventListener('change', e => { if (e.target.type === 'radio') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#exHost input[type=text]')) { e.preventDefault(); checkCur(); } });
document.addEventListener('toggle', e => { if (CUR && !CUR.done && e.target.matches && e.target.matches('#exHost details.corr') && e.target.open) { CUR.peek = true; saveCur(); } }, true);

(function () {
  const ICON = { sun: '☀', moon: '☾', auto: '◐' }, KEY = 'qcm-maths-theme', btn = $('#themeBtn');
  function apply(t) { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; btn.textContent = ICON[t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon']; btn.dataset.mode = t; btn.title = 'Thème : ' + ({ auto: 'automatique', light: 'clair', dark: 'sombre' })[t]; }
  let t = 'auto'; try { t = localStorage.getItem(KEY) || 'auto'; } catch (e) { /* ignore */ }
  apply(t);
  btn.addEventListener('click', () => { const nx = ({ auto: 'light', light: 'dark', dark: 'auto' })[btn.dataset.mode]; try { localStorage.setItem(KEY, nx); } catch (e) { /* ignore */ } apply(nx); });
})();
function wireAccount() {
  const A = window.SiteAccount; if (!A) return;
  A.on('data', keys => {
    if (!keys.some(k => k.startsWith('el2.'))) return;
    if (CUR && CUR.mode === 'path' && !CUR.done && !Object.keys(CUR.first).length && !Object.keys(CUR.ans).length) CUR = null;
    if (VIEW === 'path') vPath(); else if (VIEW === 'home') vHome();
  });
}
if (window.SiteAccount) wireAccount(); else window.addEventListener('siteaccount', wireAccount, { once: true });

window.__EL2 = { GEN, build, ladder, G, rng, fV, check, parseF, evF, texF, parseNum, SK, VD, FICHES };   // tests
function boot() { const h = location.hash.slice(1); setTab(['home', 'path', 'cours', 'exos', 'blanc'].includes(h) ? h : 'home'); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
