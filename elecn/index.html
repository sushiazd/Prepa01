<style>
:root{

    --dig:#38bdf8; --dig-soft:#0c2d48;
  }
}

  --dig:#38bdf8; --dig-soft:#0c2d48;
}
code{font-family:var(--mono);font-size:.9em;background:var(--sheet-2);padding:1px 5px;border-radius:5px;border:1px solid var(--rule)}
.katex{font-size:1.05em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--dig);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--mono)}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:740px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px;min-width:0}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.part{background:var(--warn-soft);color:var(--warn)}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}

.ch:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}

/* cours */

<script>
(function () {
'use strict';
/* =====================================================================
   OUTILS
   ===================================================================== */
const E = SiteCore({ id: 'eln', get LEARN() { return LEARN; }, get lesson() { return { itemHTML, check, valOf, fbHTML, answer: it => it.type === 'bw' ? it.ans : null }; },
  typeset: el => mathIn(el), get DUR() { return DUR; },
  get CH() { return CH; }, get SK() { return SK; }, get GEN() { return GEN; },
  get CUR() { return CUR; }, set CUR(v) { CUR = v; }, get EXAM() { return EXAM; }, set EXAM(v) { EXAM = v; }, get VIEW() { return VIEW; }, set VIEW(v) { VIEW = v; },
  views: { home: () => vHome(), cours: () => vCours(), exos: () => vExos(), blanc: () => vBlanc() },
  renderEx: () => renderEx(), renderExam: () => renderExam(), submitExam: auto => submitExam(auto),
  exam: () => examExos(EXAM.seed, EXAM.plan), answerText: it => it.type === 'bw' ? it.ans : null,
  examItems: () => [].concat(...examExos(EXAM.seed, EXAM.plan).map(x => [].concat(...x.parts.map(q => q.items)))), check: (it, raw) => check(it, raw), valOf: (r, id) => valOf(r, id), fbHTML: r => fbHTML(r) });
const { $, $$, app, esc, ls, toast, rng, G, newSeed, PILL, PK, HK, EK, skById, pst, skS, isVal, build,
  startEx, saveCur, finish, setTab, renderPathTop, renderMap, nextPath, startTick, stopTick, tally, examRecord, examPlan, weakButton, hideCorr, copyTag } = E;
function tx(s, disp) { if (window.katex) { try { return katex.renderToString(s, { throwOnError: false, displayMode: !!disp }); } catch (e) { /* repli */ } } return '<code>' + esc(s) + '</code>'; }
function mathIn(el) { if (el && window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false }); }

/* ---------- nombres, unités et mots binaires/oct/hexa ---------- */
function nfmt(x, s = 4) {
  if (!isFinite(x)) return '?';
  if (Math.abs(x) < 1e-12) return '0';
  return String(+x.toPrecision(s)).replace('.', ',');
}
const UN = {
  'V': { V: 1, mV: 1e-3, kV: 1e3 },
  'mV': { mV: 1, V: 1e3, 'µV': 1e-3, uV: 1e-3 },
  'mA': { mA: 1, A: 1e3, 'µA': 1e-3, uA: 1e-3 },
  'Hz': { Hz: 1, kHz: 1e3, MHz: 1e6 },
  'kHz': { kHz: 1, Hz: 1e-3, MHz: 1e3 },
  'MHz': { MHz: 1, kHz: 1e-3, Hz: 1e-6 },
  's': { s: 1, ms: 1e-3, 'µs': 1e-6, 'μs': 1e-6, us: 1e-6, ns: 1e-9 },
  'ms': { ms: 1, s: 1e3, 'µs': 1e-3, 'μs': 1e-3, us: 1e-3, ns: 1e-6 },
  'µs': { 'µs': 1, 'μs': 1, us: 1, ms: 1e3, s: 1e6, ns: 1e-3 },
  'ns': { ns: 1, 'µs': 1e3, 'μs': 1e3, us: 1e3, ms: 1e6, s: 1e9 },
  '%': { '%': 1 },
  '': {}
};
function parseNum(raw, unit) {
  const s = String(raw).trim().replace(/[−–]/g, '-').replace(/,/g, '.').replace(/\s+/g, ' ');
  if (!s) return { err: '' };
  const m = /^([-+]?(?:\d+\.?\d*|\.\d+))\s*(?:[eE]\s*([-+]?\d+)|(?:\*|x|×|·)\s*10\s*\^?\s*\(?\s*([-+]?\d+)\s*\)?)?\s*(.*)$/.exec(s);
  if (!m) return { err: 'écris un nombre (ex : 12,5 ou 256)' };
  const v = parseFloat(m[1]) * Math.pow(10, +(m[2] || m[3] || 0));
  const u = m[4].replace(/\s+/g, '');
  if (!u) return { v };
  const f = (UN[unit || ''] || {})[u];
  if (f === undefined) return { err: unit ? 'unité attendue : ' + unit : 'pas d\'unité attendue ici' };
  return { v: v * f };
}
function normWord(s, fixed) {
  let w = String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/\./g, ',');
  w = w.replace(/\((?:2|8|10|16)\)$/, '');
  if (!w) return '';
  if (fixed) return w;
  if (w.includes(',')) {
    const [a, b] = w.split(',');
    return (a.replace(/^0+(?=[0-9A-F])/, '') || '0') + ',' + b.replace(/0+$/, '');
  }
  return w.replace(/^0+(?=[0-9A-F])/, '') || '0';
}

/* ---------- constructeurs d'items et schémas ---------- */
const Ch = (lab, opts, ans) => ({ type: 'choice', lab, opts: opts.map(([v, t]) => ({ v, t })), ans });
const Nn = (lab, val, unit = '', tol = 0.015) => ({ type: 'num', lab, val, unit, tol });
const Bw = (lab, ans, fixed = false, ph = 'ex : 10110 ou 2B,8') => ({ type: 'bw', lab, ans: String(ans), fixed, ph });

const GRAY2 = ['00', '01', '11', '10'];
function kmapHTML(vars, cells) {
  if (vars === 3) {
    const rLab = ['0', '1'], cLab = GRAY2;
    return `<table class="kmap" aria-label="Tableau de Karnaugh à 3 variables"><tr><th>\\(a \\backslash bc\\)</th>${cLab.map(c => `<th>${c}</th>`).join('')}</tr>`
      + rLab.map((r, ri) => `<tr><th>${r}</th>${cLab.map((c, ci) => { const idx = parseInt(r + c, 2), v = cells[idx]; return `<td class="${v === 1 ? 'one' : v === 'X' ? 'dc' : ''}">${v}</td>`; }).join('')}</tr>`).join('') + '</table>';
  }
  return `<table class="kmap" aria-label="Tableau de Karnaugh à 4 variables"><tr><th>\\(ab \\backslash cd\\)</th>${GRAY2.map(c => `<th>${c}</th>`).join('')}</tr>`
    + GRAY2.map(r => `<tr><th>${r}</th>${GRAY2.map(c => { const idx = parseInt(r + c, 2), v = cells[idx]; return `<td class="${v === 1 ? 'one' : v === 'X' ? 'dc' : ''}">${v}</td>`; }).join('')}</tr>`).join('') + '</table>';
}
function mux4Fig(aLab, bLab, eLabs, outLab = 'S') {
  return `<svg class="fig" viewBox="0 0 360 190" role="img" aria-label="Multiplexeur 4 vers 1">
    <rect class="cp" x="130" y="20" width="100" height="120" rx="6"/>
    <text x="180" y="42" text-anchor="middle">MUX 4→1</text>
    ${[0, 1, 2, 3].map(i => { const y = 55 + i * 22; return `<line class="wr" x1="75" y1="${y}" x2="130" y2="${y}"/><text class="m" x="142" y="${y + 4}">E${i}</text><text class="m" x="68" y="${y + 4}" text-anchor="end">${eLabs[i]}</text>`; }).join('')}
    <line class="wr" x1="230" y1="80" x2="290" y2="80"/><text class="m" x="298" y="84">${outLab}</text>
    <line class="wr" x1="162" y1="140" x2="162" y2="168"/><line class="wr" x1="198" y1="140" x2="198" y2="168"/>
    <text class="mut" x="162" y="134" text-anchor="middle">B</text><text class="mut" x="198" y="134" text-anchor="middle">A</text>
    <text class="m" x="162" y="182" text-anchor="middle">${bLab}</text><text class="m" x="198" y="182" text-anchor="middle">${aLab}</text>
  </svg>`;
}
function addFig(n) {
  return `<svg class="fig" viewBox="0 0 340 165" role="img" aria-label="Opérateur ADD sur ${n} bits">
    <polygon class="cp" points="95,45 245,45 215,105 125,105"/>
    <text x="170" y="80" text-anchor="middle">ADD (${n} bits)</text>
    <line class="wr" x1="135" y1="12" x2="135" y2="45"/><text class="m" x="135" y="10" text-anchor="middle">X</text>
    <line class="wr" x1="205" y1="12" x2="205" y2="45"/><text class="m" x="205" y="10" text-anchor="middle">Y</text>
    <line class="wr" x1="170" y1="105" x2="170" y2="142"/><text class="m" x="170" y="156" text-anchor="middle">SOM</text>
    <polyline class="wr" points="110,75 65,75 65,132"/><text class="m" x="65" y="148" text-anchor="middle">rep</text>
  </svg>`;
}

/* =====================================================================
   GÉNÉRATEURS D'EXERCICES (12 compétences × 3 niveaux)
   ===================================================================== */
const GEN = {};
const bin = (n, w = 0) => (n >>> 0).toString(2).padStart(w, '0');
const oct = n => (n >>> 0).toString(8);
const hex = n => (n >>> 0).toString(16).toUpperCase();

/* ---------- 1. num : Bases 2, 8, 10, 16 et conversions ---------- */
GEN.num = (d, g) => {
  if (d === 0) {
    const n = g.int(19, 62), b = bin(n), o = oct(n), h = hex(n);
    const bits = g.pick([6, 7, 8, 9, 10]);
    return {
      title: 'Conversions entre bases 2, 8, 10 et 16',
      q: `<p>1) Convertir le nombre binaire \\(N = ${b}_2\\) en base 10, en base 8 (octal) et en base 16 (hexadécimal).</p><p>2) Combien de valeurs différentes peut-on coder sur ${bits} bits ?</p>`,
      items: [Nn('N_{10}', n), Bw('N_8', o), Bw('N_{16}', h), Nn('\\text{valeurs sur }' + bits + '\\text{ bits}', 1 << bits)],
      corr: `<p>1) En décimal : \\(${b}_2 = ${b.split('').map((c, i) => c === '1' ? (1 << (b.length - 1 - i)) : '').filter(Boolean).join(' + ')} = ${n}_{10}\\).</p>
        <p>En octal (blocs de 3 bits à partir de la droite) : \\(${b.padStart(Math.ceil(b.length / 3) * 3, '0')} \\to ${o}_8\\). En hexadécimal (blocs de 4 bits) : \\(${b.padStart(Math.ceil(b.length / 4) * 4, '0')} \\to \\mathrm{${h}}_{16}\\).</p>
        <p>2) Sur ${bits} bits, on code \\(2^{${bits}} = ${1 << bits}\\) valeurs distinctes (de \\(0\\) à \\(${(1 << bits) - 1}\\)).</p>`
    };
  }
  if (d === 1) {
    const n = g.int(140, 420), b = bin(n), o = oct(n), h = hex(n);
    const maxV = g.pick([300, 500, 750, 1000, 2000]), minB = Math.ceil(Math.log2(maxV + 1));
    return {
      title: 'Divisions successives et dimensionnement en bits',
      q: `<p>1) Convertir l'entier décimal \\(N = ${n}_{10}\\) en binaire, en octal et en hexadécimal (par divisions successives ou regroupement de bits).</p><p>2) Combien de bits faut-il au minimum pour coder tous les entiers de \\(0\\) à \\(${maxV}\\) ?</p>`,
      items: [Bw('N_2', b), Bw('N_8', o), Bw('N_{16}', h), Nn('n_{\\min}\\text{ (bits)}', minB)],
      corr: `<p>1) Par divisions successives par 2 (ou par 16 : \\(${n} = ${Math.floor(n / 16)}\\times 16 + ${n % 16}\\)) : \\(${n}_{10} = ${b}_2 = ${o}_8 = \\mathrm{${h}}_{16}\\).</p>
        <p>2) \\(2^{${minB - 1}} = ${1 << (minB - 1)} \\le ${maxV} < 2^{${minB}} = ${1 << minB}\\), donc il faut au minimum <b>${minB} bits</b>.</p>`
    };
  }
  const intP = g.int(9, 29), fracIdx = g.pick([1, 2, 3, 5, 6, 7]); // en huitièmes : 0,125 à 0,875
  const decVal = intP + fracIdx / 8;
  const fBin = bin(fracIdx, 3).replace(/0+$/, '');
  const bStr = `${bin(intP)},${fBin}`;
  const oStr = `${oct(intP)},${fracIdx}`;
  const hFrac = hex(fracIdx * 2);
  const hStr = `${hex(intP)},${hFrac}`;
  return {
    title: 'Nombres fractionnaires (à virgule)',
    q: `<p>Convertir le nombre décimal à virgule \\(N = ${String(decVal).replace('.', ',')}_{10}\\) en binaire, en octal et en hexadécimal (écris une virgule, par ex. <code>1101,101</code>).</p>`,
    items: [Bw('N_2', bStr), Bw('N_8', oStr), Bw('N_{16}', hStr)],
    corr: `<p>Partie entière : \\(${intP}_{10} = ${bin(intP)}_2\\). Partie fractionnaire : \\(${String(fracIdx / 8).replace('.', ',')} = ${fracIdx}/8 = 0{,}${bin(fracIdx, 3)}_2 = 0{,}${fBin}_2\\), donc \\(N_2 = ${bStr}_2\\).</p>
      <p>En regroupant par <b>3 bits de part et d'autre de la virgule</b> : \\(${bin(intP, 6)},${bin(fracIdx, 3)}_2 = ${oStr}_8\\).</p>
      <p>En regroupant par <b>4 bits de part et d'autre de la virgule</b> : \\(${bin(intP, 8)},${bin(fracIdx, 3)}0_2 = \\mathrm{${hStr}}_{16}\\).</p>`
  };
};

/* ---------- 2. addb : Addition binaire, opérateur ADD et complément à 2 ---------- */
GEN.addb = (d, g) => {
  if (d === 0) {
    const x = g.int(5, 14), y = g.int(3, 14), s = x + y, som = bin(s & 15, 4), rep = s > 15 ? 1 : 0;
    return {
      title: 'Opérateur ADD sur 4 bits',
      fig: addFig(4),
      q: `<p>On applique \\(X = ${bin(x, 4)}_2\\) et \\(Y = ${bin(y, 4)}_2\\) à un opérateur <code>ADD</code> sur 4 bits. Donner le mot de sortie \\(\\text{SOM}\\) (sur 4 bits), la retenue sortante \\(\\text{rep}\\) et la somme totale en décimal.</p>`,
      items: [Bw('\\text{SOM (4 bits)}', som, true, '4 bits'), Nn('\\text{rep}', rep), Nn('X + Y\\text{ (décimal)}', s)],
      corr: `<p>En décimal : \\(X = ${x}\\), \\(Y = ${y}\\), \\(X + Y = ${s} = ${bin(s, 5)}_2\\).</p>
        <p>Sur 4 bits : les 4 bits de poids faible forment \\(\\text{SOM} = ${som}_2\\) et la retenue sortante du 4<sup>e</sup> rang vaut \\(\\text{rep} = ${rep}\\).</p>`
    };
  }
  if (d === 1) {
    const pos = g.int(2, 7), neg = -g.int(1, 7), c2Neg = bin((16 + neg) & 15, 4);
    const x = g.int(35, 110), y = g.int(25, 110);
    return {
      title: 'Addition sur 8 bits et codage en complément à 2 (4 bits)',
      q: `<p>1) Poser l'addition binaire non signée \\(${bin(x, 8)}_2 + ${bin(y, 8)}_2\\).</p><p>2) Coder en <b>complément à 2 sur 4 bits</b> les entiers signés \\(+${pos}\\) et \\(${neg}\\) (écris bien les 4 bits).</p>`,
      items: [Bw('\\text{Somme binaire}', bin(x + y, 8)), Bw(`+${pos}\\text{ (4 bits C2)}`, bin(pos, 4), true, '4 bits'), Bw(`${neg}\\text{ (4 bits C2)}`, c2Neg, true, '4 bits')],

    items: [Nn('\\text{Valeur décimale}', -absV), Bw('\\text{Différence binaire}', bin(subA - subB))],

/* ---------- 3. boole : Portes logiques, algèbre de Boole et De Morgan ---------- */
const BOOLE_SIMP = [
  { expr: 'a + \\bar{a}\\cdot b', ans: 'a + b', bad: ['a\\cdot b', 'a', '\\bar{a} + b'], why: 'Règle d\'absorption fondamentale du cours : \\(a + \\bar{a}b = (a + \\bar{a})(a + b) = a + b\\).' },
  { expr: 'a + a\\cdot b + b\\cdot c', ans: 'a + b\\cdot c', bad: ['a + b + c', 'a\\cdot b\\cdot c', 'a + b'], why: 'Par absorption \\(a + ab = a(1+b) = a\\), il reste \\(a + bc\\).' },
  { expr: '\\overline{a + b}\\cdot\\overline{\\bar{a} + \\bar{b}}', ans: '0', bad: ['1', 'a\\oplus b', '\\overline{a\\oplus b}'], why: 'Par De Morgan : \\((\\bar{a}\\cdot\\bar{b})\\cdot(a\\cdot b) = (a\\bar{a})(b\\bar{b}) = 0\\) (Quizz Boole Q1).' },
  { expr: '(a + b)\\cdot(a + \\bar{b})', ans: 'a', bad: ['b', 'a + b', '1'], why: 'En distribuant : \\(a + (b\\cdot\\bar{b}) = a + 0 = a\\).' },
  { expr: 'a\\cdot b + a\\cdot\\bar{b} + \\bar{a}\\cdot b', ans: 'a + b', bad: ['a\\oplus b', 'a\\cdot b', '1'], why: '\\(ab + a\\bar{b} = a(b+\\bar{b}) = a\\), puis \\(a + \\bar{a}b = a + b\\).' },
  { expr: '\\overline{\\bar{a}\\cdot b + a\\cdot\\bar{b}}', ans: '\\bar{a}\\cdot\\bar{b} + a\\cdot b', bad: ['a + b', '\\bar{a} + \\bar{b}', 'a\\oplus b'], why: 'Le complément du OU exclusif \\(\\overline{a\\oplus b}\\) est la fonction <b>coïncidence</b> (XNOR) : \\(\\bar{a}\\bar{b} + ab\\).' }
];
GEN.boole = (d, g) => {
  const S = g.pick(BOOLE_SIMP);
  const opts = g.shuffle([['ok', `\\(${S.ans}\\)`], ...S.bad.map((b, i) => ['x' + i, `\\(${b}\\)`])]);
  if (d === 0) {
    const gate = g.pick([
      ['&', 'porte ET (AND)', ['porte OU (OR)', 'porte XOR (OU exclusif)', 'inverseur (NON)']],
      ['>=1', 'porte OU (OR)', ['porte ET (AND)', 'porte XOR (OU exclusif)', 'porte NAND']],
      ['=1', 'porte OU exclusif (XOR)', ['porte OU (OR)', 'porte ET (AND)', 'porte NOR']]
    ]);
    return {
      title: 'Symboles européens et simplification de Boole',
      q: `<p>1) En représentation rectangulaire (norme européenne/IEEE du cours), quelle porte est désignée par le symbole <code>${gate[0]}</code> (sans bulle en sortie) ?</p><p>2) Simplifier l'expression booléenne \\(F = ${S.expr}\\).</p>`,
      items: [
        Ch('Symbole <code>' + gate[0] + '</code>', g.shuffle([['ok', gate[1]], ...gate[2].map((t, i) => ['b' + i, t])]), 'ok'),
        Ch('Expression simplifiée de \\(F\\)', opts, 'ok')
      ],
      corr: `<p>1) Symbole <code>&amp;</code> = ET ; <code>&gt;=1</code> = OU ; <code>=1</code> = OU exclusif (XOR) ; <code>=1</code> avec sortie inversée = Coïncidence (XNOR).</p><p>2) \\(F = ${S.expr} = ${S.ans}\\). ${S.why}</p>`
    };
  }
  if (d === 1) {
    const dm = g.pick([
      { q: '\\overline{a\\cdot\\bar{b} + c}', ok: '(\\bar{a} + b)\\cdot\\bar{c}', bad: ['\\bar{a}\\cdot b + \\bar{c}', '(\\bar{a}\\cdot b)\\cdot\\bar{c}', 'a + \\bar{b} + \\bar{c}'] },
      { q: '\\overline{(a + \\bar{b})\\cdot\\bar{c}}', ok: '\\bar{a}\\cdot b + c', bad: ['(\\bar{a} + b) + c', '\\bar{a} + b + c', 'a\\cdot\\bar{b}\\cdot c'] }
    ]);
    return {
      title: 'Théorèmes de De Morgan et absorption',
      q: `<p>1) Appliquer les théorèmes de De Morgan à \\(G = ${dm.q}\\).</p><p>2) Simplifier \\(F = ${S.expr}\\).</p>`,
      items: [
        Ch('\\(G =\\)', g.shuffle([['ok', `\\(${dm.ok}\\)`], ...dm.bad.map((b, i) => ['b' + i, `\\(${b}\\)`])]), 'ok'),
        Ch('\\(F =\\)', opts, 'ok')
      ],
      corr: `<p>1) De Morgan : on coupe la barre principale en changeant \\(+\\) en \\(\\cdot\\) (et \\(\\cdot\\) en \\(+\\)), puis \\(\\overline{\\bar{x}} = x\\) : \\(G = ${dm.ok}\\).</p><p>2) \\(F = ${S.ans}\\). ${S.why}</p>`
    };
  }
  const nandQ = g.pick([
    { f: 'a\\cdot b + c', ok: '\\overline{\\overline{a\\cdot b}\\cdot\\bar{c}}', bad: ['\\overline{a\\cdot b} + \\bar{c}', '\\overline{\\overline{a+b}\\cdot\\bar{c}}', '\\overline{a\\cdot b\\cdot c}'] },
    { f: '(a + b)\\cdot c', ok: '\\overline{\\overline{\\overline{\\bar{a}\\cdot\\bar{b}}\\cdot c}}', bad: ['\\overline{(a+b)\\cdot c}', '\\overline{\\bar{a}\\cdot\\bar{b}\\cdot c}', '\\overline{a\\cdot c} + \\overline{b\\cdot c}'] }
  ]);
  return {
    title: 'Universalité des portes NAND et NOR (Quizz Boole)',
    q: `<p>1) Par double négation \\(F = \\overline{\\overline{F}}\\) et théorème de De Morgan, quelle écriture permet de réaliser \\(F = ${nandQ.f}\\) uniquement avec des portes <b>NAND</b> ?</p><p>2) Simplifier \\(H = ${S.expr}\\).</p>`,
    items: [
      Ch('Écriture tout-NAND', g.shuffle([['ok', `\\(${nandQ.ok}\\)`], ...nandQ.bad.map((b, i) => ['b' + i, `\\(${b}\\)`])]), 'ok'),
      Ch('\\(H =\\)', opts, 'ok')
    ],
    corr: `<p>1) On écrit \\(F = \\overline{\\overline{F}}\\) et on transforme chaque somme \\(X + Y\\) en \\(\\overline{\\bar{X}\\cdot\\bar{Y}}\\) pour n'avoir que des barres sur des produits (opérations NAND) : \\(F = ${nandQ.ok}\\).</p><p>2) \\(H = ${S.ans}\\). ${S.why}</p>`
  };
};

/* ---------- 4. canon : Formes canoniques (SDP, PDS) et liste de poids ---------- */
const sdpTerm3 = i => ((i & 4) ? 'a' : '\\bar{a}') + ((i & 2) ? 'b' : '\\bar{b}') + ((i & 1) ? 'c' : '\\bar{c}');
const pdsTerm3 = i => '(' + ((i & 4) ? '\\bar{a}' : 'a') + ' + ' + ((i & 2) ? '\\bar{b}' : 'b') + ' + ' + ((i & 1) ? '\\bar{c}' : 'c') + ')';
GEN.canon = (d, g) => {
  if (d === 0) {
    const ones = g.shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 3).sort((a, b) => a - b);
    const goodSDP = ones.map(sdpTerm3).join(' + ');
    const bad1 = ones.map(i => sdpTerm3(7 - i)).join(' + ');
    const bad2 = ones.map(pdsTerm3).join('\\cdot ');
    return {
      title: 'Forme canonique Somme de Produits (SDP) et liste de poids',
      q: `<p>Une fonction \\(F(a,b,c)\\) (avec \\(a\\) bit de poids fort et \\(c\\) bit de poids faible) vaut <code>1</code> uniquement pour les combinaisons décimales \\((${ones.join(', ')})\\). Quelle est sa forme canonique Somme de Produits (SDP), et combien de lignes de la table de vérité valent <code>0</code> ?</p>`,
      items: [
        Ch('Forme canonique SDP', g.shuffle([['ok', `\\(${goodSDP}\\)`], ['b1', `\\(${bad1}\\)`], ['b2', `\\(${bad2}\\)`]]), 'ok'),
        Nn('\\text{Nombre de lignes où } F = 0', 8 - ones.length)
      ],
      corr: `<p>Dans la forme canonique SDP, on écrit un produit de toutes les variables pour chaque ligne où \\(F = 1\\) (variable directe si le bit vaut 1, complémentée s'il vaut 0) : \\(${ones.map(i => `${i} = ${bin(i, 3)}_2 \\to ${sdpTerm3(i)}`).join('\\), \\(')}\\), soit \\(F = ${goodSDP}\\).</p><p>Sur \\(2^3 = 8\\) lignes, \\(8 - 3 = 5\\) lignes valent 0.</p>`
    };
  }
  if (d === 1) {
    const zeros = g.shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 2).sort((a, b) => a - b);
    const goodPDS = zeros.map(pdsTerm3).join('\\cdot ');
    const bad1 = zeros.map(i => pdsTerm3(7 - i)).join('\\cdot ');
    const bad2 = zeros.map(sdpTerm3).join(' + ');
    return {
      title: 'Forme canonique Produit de Sommes (PDS)',
      q: `<p>Une fonction \\(F(a,b,c)\\) vaut <code>0</code> uniquement pour les lignes décimales \\(${zeros[0]}\\) (\\(${bin(zeros[0], 3)}_2\\)) et \\(${zeros[1]}\\) (\\(${bin(zeros[1], 3)}_2\\)), et vaut <code>1</code> partout ailleurs. Donner sa forme canonique <b>Produit de Sommes (PDS)</b>.</p>`,
      items: [
        Ch('Forme canonique PDS', g.shuffle([['ok', `\\(${goodPDS}\\)`], ['b1', `\\(${bad1}\\)`], ['b2', `\\(${bad2}\\)`]]), 'ok'),
        Nn('\\text{Nombre de termes de la SDP}', 6)
      ],
      corr: `<p>Pour la forme canonique PDS, on retient les lignes où <b>\\(F = 0\\)</b> et on écrit une somme qui s'annule sur la ligne (variable directe si son bit vaut <code>0</code>, barrée si son bit vaut <code>1</code>) : \\(${zeros[0]} = ${bin(zeros[0], 3)}_2 \\to ${pdsTerm3(zeros[0])}\\) et \\(${zeros[1]} = ${bin(zeros[1], 3)}_2 \\to ${pdsTerm3(zeros[1])}\\), d'où \\(F = ${goodPDS}\\).</p>`
    };
  }
  const cases = [
    { expr: 'a\\bar{b} + abc', list: [4, 5, 7], sdp: 'a\\bar{b}\\bar{c} + a\\bar{b}c + abc', step: '\\(a\\bar{b} = a\\bar{b}(c + \\bar{c}) = a\\bar{b}c + a\\bar{b}\\bar{c}\\) (poids 5 et 4), plus \\(abc\\) (poids 7).' },
    { expr: '\\bar{a}c + ab\\bar{c}', list: [1, 3, 6], sdp: '\\bar{a}\\bar{b}c + \\bar{a}bc + ab\\bar{c}', step: '\\(\\bar{a}c = \\bar{a}(b + \\bar{b})c = \\bar{a}bc + \\bar{a}\\bar{b}c\\) (poids 3 et 1), plus \\(ab\\bar{c}\\) (poids 6).' },
    { expr: 'bc + \\bar{a}\\bar{b}c', list: [1, 3, 7], sdp: '\\bar{a}\\bar{b}c + \\bar{a}bc + abc', step: '\\(bc = (a + \\bar{a})bc = abc + \\bar{a}bc\\) (poids 7 et 3), plus \\(\\bar{a}\\bar{b}c\\) (poids 1).' }
  ];
  const C = g.pick(cases);
  return {
    title: 'Mise sous forme canonique et liste de nombres (Quizz Chap A3)',
    q: `<p>On considère \\(F(a,b,c) = ${C.expr}\\) (avec \\(a\\) poids 4, \\(b\\) poids 2, \\(c\\) poids 1). Compléter les termes incomplets pour obtenir la forme canonique SDP et donner les 3 nombres de la liste de poids par ordre croissant.</p>`,
    items: [Nn('\\text{1er poids}', C.list[0]), Nn('\\text{2e poids}', C.list[1]), Nn('\\text{3e poids}', C.list[2])],
    corr: `<p>On complète chaque terme où il manque une variable \\(x\\) en le multipliant par \\((x + \\bar{x}) = 1\\) : ${C.step}</p><p>Forme canonique SDP : \\(F = ${C.sdp}\\), soit la liste de nombres \\((${C.list.join(', ')})\\).</p>`
  };
};

        ['lsb', 'sur le comparateur des 4 bits de poids faible'],

      ], 'msb')
    ],
    corr: `<p>1) Pour \\(x = 1, y = 0\\), l'adresse vaut \\(BA = 10_2 = 2\\) : le MUX sélectionne \\(E_2 = ${E4[2]}\\). Avec \\(z = 1\\), on obtient \\(F = ${E4[2] === '1' || E4[2] === 'z' ? 1 : 0}\\).</p>
      <p>2) Sur le 7485, le boîtier des bits de poids faible (\\(A_3..A_0\\)) a ses entrées d'expansion fixées à \\((A=B) = 1\\), et ses sorties sont envoyées vers les entrées d'expansion du boîtier des <b>bits de poids fort</b> (\\(A_7..A_4\\)), qui délivre le résultat final.</p>`

};

/* ---------- 7. basc : Bascules RS, D et JK, entrées RAU/RAZ ---------- */
GEN.basc = (d, g) => {
  if (d === 0) {
    const fH = g.pick([8, 16, 24, 32, 40, 64]);
    return {
      title: 'Équations caractéristiques des bascules D et JK',
      q: `<p>1) Quelle est l'équation caractéristique d'une bascule JK synchrone ?</p><p>2) On câble une bascule D en diviseur de fréquence par 2 (\\(D = \\bar{Q}\\)) avec une horloge \\(F_H = ${fH}\\ \\mathrm{kHz}\\). Quelle est la fréquence du signal \\(Q\\) ?</p>`,
      items: [
        Ch('Bascule JK : \\(Q_{n+1} =\\)', g.shuffle([
          ['ok', '\\(J_n\\cdot\\overline{Q_n} + \\overline{K_n}\\cdot Q_n\\)'],
          ['b1', '\\(J_n\\cdot Q_n + \\overline{K_n}\\cdot\\overline{Q_n}\\)'],
          ['b2', '\\(\\overline{J_n}\\cdot\\overline{Q_n} + K_n\\cdot Q_n\\)'],
          ['b3', '\\(J_n \\oplus K_n \\oplus Q_n\\)']
        ]), 'ok'),
        Nn('F_Q', fH / 2, 'kHz')
      ],
      corr: `<p>1) Équation caractéristique de la bascule JK (démontrée par Karnaugh en CM Chap B1) : \\(Q_{n+1} = J_n\\overline{Q_n} + \\overline{K_n}Q_n\\).</p><p>2) Avec \\(D = \\bar{Q}\\), la bascule change d'état à chaque front actif d'horloge : \\(F_Q = F_H / 2 = ${fH / 2}\\ \\mathrm{kHz}\\).</p>`
    };
  }
  if (d === 1) {
    const q0 = g.int(0, 1);
    const seq = [[1, 0], [0, 0], [1, 1], [0, 1]];
    let q = q0;
    const states = seq.map(([j, k]) => { q = j === 0 && k === 0 ? q : j === 0 && k === 1 ? 0 : j === 1 && k === 0 ? 1 : 1 - q; return q; });
    return {
      title: 'Chronogramme d\'une bascule JK sur 4 fronts d\'horloge',
      q: `<p>Une bascule JK déclenchée sur front montant part de l'état initial \\(Q_0 = ${q0}\\) (entrées asynchrones inactives). Aux 4 fronts montants successifs de \\(H\\), les entrées \\((J, K)\\) valent : front 1 : \\((1,0)\\) ; front 2 : \\((0,0)\\) ; front 3 : \\((1,1)\\) ; front 4 : \\((0,1)\\). Écrire la suite des 4 états pris par \\(Q\\) (sous forme d'un mot de 4 bits, ex : <code>1100</code>).</p>`,
      items: [Bw('Q_1Q_2Q_3Q_4', states.join(''), true, '4 bits')],
      corr: `<p>Front 1 \\((J=1, K=0)\\) : mise à 1 \\(\\to Q_1 = 1\\). Front 2 \\((J=0, K=0)\\) : mémoire \\(\\to Q_2 = 1\\). Front 3 \\((J=1, K=1)\\) : basculement \\(\\to Q_3 = 0\\). Front 4 \\((J=0, K=1)\\) : mise à 0 \\(\\to Q_4 = 0\\). Suite : <code>${states.join('')}</code>.</p>`
    };
  }
  return {
    title: 'Entrées asynchrones prioritaires RAU et RAZ (TD Chap B1 Ex 2)',
    q: `<p>Une bascule JK possède deux entrées asynchrones actives au niveau <b>bas</b> : \\(\\overline{\\text{RAU}}\\) (Preset) et \\(\\overline{\\text{RAZ}}\\) (Clear).</p><p>1) Quel couple \\((\\overline{\\text{RAU}}, \\overline{\\text{RAZ}})\\) autorise le fonctionnement synchrone normal piloté par l'horloge \\(H\\) ?</p><p>2) Entre deux fronts d'horloge, \\(\\overline{\\text{RAU}}\\) passe à <code>0</code> (avec \\(\\overline{\\text{RAZ}} = 1\\)). Que fait la sortie \\(Q\\) ?</p>`,
    items: [
      Bw('\\overline{\\text{RAU}}\\,\\overline{\\text{RAZ}}\\text{ (mode normal)}', '11', true, '2 bits'),
      Ch('Effet de \\(\\overline{\\text{RAU}} = 0\\)', [
        ['imm', 'elle passe immédiatement à 1, sans attendre le prochain front d\'horloge'],
        ['wait', 'elle attend le prochain front actif de H pour passer à 1'],
        ['zero', 'elle passe immédiatement à 0']
      ], 'imm')
    ],
    corr: `<p>1) Comme \\(\\overline{\\text{RAU}}\\) et \\(\\overline{\\text{RAZ}}\\) sont actives au niveau <b>bas (0)</b>, elles doivent toutes les deux valoir <b><code>1</code></b> (<code>11</code>) pour être inactives et laisser l'horloge \\(H\\) commander la bascule.</p><p>2) Les entrées asynchrones sont <b>prioritaires sur l'horloge</b> : dès que \\(\\overline{\\text{RAU}} = 0\\), \\(Q\\) est forcée à <code>1</code> instantanément.</p>`
  };
};

/* ---------- 8. cpta : Compteurs asynchrones et modulo ---------- */
GEN.cpta = (d, g) => {
  if (d === 0) {
    const edge = g.pick(['up', 'down']), wire = g.pick(['Q', 'nQ']);
    const isUp = (edge === 'down' && wire === 'Q') || (edge === 'up' && wire === 'nQ');
    const n = g.pick([3, 4]);
    return {
      title: 'Sens de comptage et modulo d\'un compteur asynchrone',
      q: `<p>Un montage asynchrone est formé de \\(${n}\\) bascules JK (\\(J=K=1\\)) déclenchées sur <b>front ${edge === 'up' ? 'montant (\\(\\uparrow\\))' : 'descendant (\\(\\downarrow\\))'}</b>. L'entrée d'horloge de chaque bascule \\(B_{i+1}\\) est reliée à la sortie <b>\\(${wire === 'Q' ? 'Q_i' : '\\overline{Q_i}'}\\)</b> de la bascule précédente.</p>`,
      items: [
        Ch('Ce montage est un', [['up', 'compteur croissant'], ['down', 'décompteur (décroissant)']], isUp ? 'up' : 'down'),
        Nn('\\text{Modulo du montage}', 1 << n)
      ],
      corr: `<p>Pour compter en croissant, \\(B_{i+1}\\) doit basculer quand \\(Q_i\\) passe de \\(1\\) à \\(0\\) (front descendant de \\(Q_i\\), qui correspond au front montant de \\(\\overline{Q_i}\\)). Ici (front ${edge === 'up' ? '\\(\\uparrow\\)' : '\\(\\downarrow\\)'} sur \\(${wire === 'Q' ? 'Q_i' : '\\overline{Q_i}'}\\)), c'est donc un <b>${isUp ? 'compteur croissant' : 'décompteur'}</b> de modulo \\(2^${n} = ${1 << n}\\).</p>`
    };
  }
  if (d === 1) {
    const mod = g.pick([5, 6, 10, 12]), nB = mod <= 8 ? 3 : 4, code = bin(mod, nB);
    return {
      title: 'Compteur asynchrone modulo N par remise à zéro (TD Chap B2 Ex 2)',
      q: `<p>On veut concevoir un compteur asynchrone croissant <b>modulo ${mod}</b> (comptant de \\(0\\) à \\(${mod - 1}\\)).</p><p>1) Combien de bascules \\(n\\) faut-il au minimum ?</p><p>2) Quel état binaire transitoire \\(Q_{${nB - 1}}\\dots Q_0\\) (sur ${nB} bits) doit déclencher la remise à zéro asynchrone <code>RAZ</code> de toutes les bascules ?</p>`,
      items: [Nn('n\\text{ (bascules)}', nB), Bw('\\text{État déclenchant RAZ}', code, true, nB + ' bits')],
      corr: `<p>1) \\(2^{${nB - 1}} = ${1 << (nB - 1)} < ${mod} \\le 2^{${nB}} = ${1 << nB}\\), il faut <b>${nB} bascules</b>.</p>
        <p>2) Le compteur parcourt les ${mod} états \\(0, 1, \\dots, ${mod - 1}\\). Dès qu'il passe à l'état transitoire <b>${mod} (\\(${code}_2\\))</b>, une porte logique détecte les bits à 1 de \\(${code}_2\\) et active immédiatement <code>RAZ</code> pour ramener le compteur à <code>${'0'.repeat(nB)}</code>.</p>`
    };
  }
  const nB = g.pick([3, 4]), tp = g.pick([10, 20, 25, 50]), totTp = nB * tp, fMax = 1000 / totTp;
  return {
    title: 'Retard de propagation cumulé et fréquence maximale',
    q: `<p>Un compteur asynchrone à \\(${nB}\\) bascules utilise des bascules dont le temps de propagation est \\(t_p = ${tp}\\ \\mathrm{ns}\\). Calculer le retard maximal d'établissement d'un état stable après le front de \\(H\\), et en déduire la fréquence maximale d'horloge \\(f_{max}\\).</p>`,
    items: [Nn('\\text{Retard total}', totTp, 'ns'), Nn('f_{max}', fMax, 'MHz')],
    corr: `<p>Dans un compteur asynchrone, les bascules commutent les unes après les autres : la \\(${nB}\\)<sup>e</sup> bascule commute après \\(${nB}\\times t_p = ${totTp}\\ \\mathrm{ns}\\).</p><p>Il faut que la période d'horloge vérifie \\(T_H \\ge ${totTp}\\ \\mathrm{ns}\\), soit \\(f_{max} = \\dfrac{1}{${totTp}\\cdot 10^{-9}} = ${nfmt(fMax)}\\ \\mathrm{MHz}\\).</p>`
  };
};

/* ---------- 9. cpts : Synthèse de compteurs synchrones (D et JK) ---------- */
const JK_ID_BANK = [
  { eq: 'Q_1^+ = \\overline{Q_2}\\,Q_0\\,\\overline{Q_1} + \\overline{Q_0}\\,Q_1', q: 'Q_1', j: '\\overline{Q_2}\\cdot Q_0', k: 'Q_0', bad: [['Q_0', '\\overline{Q_2}\\cdot Q_0'], ['\\overline{Q_2}\\cdot Q_0', '\\overline{Q_0}'], ['\\overline{Q_2}', 'Q_0']], why: 'Devant \\(\\overline{Q_1}\\) on identifie \\(J_1 = \\overline{Q_2}Q_0\\) ; devant \\(Q_1\\) on identifie \\(\\overline{K_1} = \\overline{Q_0} \\iff K_1 = Q_0\\) (compteur modulo 6 du TD).' },
  { eq: 'Q_2^+ = (Q_1\\cdot Q_0)\\,\\overline{Q_2} + (\\overline{Q_1} + \\overline{Q_0})\\,Q_2', q: 'Q_2', j: 'Q_1\\cdot Q_0', k: 'Q_1\\cdot Q_0', bad: [['Q_1\\cdot Q_0', '\\overline{Q_1} + \\overline{Q_0}'], ['Q_1 + Q_0', 'Q_1\\cdot Q_0'], ['1', 'Q_1\\cdot Q_0']], why: 'Devant \\(\\overline{Q_2}\\) : \\(J_2 = Q_1Q_0\\). Devant \\(Q_2\\) : \\(\\overline{K_2} = \\overline{Q_1} + \\overline{Q_0} = \\overline{Q_1Q_0}\\), donc par De Morgan \\(K_2 = Q_1Q_0\\) (compteur binaire 3 bits du CM).' },
  { eq: 'Q_2^+ = Q_1\\,Q_0\\,\\overline{Q_2} + \\overline{Q_0}\\,Q_2', q: 'Q_2', j: 'Q_1\\cdot Q_0', k: 'Q_0', bad: [['Q_1\\cdot Q_0', '\\overline{Q_0}'], ['Q_0', 'Q_1\\cdot Q_0'], ['Q_1', 'Q_0']], why: 'Par identification avec \\(J_2\\overline{Q_2} + \\overline{K_2}Q_2\\) : \\(J_2 = Q_1Q_0\\) et \\(\\overline{K_2} = \\overline{Q_0} \\iff K_2 = Q_0\\).' },
  { eq: 'Q_3^+ = (Q_2\\cdot Q_1\\cdot Q_0)\\,\\overline{Q_3} + \\overline{Q_0}\\,Q_3', q: 'Q_3', j: 'Q_2\\cdot Q_1\\cdot Q_0', k: 'Q_0', bad: [['Q_2\\cdot Q_1\\cdot Q_0', '\\overline{Q_0}'], ['Q_0', 'Q_2\\cdot Q_1\\cdot Q_0'], ['Q_2\\cdot Q_1', 'Q_0']], why: 'Compteur synchrone BCD modulo 10 (TD Chap B2 Ex 4) : \\(J_3 = Q_2Q_1Q_0\\) et \\(\\overline{K_3} = \\overline{Q_0} \\iff K_3 = Q_0\\).' }
];
GEN.cpts = (d, g) => {
  if (d === 0) {
    return {
      title: 'Synthèse d\'un compteur synchrone 3 bits avec des bascules D (CM Chap B2)',
      q: `<p>Dans un compteur synchrone binaire 3 bits \\((Q_2, Q_1, Q_0)\\) réalisé avec des bascules D (\\(D_i = Q_i^+\\)), on a \\(D_0 = \\overline{Q_0}\\) et \\(D_1 = Q_1 \\oplus Q_0\\). Quelle est l'expression de \\(D_2\\) obtenue après factorisation par un OU exclusif ?</p>`,
      items: [
        Ch('\\(D_2 = Q_2^+ =\\)', g.shuffle([
          ['ok', '\\(Q_2 \\oplus (Q_1\\cdot Q_0)\\)'],
          ['b1', '\\(Q_2 \\oplus Q_1 \\oplus Q_0\\)'],
          ['b2', '\\(Q_2 \\cdot (Q_1 \\oplus Q_0)\\)'],
          ['b3', '\\(\\overline{Q_2}\\cdot Q_1\\cdot Q_0\\)']
        ]), 'ok')
      ],
      corr: `<p>Le bit \\(Q_2\\) ne s'inverse que lorsque \\(Q_1\\) et \\(Q_0\\) valent tous les deux 1 : \\(Q_2^+ = Q_2\\overline{(Q_1Q_0)} + \\overline{Q_2}(Q_1Q_0) = Q_2 \\oplus (Q_1\\cdot Q_0)\\).</p>`
    };
  }
  const M = g.pick(JK_ID_BANK);
  const opts = g.shuffle([
    ['ok', `\\(J = ${M.j}\\) et \\(K = ${M.k}\\)`],
    ...M.bad.map(([j, k], i) => ['b' + i, `\\(J = ${j}\\) et \\(K = ${k}\\)`])
  ]);
  if (d === 1) {
    return {
      title: 'Synthèse en bascules JK par identification algébrique',
      q: `<p>Après simplification par tableau de Karnaugh, l'état suivant de la bascule \\(${M.q}\\) s'écrit :</p>\\[${M.eq}\\]<p>Par identification avec l'équation caractéristique \\(Q^+ = J\\,\\overline{Q} + \\overline{K}\\,Q\\), déterminer les entrées \\(J\\) et \\(K\\) de cette bascule.</p>`,
      items: [Ch('Entrées \\(J\\) et \\(K\\)', opts, 'ok')],
      corr: `<p>${M.why}</p>`
    };
  }
  const stIn = g.pick([6, 7]);
  const q2 = (stIn >> 2) & 1, q1 = (stIn >> 1) & 1, q0 = stIn & 1;
  // Équations du compteur modulo 6 du TD Ex 3 : Q0+ = /Q0, Q1+ = /Q2 Q0 /Q1 + /Q0 Q1, Q2+ = Q1 Q0 /Q2 + /Q0 Q2
  const nq0 = 1 - q0, nq1 = ((!q2 && q0 && !q1) || (!q0 && q1)) ? 1 : 0, nq2 = ((q1 && q0 && !q2) || (!q0 && q2)) ? 1 : 0;
  const nextCode = `${nq2}${nq1}${nq0}`;

    title: 'États hors cycle et compteur intégré 74HC163',
    q: `<p>1) Un compteur synchrone modulo 6 a pour équations : \\(Q_0^+ = \\overline{Q_0}\\), \\(Q_1^+ = \\overline{Q_2}Q_0\\overline{Q_1} + \\overline{Q_0}Q_1\\) et \\(Q_2^+ = Q_1Q_0\\overline{Q_2} + \\overline{Q_0}Q_2\\). S'il se trouve à la mise sous tension dans l'état hors cycle <b>${stIn} (<code>${bin(stIn, 3)}</code>)</b>, quel est son état suivant \\(Q_2^+Q_1^+Q_0^+\\) (en binaire sur 3 bits) ?</p><p>2) Sur le compteur synchrone 4 bits <b>74HC163</b>, pour quelle valeur décimale du compteur la sortie de retenue <code>RCO</code> passe-t-elle à <code>1</code> ?</p>`,
    items: [Bw('Q_2^+Q_1^+Q_0^+', nextCode, true, '3 bits'), Nn('\\text{État où RCO} = 1', 15)],
    corr: `<p>1) Pour \\(Q_2Q_1Q_0 = ${bin(stIn, 3)}\\) : \\(Q_0^+ = \\overline{${q0}} = ${nq0}\\), \\(Q_1^+ = ${nq1}\\), \\(Q_2^+ = ${nq2}\\), soit l'état <b><code>${nextCode}</code> (${parseInt(nextCode, 2)})</b>.</p><p>2) Sur le 74HC163, la sortie <code>RCO</code> (*Ripple Carry Output*) passe à 1 lorsque le compteur atteint sa valeur maximale sur 4 bits : <b>15 (<code>1111</code>)</b>.</p>`
  };
};

/* ---------- 10. reg : Registres de stockage et à décalage ---------- */

          ['b1', '\\(ch\\cdot Q_i + \\overline{ch}\\cdot e_i\\)'],
          ['b2', '\\(ch \\oplus Q_i \\oplus e_i\\)'],
          ['b3', '\\(ch\\cdot e_i\\)']
        ]), 'ok')
      ],
      corr: `<p>Si \\(ch = 0\\), il faut \\(D_i = Q_i\\) (maintien de l'état présent) ; si \\(ch = 1\\), il faut \\(D_i = e_i\\) (chargement) : c'est un MUX 2 vers 1 d'équation \\(D_i = \\overline{ch}\\cdot Q_i + ch\\cdot e_i\\).</p>`

      items: [Bw('q_3q_2q_1q_0', out, true, '4 bits')],
      corr: `<p>En décalage à ${dir} (${dir === 'droite' ? '<code>q3q2q1q0 := R q3q2q1</code>' : '<code>q3q2q1q0 := q2q1q0 L</code>'}), le bit série <code>${ser}</code> entre du côté ${dir === 'droite' ? 'gauche (\\(q_3\\))' : 'droit (\\(q_0\\))'} et les autres bits se décalent d'un rang : <b><code>${out}</code></b>.</p>`

    items: [Nn('\\text{Modulo}', nB), Nn('F_{Q_i}', fH / nB, 'kHz')],
    corr: `<p>Un seul <code>1</code> circule en boucle à travers les \\(${nB}\\) bascules : le registre décrit exactement <b>\\(${nB}\\) états distincts</b> (modulo \\(${nB}\\)), et chaque sortie \\(Q_i\\) passe à 1 une fois tous les \\(${nB}\\) coups d'horloge, soit \\(F_{Q_i} = F_H / ${nB} = ${fH / nB}\\ \\mathrm{kHz}\\).</p>`
  };
};

    items: [Nn('V_{max}', 15 * 0.125, 'V'), Nn('F_{e,\\min}', 2 * fMaxSig, 'kHz')],
    corr: `<p>1) Sur 4 bits, \\(N_{max} = 2^4 - 1 = 15\\), d'où \\(V_{max} = 15 \\times 0{,}125 = 1{,}875\\ \\mathrm{V}\\) (TD Chap C1 Ex 1 Q5).</p><p>2) Critère de Shannon : \\(F_e > 2\\,f_{max} = ${2 * fMaxSig}\\ \\mathrm{kHz}\\).</p>`

/* ---------- 12. cnacan : Convertisseurs CNA et CAN ---------- */
GEN.cnacan = (d, g) => {
  if (d === 0) {
    const nB = g.pick([5, 6, 8]), nMax = (1 << nB) - 1, K = g.pick([0.1, 0.2, 0.5]);
    const n1 = g.int(8, nMax - 5), n2 = g.int(n1 + 2, nMax);
    return {
      title: 'CNA : facteur de proportionnalité K et pleine échelle (TD Chap C2 Ex 1–3)',
      q: `<p>Un CNA de \\(${nB}\\) bits fournit une tension de sortie \\(V_S = ${nfmt(K * n1)}\\ \\mathrm{V}\\) lorsque l'entrée numérique est <code>${bin(n1, nB)}</code>.</p><p>1) Calculer le facteur de proportionnalité (pas de progression) \\(K\\).</p><p>2) Calculer \\(V_S\\) pour l'entrée <code>${bin(n2, nB)}</code>, puis la tension maximale (pleine échelle) \\(V_{max}\\) du CNA.</p>`,
      items: [Nn('K', K, 'V'), Nn('V_S', K * n2, 'V'), Nn('V_{max}', K * nMax, 'V')],
      corr: `<p>1) \\(${bin(n1, nB)}_2 = ${n1}_{10}\\), donc \\(K = \\dfrac{V_S}{N} = \\dfrac{${nfmt(K * n1)}}{${n1}} = ${nfmt(K)}\\ \\mathrm{V}\\).</p>
        <p>2) Pour \\(${bin(n2, nB)}_2 = ${n2}_{10}\\), \\(V_S = K\\times ${n2} = ${nfmt(K * n2)}\\ \\mathrm{V}\\). La tension maximale est atteinte quand tous les bits valent 1 (\\(N_{max} = 2^{${nB}} - 1 = ${nMax}\\)) : \\(V_{max} = ${nMax}\\times ${nfmt(K)} = ${nfmt(K * nMax)}\\ \\mathrm{V}\\).</p>`
    };
  }
  if (d === 1) {
    const vref = g.pick([4, 8, 10]), ratio = g.pick([1, 2]), b4 = g.int(3, 15);
    // CNA 4 bits pondéré : Vs = -(Rs * Vref / (8R)) * N ; avec Rs/R = ratio / 2 => pas = -(ratio * vref / 16)
    const step = (ratio * vref) / 8, vs = -step * b4;
    return {
      title: 'CNA 4 bits à résistances pondérées et réseau R–2R (TD Chap C2 Ex 5)',
      q: `<p>1) Un CNA 4 bits à résistances pondérées (\\(R, 2R, 4R, 8R\\)) utilise un AOP idéal (contre-réaction \\(R_S = ${ratio === 1 ? 'R' : '2R'}\\)) et une tension \\(V_{ref} = ${vref}\\ \\mathrm{V}\\), d'où \\(V_S = -\\dfrac{R_S\\,V_{ref}}{8R}\\,N\\). Calculer la tension de sortie \\(V_S\\) pour l'entrée binaire \\(b_3b_2b_1b_0 = ${bin(b4, 4)}_2\\).</p><p>2) Pour un CNA 4 bits à <b>réseau R–2R</b>, par quel coefficient est divisé \\(R_S V_{ref}\\,N\\) dans la formule \\(V_S = -\\dfrac{R_S V_{ref}}{\\dots}\\,N\\) ?</p>`,
      items: [Nn('V_S', vs, 'V'), Ch('Dénominateur du CNA R–2R 4 bits', [['32R', '\\(32R\\)'], ['8R', '\\(8R\\)'], ['16R', '\\(16R\\)']], '32R')],
      corr: `<p>1) Ici \\(${bin(b4, 4)}_2 = ${b4}_{10}\\) et \\(\\dfrac{R_S V_{ref}}{8R} = \\dfrac{${ratio}\\times ${vref}}{8} = ${nfmt(step)}\\ \\mathrm{V}\\), donc \\(V_S = -${nfmt(step)}\\times ${b4} = ${nfmt(vs)}\\ \\mathrm{V}\\).</p>
        <p>2) Dans le réseau R–2R 4 bits du cours, les tensions aux nœuds valent \\(V_{ref}/2, V_{ref}/4, V_{ref}/8, V_{ref}/16\\) à travers des branches \\(2R\\) : \\(I_S = \\dfrac{V_{ref}}{32R}N\\) et \\(V_S = -\\dfrac{R_S V_{ref}}{32R}N\\).</p>`
    };
  }
  const nB = g.pick([8, 10]), fH = g.pick([1, 2]), T = 1 / fH; // en µs
  const N = g.int(80, 240);
  return {
    title: 'CAN simple rampe vs CAN à approximations successives (CAS)',
    q: `<p>On compare un <b>CAN simple rampe</b> et un <b>CAN à approximations successives (CAS)</b> de \\(n = ${nB}\\) bits, cadencés par la même horloge \\(F_H = ${fH}\\ \\mathrm{MHz}\\) (période \\(T = ${nfmt(T)}\\ \\mathrm{\\mu s}\\)).</p><p>1) Pour une tension d'entrée qui conduit au code décimal \\(N = ${N}\\), calculer la durée de conversion \\(t_{\\text{rampe}}\\) du CAN simple rampe et la durée de conversion \\(t_{\\text{CAS}}\\) du CAS.</p><p>2) En fin de conversion, quelle inégalité relie \\(V_{Ax}\\) (sortie du CNA interne) et \\(V_A\\) (tension à convertir) dans un CAS ?</p>`,
    items: [
      Nn('t_{\\text{rampe}}', N * T, 'µs'),
      Nn('t_{\\text{CAS}}', nB * T, 'µs'),
      Ch('En fin de conversion d\'un CAS', [['le', '\\(V_{Ax} \\le V_A\\) (conversion par valeur par défaut)'], ['gt', '\\(V_{Ax} > V_A\\) (conversion par valeur par excès)']], 'le')
    ],
    corr: `<p>1) Le CAN simple rampe compte pas à pas de \\(0\\) à \\(N\\) : \\(t_{\\text{rampe}} = N\\times T = ${N}\\times ${nfmt(T)} = ${nfmt(N * T)}\\ \\mathrm{\\mu s}\\). Le CAS procède par dichotomie du MSB au LSB en exactement \\(n\\) périodes : \\(t_{\\text{CAS}} = n\\times T = ${nB}\\times ${nfmt(T)} = ${nfmt(nB * T)}\\ \\mathrm{\\mu s}\\).</p>
      <p>2) Dans un CAS, chaque bit qui fait dépasser \\(V_A\\) (\\(V_{Ax} > V_A\\)) est immédiatement remis à 0 : en fin de conversion on a toujours <b>\\(V_{Ax} \\le V_A\\)</b> (alors que le CAN simple rampe s'arrête dès que \\(V_{Ax} > V_A\\)).</p>`
  };
};

function check(it, raw) {
  raw = raw == null ? '' : String(raw);
  if (it.type === 'choice') return raw ? { st: raw === it.ans ? 'ok' : 'bad' } : { st: 'empty' };
  if (it.type === 'bw') {
    const u = normWord(raw, it.fixed), a = normWord(it.ans, it.fixed);
    if (!u) return { st: 'empty' };
    if (it.fixed && u.length !== a.length && normWord(raw, false) === normWord(it.ans, false)) {
      return { st: 'bad', msg: `écris tous les ${a.length} chiffres (avec les zéros à gauche).` };
    }
    return { st: u === a ? 'ok' : 'bad' };
  }
  const q = parseNum(raw, it.unit);
  if (q.err !== undefined) return { st: q.err === '' ? 'empty' : 'err', msg: q.err };
  const tol = Math.max((it.tol || 0.015) * Math.abs(it.val), 1e-9);
  if (Math.abs(q.v - it.val) <= tol) return { st: 'ok' };
  if (Math.abs(q.v + it.val) <= tol) return { st: 'bad', msg: 'attention au signe (n\'oublie pas le signe − si l\'AOP est inverseur ou le nombre négatif).' };
  return { st: 'bad' };
}

  ['A3. Formes canoniques et tableaux de Karnaugh', 'Séquence A · Chap A3', `<p>Une forme canonique contient <b>toutes les variables</b> dans chaque terme :</p>

  ['B1. Les bascules synchrones (RS, D, JK) et entrées RAU / RAZ', 'Séquence B · Chap B1', `<p>Un système séquentiel possède un <b>effet mémoire</b> : l'état suivant \\(Q_{n+1}\\) (ou \\(Q^+\\)) dépend des entrées et de l'état présent \\(Q_n\\). Une bascule synchrone ne commute que sur le <b>front actif</b> de l'horloge \\(H\\) : front montant \\(\\uparrow\\) (triangle <code>&gt;</code>) ou front descendant \\(\\downarrow\\) (bulle + triangle <code>o&gt;</code>).</p>

function examExos(seed) { const g = G(rng(seed)); return examPlan(EXAM_PLAN).map(([title, parts, pts]) => ({ title, pts, parts: parts.map(([id, d]) => build(id, d, Math.floor(g.r() * 4294967296))) })); }
function vBlanc() {

  EXAM.exs = examExos(EXAM.seed);

    + EXAM.exs.map(ex => `<section class="card"><h2>${esc(ex.title)} <span class="fine">(${ex.pts} points)</span></h2>${ex.parts.map(p => `<div class="ex" style="margin-top:14px"><h3 style="font:600 17px/1.3 var(--serif)">${esc(p.title)}</h3><div class="q">${p.q}</div>${p.fig || ''}<div class="items">${p.items.map(it => itemHTML(it, it.id, EXAM.ans[it.id] || '')).join('')}</div>${EXAM.done ? `<details class="corr" open><summary>Correction</summary><div class="expl">${p.corr}</div></details>` : ''}</div>`).join('')}</section>`).join('')
    + (EXAM.done ? `<section class="card"><div class="row"><span class="score">${String(EXAM.note.toFixed(1)).replace('.', ',')}</span><span class="sub">/ 20</span><span class="sp"></span><button type="button" class="btn btn-primary" data-act="examNew">Nouveau sujet</button></div></section>`
      : `<section class="card"><div class="row" style="justify-content:center"><button type="button" class="btn btn-primary btn-lg" data-act="submit">Rendre la copie</button></div></section>`);

const saveExam = () => { const { exs, ...rest } = EXAM; ls.set(EK, rest); };
function submitExam(auto) {
  if (!EXAM || EXAM.done) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  stopTick();
  const exs = examExos(EXAM.seed); let note = 0; const fb = {};
  for (const ex of exs) {
    const its = [].concat(...ex.parts.map(p => p.items)); let got = 0;
    for (const it of its) { const r = check(it, EXAM.ans[it.id] || ''); fb[it.id] = fbHTML(r); got += tally(it, r.st === 'ok' ? 1 : 0); }
    note += ex.pts * got / its.length;
  }
  EXAM.done = true; EXAM.running = false; EXAM.note = note; EXAM.fb = fb;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(DUR, Math.round((Date.now() - EXAM.t0) / 1000)), ...examRecord() }); ls.set(HK, H);
  EXAM.closed = true; saveExam();
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}

});
