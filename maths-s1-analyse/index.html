<style>
:root{
  color-scheme:light;
  --paper:#f4f2ec; --sheet:#fffefb; --sheet-2:#f8f6f1;
  --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;

  --phys:#7c3aed; --phys-soft:#f0e9fe;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
    --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
    --rule:#2e2d2a; --rule-strong:#45433e;
    --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340;
    --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
    --phys:#a78bfa; --phys-soft:#251a3d;

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;

  --rule:#2e2d2a; --rule-strong:#45433e;
  --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340;

*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none !important}
code{font-family:var(--mono);font-size:.9em;background:var(--sheet-2);padding:1px 5px;border-radius:5px;border:1px solid var(--rule)}
.katex{font-size:1.05em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--phys);color:#fff;display:grid;place-items:center;font:italic 700 17px/1 var(--serif)}
.brand strong{display:block;font:600 15px/1.2 var(--sans)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:500 14px/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--sheet-2)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer}
.clock{font:800 22px/1 var(--sans);font-variant-numeric:tabular-nums}
.clock.rush{color:var(--bad)}
main{max-width:980px;margin:32px auto 90px;padding:0 24px;display:grid;gap:20px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--phys);margin-bottom:10px}
h1{font:600 clamp(28px,4.6vw,42px)/1.08 var(--serif);letter-spacing:-.02em}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:720px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px;min-width:0}
.card h2{font:600 21px/1.25 var(--serif)}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.fine{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn-primary:hover:not(:disabled){background:var(--pen-hover)}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:600 12.5px/1 var(--sans);white-space:nowrap}

.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}

.count b{font:800 clamp(40px,7vw,58px)/1 var(--sans);letter-spacing:-.04em;color:var(--phys);font-variant-numeric:tabular-nums}
.count span{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* exercices */
.ex .q{font:17px/1.6 var(--serif);margin-top:8px}
.ex .q p+p{margin-top:8px}
.items{display:grid;gap:12px;margin-top:16px}
.it{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:4px 12px;align-items:center}
.it-lab{text-align:right;font:16px/1.3 var(--serif);overflow-wrap:anywhere}
.it-lab.w{font:15px/1.4 var(--sans);text-align:left}
.it.full{grid-template-columns:minmax(0,1fr)}
.it.full .fb,.it.full .pv,.it.full .vh{grid-column:1}
.it-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.it-in input[type=text]{flex:1;min-width:0;width:100%;max-width:340px;font:15px/1.3 var(--mono);font-variant-ligatures:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:9px;padding:9px 12px;min-height:42px}
.it.ex-expr .it-in input[type=text]{max-width:none}
.unit{font:15px/1 var(--sans);color:var(--ink-2);white-space:nowrap}
.pv,.vh{grid-column:2;min-width:0;overflow-x:auto;overflow-y:hidden}
.pv{padding:3px 0}
.pv{font-size:15px;color:var(--ink-2);min-height:0}
.pv:empty{display:none}
.vh{font-size:12.5px;color:var(--muted)}
.fb{grid-column:2;font-size:14px;color:var(--ink-2);min-width:0;overflow-x:auto;overflow-y:hidden}
.fb:empty{display:none}
.ch{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);cursor:pointer;font-size:14.5px}
.ch:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.ch input{accent-color:var(--pen);margin:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
details.corr{margin-top:14px}
details.corr>summary{cursor:pointer;font:600 14px/1 var(--sans);color:var(--pen);padding:6px 0}
.expl{margin-top:8px;padding:14px 18px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule);font:16px/1.6 var(--serif);overflow-x:auto}
.expl p+p,.expl ul{margin-top:8px}
.expl ul{padding-left:20px}
.strip{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--phys-soft);border:1px solid color-mix(in srgb,var(--phys) 35%,transparent)}
.strip b{font:600 17px/1.3 var(--serif)}
.lvl{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)} .lvl i.on{background:var(--phys)}
.tag-rev{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:600 11.5px/1 var(--sans)}
.res{border-color:color-mix(in srgb,var(--pen) 40%,transparent)}
.psk{display:grid;grid-template-columns:24px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.psk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.psk.val .ic{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.psk.cur .ic{background:var(--phys);color:#fff;border-color:transparent}
.psk.rev .ic{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.psk.lock{opacity:.5}
.psk .nm small{display:block;color:var(--muted);font-size:12.5px}
.pch h3{font:600 17px/1.3 var(--serif);margin:16px 0 4px}
/* cours */
.fiche{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.fiche>summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;cursor:pointer;list-style:none;font:600 18px/1.3 var(--serif)}
.fiche>summary::-webkit-details-marker{display:none}
.fiche>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.fiche[open]>summary::before{transform:rotate(90deg)}
.fiche>summary .tag{margin-left:auto;font:600 11.5px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--phys-soft);color:var(--phys)}
.fiche .body{padding:4px 24px 22px;border-top:1px solid var(--rule);font:16.5px/1.65 var(--serif);overflow-x:auto}
.fiche .body p,.fiche .body ul,.fiche .body ol{margin-top:10px}
.fiche .body ul,.fiche .body ol{padding-left:22px}
.box{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.box.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.box.key{background:var(--phys-soft);border-color:color-mix(in srgb,var(--phys) 30%,transparent)}
.box h5{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;color:var(--ink-2)}
table.t{border-collapse:collapse;margin-top:10px;font:14.5px/1.4 var(--sans)}
table.t td,table.t th{border:1px solid var(--rule);padding:6px 10px;text-align:left}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);font:500 13.5px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.score{font:800 clamp(48px,9vw,72px)/1 var(--sans);letter-spacing:-.03em}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--rule);text-align:left}
@media (max-width:760px){
  .topbar{padding:8px 16px}
  .brand small{display:none}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  main{padding:0 16px;margin-top:22px}
  .card{padding:18px}
  .grid2{grid-template-columns:1fr}
  .it{grid-template-columns:1fr}
  .it-lab{text-align:left}
  .fb,.pv,.vh{grid-column:1}
  .psk{grid-template-columns:24px minmax(0,1fr) auto} .psk .bar{display:none}
  .fiche .body{padding:4px 16px 18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }

const FICHES = [
  ['1. Nombres complexes', 'complexes', `<ul><li>Forme algébrique \\(z = a + ib\\), conjugué \\(\\bar z = a - ib\\), \\(z\\bar z = |z|^2 = a^2 + b^2\\). Pour un quotient : multiplier par le conjugué du dénominateur.</li><li>Forme exponentielle \\(z = re^{i\\theta}\\), \\(r = |z|\\), \\(\\cos\\theta = a/r\\), \\(\\sin\\theta = b/r\\). Les modules se multiplient, les arguments s'ajoutent.</li><li>Moivre : \\((\\cos\\theta + i\\sin\\theta)^n = \\cos(n\\theta) + i\\sin(n\\theta)\\) ; Euler : \\(\\cos\\theta = \\dfrac{e^{i\\theta} + e^{-i\\theta}}{2}\\).</li><li>Racines carrées de \\(a + ib\\) : \\(z = x + iy\\) avec \\(x^2 - y^2 = a\\), \\(2xy = b\\), \\(x^2 + y^2 = \\sqrt{a^2 + b^2}\\).</li><li>\\(az^2 + bz + c = 0\\) : \\(\\Delta = b^2 - 4ac\\), \\(z = \\dfrac{-b\\pm\\delta}{2a}\\) avec \\(\\delta^2 = \\Delta\\) (si \\(\\Delta < 0\\) réel : \\(\\delta = i\\sqrt{-\\Delta}\\)).</li><li>Racines \\(n\\)-ièmes de \\(Re^{i\\varphi}\\) : \\(R^{1/n}e^{i(\\varphi + 2k\\pi)/n}\\), \\(k = 0,\\dots,n-1\\).</li></ul>
    <div class="box warn"><h5>Pièges</h5>L'argument dépend du quadrant : \\(\\arctan(b/a)\\) ne suffit pas si \\(a < 0\\) · une équation à coefficients complexes n'a pas forcément des racines conjuguées.</div>`],

    <div class="box key"><h5>Méthode du CC 2025-26</h5>1. Domaine de dérivabilité (ln : \\(x > 0\\), dénominateur non nul…). 2. Découper : somme, produit, quotient, composée ; dériver chaque morceau. 3. Assembler. Étude : factoriser \\(f'\\), étudier son signe, tableau de variations, extremum.</div>

  ['3. Limites et continuité', 'limites', `<ul><li>Limites de référence en 0 : \\(\\dfrac{\\sin x}{x}\\to1\\), \\(\\dfrac{e^x - 1}{x}\\to1\\), \\(\\dfrac{\\ln(1+x)}{x}\\to1\\), \\(\\dfrac{1 - \\cos x}{x^2}\\to\\dfrac12\\).</li><li>Croissances comparées : \\(\\dfrac{\\ln x}{x^a}\\to0\\) et \\(\\dfrac{x^a}{e^x}\\to0\\) en \\(+\\infty\\) ; \\(x^a\\ln x\\to0\\) en \\(0^+\\).</li><li>Formes indéterminées \\(\\infty - \\infty\\), \\(0\\times\\infty\\), \\(\\frac00\\), \\(\\frac\\infty\\infty\\), \\(1^\\infty\\) : factoriser le terme dominant, quantité conjuguée, \\(u^v = e^{v\\ln u}\\), ou un DL.</li><li>Continuité en \\(a\\) : \\(\\lim_a f = f(a)\\) ; dérivabilité : le taux d'accroissement a une limite finie.</li></ul>`],
  ['4. Développements limités', 'DL', `<p><b>Taylor-Young</b> (\\(f\\) de classe \\(C^n\\)) : \\(f(x) = \\sum_{k=0}^n\\dfrac{f^{(k)}(0)}{k!}x^k + o(x^n)\\).</p>
    <table class="t"><tr><td>\\(e^x\\)</td><td>\\(1 + x + \\frac{x^2}{2} + \\frac{x^3}{6} + \\dots + \\frac{x^n}{n!}\\)</td></tr><tr><td>\\(\\ln(1+x)\\)</td><td>\\(x - \\frac{x^2}{2} + \\frac{x^3}{3} - \\dots\\)</td></tr><tr><td>\\(\\frac{1}{1-x}\\)</td><td>\\(1 + x + x^2 + \\dots + x^n\\)</td></tr><tr><td>\\((1+x)^\\alpha\\)</td><td>\\(1 + \\alpha x + \\frac{\\alpha(\\alpha-1)}{2}x^2 + \\dots\\)</td></tr><tr><td>\\(\\cos x\\)</td><td>\\(1 - \\frac{x^2}{2} + \\frac{x^4}{24} - \\dots\\)</td></tr><tr><td>\\(\\sin x\\)</td><td>\\(x - \\frac{x^3}{6} + \\frac{x^5}{120} - \\dots\\)</td></tr></table>

  ['5. Intégrale de Riemann', 'intégrales', `<ul><li>Une fonction <b>continue (par morceaux) sur un segment</b> \\([a\\,;b]\\) est intégrable au sens de Riemann. Justification type : « quotient de fonctions continues dont le dénominateur ne s'annule pas, donc continue sur le compact \\([a\\,;b]\\) ».</li><li>Propriétés : linéarité, Chasles, positivité, inégalité de la moyenne \\(m(b-a)\\leq\\int_a^b f\\leq M(b-a)\\), valeur moyenne \\(\\frac{1}{b-a}\\int_a^b f\\).</li><li>Si \\(F\\) est une primitive de \\(f\\) continue : \\(\\int_a^b f = F(b) - F(a)\\) ; \\(x\\mapsto\\int_a^x f\\) est la primitive qui s'annule en \\(a\\).</li><li><b>IPP</b> : \\(\\int_a^b u'v = [uv]_a^b - \\int_a^b uv'\\).</li><li><b>Changement de variable</b> \\(x = \\varphi(t)\\) : \\(dx = \\varphi'(t)dt\\), changer les bornes.</li></ul>

    <div class="box key"><h5>À savoir faire</h5>Étudier le sens de variation (signe de \\(u_{n+1} - u_n\\)), calculer une limite (terme dominant, DL), utiliser les définitions dans une démonstration.</div>`],

function startTick() {
  clearInterval(tick); const clk = $('#clock');
  if (!EXAM || EXAM.done) { clk.hidden = true; return; }
  clk.hidden = false;
  const upd = () => { const left = DUR - (Date.now() - EXAM.t0) / 1000; clk.textContent = `${Math.floor(Math.max(0, left) / 3600)}:${String(Math.floor(Math.max(0, left) % 3600 / 60)).padStart(2, '0')}:${String(Math.floor(Math.max(0, left) % 60)).padStart(2, '0')}`; clk.classList.toggle('rush', left < 600); if (left <= 0) submitExam(true); };

const saveExam = () => { const { exs, ...rest } = EXAM; try { localStorage.setItem(EK, JSON.stringify(rest)); } catch (e) { /* ignore */ } };
function submitExam(auto) {
  if (!EXAM || EXAM.done) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  clearInterval(tick);
  const exs = examExos(EXAM.seed); let note = 0; const fb = {};
  for (const ex of exs) {
    const its = [].concat(...ex.parts.map(p => p.items)); let got = 0;
    for (const it of its) { const r = check(it, EXAM.ans[it.id] || ''); fb[it.id] = fbHTML(r); got += r.st === 'ok' ? 1 : 0; }
    note += ex.pts * got / its.length;
  }
  EXAM.done = true; EXAM.running = false; EXAM.note = note; EXAM.fb = fb;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(DUR, Math.round((Date.now() - EXAM.t0) / 1000)) }); ls.set(HK, H);
  try { localStorage.removeItem(EK); } catch (e) { /* ignore */ }
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}
