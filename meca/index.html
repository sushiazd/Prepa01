<!DOCTYPE html>
<html lang="fr">
<head>

<title>Ingénierie mécanique · Entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="../presence.js" data-external></script>
<script defer src="../account.js" data-lazy></script>
<style>
:root{
  color-scheme:light;
  --paper:#f4f2ec; --sheet:#fffefb; --sheet-2:#f8f6f1;
  --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;
  --rule:#e4e0d6; --rule-strong:#cdc8bb;
  --pen:#2446c8; --pen-hover:#1c389f; --pen-ink:#ffffff; --pen-soft:#eaeefc;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --bad:#c2352b; --bad-soft:#fbeceb; --warn:#9a5b00; --warn-soft:#fcf2da;
  --phys:#c2410c; --phys-soft:#fdeee4;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px -18px rgba(28,27,25,.25);
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
    --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
    --rule:#2e2d2a; --rule-strong:#45433e;
    --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340;
    --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
    --phys:#fb923c; --phys-soft:#3a2214;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
  --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --rule:#2e2d2a; --rule-strong:#45433e;
  --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340;
  --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --warn:#f0b64d; --warn-soft:#32270f;
  --phys:#fb923c; --phys-soft:#3a2214;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none !important}
code{font-family:var(--mono);font-size:.9em;background:var(--sheet-2);padding:1px 5px;border-radius:5px;border:1px solid var(--rule)}
.katex{font-size:1.05em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 24px;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--phys);color:#fff;display:grid;place-items:center;font:italic 700 17px/1 var(--serif)}
.brand strong{display:block;font:600 15px/1.2 var(--sans)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.tab{height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:500 14px/1 var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--sheet-2)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer}
.clock{font:800 22px/1 var(--sans);font-variant-numeric:tabular-nums}
.clock.rush{color:var(--bad)}
main{max-width:980px;margin:32px auto 90px;padding:0 24px;display:grid;gap:20px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--phys);margin-bottom:10px}
h1{font:600 clamp(28px,4.6vw,42px)/1.08 var(--serif);letter-spacing:-.02em}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:720px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px;min-width:0}
.card h2{font:600 21px/1.25 var(--serif)}
.sub{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.fine{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn-primary:hover:not(:disabled){background:var(--pen-hover)}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:600 12.5px/1 var(--sans);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.part{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font:800 clamp(40px,7vw,58px)/1 var(--sans);letter-spacing:-.04em;color:var(--phys);font-variant-numeric:tabular-nums}
.count span{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* exercices */
.ex .q{font:17px/1.6 var(--serif);margin-top:8px}
.ex .q p+p{margin-top:8px}
.items{display:grid;gap:12px;margin-top:16px}
.it{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:4px 12px;align-items:center}
.it-lab{text-align:right;font:16px/1.3 var(--serif);overflow-wrap:anywhere}
.it-lab.w{font:15px/1.4 var(--sans);text-align:left}
.it.full{grid-template-columns:minmax(0,1fr)}
.it.full .fb,.it.full .pv,.it.full .vh{grid-column:1}
.it-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.it-in input[type=text]{flex:1;min-width:0;width:100%;max-width:340px;font:15px/1.3 var(--mono);font-variant-ligatures:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-strong);border-radius:9px;padding:9px 12px;min-height:42px}
.it.ex-expr .it-in input[type=text]{max-width:none}
.unit{font:15px/1 var(--sans);color:var(--ink-2);white-space:nowrap}
.pv,.vh{grid-column:2;min-width:0;overflow-x:auto;overflow-y:hidden}
.pv{padding:3px 0}
.pv{font-size:15px;color:var(--ink-2);min-height:0}
.pv:empty{display:none}
.vh{font-size:12.5px;color:var(--muted)}
.fb{grid-column:2;font-size:14px;color:var(--ink-2);min-width:0;overflow-x:auto;overflow-y:hidden}
.fb:empty{display:none}
.ch{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);cursor:pointer;font-size:14.5px}
.ch:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.ch input{accent-color:var(--pen);margin:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
details.corr{margin-top:14px}
details.corr>summary{cursor:pointer;font:600 14px/1 var(--sans);color:var(--pen);padding:6px 0}
.expl{margin-top:8px;padding:14px 18px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule);font:16px/1.6 var(--serif);overflow-x:auto}
.expl p+p,.expl ul{margin-top:8px}
.expl ul{padding-left:20px}
.strip{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--phys-soft);border:1px solid color-mix(in srgb,var(--phys) 35%,transparent)}
.strip b{font:600 17px/1.3 var(--serif)}
.lvl{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--rule-strong)} .lvl i.on{background:var(--phys)}
.tag-rev{display:inline-flex;height:22px;align-items:center;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:600 11.5px/1 var(--sans)}
.res{border-color:color-mix(in srgb,var(--pen) 40%,transparent)}
.psk{display:grid;grid-template-columns:24px minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.psk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.psk.val .ic{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.psk.cur .ic{background:var(--phys);color:#fff;border-color:transparent}
.psk.rev .ic{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.psk.lock{opacity:.5}
.psk .nm small{display:block;color:var(--muted);font-size:12.5px}
.pch h3{font:600 17px/1.3 var(--serif);margin:16px 0 4px}
/* cours */
.fiche{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.fiche>summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;cursor:pointer;list-style:none;font:600 18px/1.3 var(--serif)}
.fiche>summary::-webkit-details-marker{display:none}
.fiche>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.fiche[open]>summary::before{transform:rotate(90deg)}
.fiche>summary .tag{margin-left:auto;font:600 11.5px/1 var(--sans);padding:5px 9px;border-radius:999px;background:var(--phys-soft);color:var(--phys)}
.fiche .body{padding:4px 24px 22px;border-top:1px solid var(--rule);font:16.5px/1.65 var(--serif);overflow-x:auto}
.fiche .body p,.fiche .body ul,.fiche .body ol{margin-top:10px}
.fiche .body ul,.fiche .body ol{padding-left:22px}
.box{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.box.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.box.key{background:var(--phys-soft);border-color:color-mix(in srgb,var(--phys) 30%,transparent)}
.box h5{font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;color:var(--ink-2)}
table.t{border-collapse:collapse;margin-top:10px;font:14.5px/1.4 var(--sans)}
table.t td,table.t th{border:1px solid var(--rule);padding:6px 10px;text-align:left}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);font:500 13.5px/1 var(--sans);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.score{font:800 clamp(48px,9vw,72px)/1 var(--sans);letter-spacing:-.03em}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist td,.hist th{padding:8px;border-bottom:1px solid var(--rule);text-align:left}
.fig{display:block;width:100%;max-width:440px;height:auto;margin:14px auto 0}
.fig .st{stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .cab{stroke:var(--ink-2);stroke-width:2;fill:none}
.fig .thin{stroke:var(--muted);stroke-width:1.1;fill:none}
.fig .thin2{stroke:var(--ink-2);stroke-width:2;fill:none}
.fig .dash{stroke-dasharray:5 4}
.fig .fo{stroke:var(--bad);stroke-width:2.6;fill:none}
.fig .mkf{fill:var(--bad)} .fig .mkk{fill:var(--muted)}
.fig .dm{stroke:var(--muted);stroke-width:1}
.fig .ax{stroke:var(--ink-2);stroke-width:1.4}
.fig .ang{stroke:var(--pen);stroke-width:1.5;fill:none}
.fig .sup{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.fig .beam{fill:var(--sheet-2);stroke:var(--ink);stroke-width:2.4}
.fig .pt{fill:var(--ink)}
.fig text{fill:var(--ink);font:600 14px/1 var(--sans)}
.fig text.fl{fill:var(--bad);font-weight:700}
.fig text.dt{fill:var(--muted);font-weight:500;font-size:13px}
.fig text.at{fill:var(--pen)}
@media (max-width:760px){
  .topbar{padding:8px 16px}
  .brand small{display:none}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  main{padding:0 16px;margin-top:22px}
  .card{padding:18px}
  .grid2{grid-template-columns:1fr}
  .it{grid-template-columns:1fr}
  .it-lab{text-align:left}
  .fb,.pv,.vh{grid-column:1}
  .psk{grid-template-columns:24px minmax(0,1fr) auto} .psk .bar{display:none}
  .fiche .body{padding:4px 16px 18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>

/* ---------- Cours ---------- */
const FICHES = [
  ['1. Vecteurs : projection et produit vectoriel', 'projection, produit vectoriel', `<p>Projection d'une force de norme \\(F\\) faisant l'angle \\(\\alpha\\) avec un axe : composante \\(F\\cos\\alpha\\) sur cet axe (côté <b>adjacent</b>), \\(F\\sin\\alpha\\) sur l'axe perpendiculaire ; les signes se lisent sur la figure.</p>
    <p>Produit vectoriel dans une base orthonormée directe : \\(\\vec x\\wedge\\vec y = \\vec z\\), \\(\\vec y\\wedge\\vec z = \\vec x\\), \\(\\vec z\\wedge\\vec x = \\vec y\\) ; \\(\\vec v\\wedge\\vec u = -\\vec u\\wedge\\vec v\\) ; \\(\\vec u\\wedge\\vec u = \\vec 0\\).</p>
    \\[\\begin{pmatrix} u_x \\\\ u_y \\\\ u_z \\end{pmatrix}\\wedge\\begin{pmatrix} v_x \\\\ v_y \\\\ v_z \\end{pmatrix} = \\begin{pmatrix} u_yv_z - u_zv_y \\\\ u_zv_x - u_xv_z \\\\ u_xv_y - u_yv_x \\end{pmatrix}\\]
    <p>\\(\\vec u\\wedge\\vec v\\) est perpendiculaire à \\(\\vec u\\) et à \\(\\vec v\\), de norme \\(uv\\sin(\\vec u, \\vec v)\\) (règle des trois doigts de la main droite).</p>
    <div class="box key"><h5>À savoir faire</h5>Écrire chaque force en colonne dans la base \\((\\vec x, \\vec y, \\vec z)\\) avant tout calcul ; développer un produit vectoriel avec les produits des vecteurs de base.</div>
    <div class="box warn"><h5>Pièges</h5>Inverser cos et sin quand l'angle est mesuré depuis \\(\\vec y\\) · oublier le signe d'une composante dirigée vers les \\(x\\) ou \\(y\\) négatifs · \\(\\vec x\\wedge\\vec z = -\\vec y\\).</div>`],
  ['2. Moment d\'une force', 'moments', `<p>Moment en A d'une force \\(\\vec F\\) appliquée en B :</p>\\[\\vec{\\mathcal M}_A(\\vec F) = \\vec{AB}\\wedge\\vec F\\]
    <ul><li>Il est nul si A est sur la ligne d'action de \\(\\vec F\\).</li><li>Sa norme vaut \\(F\\times d\\), où \\(d\\) est le <b>bras de levier</b> (distance de A à la ligne d'action) : il mesure la capacité de la force à faire tourner le solide autour de A.</li><li>Dans un problème plan \\((\\vec x, \\vec y)\\), il est porté par \\(\\vec z\\) : \\(\\mathcal M_{A,z} = x_{AB}F_y - y_{AB}F_x\\), positif si la force fait tourner dans le sens trigonométrique.</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Calculer le moment d'une même force en plusieurs points ; retrouver le résultat par « force × bras de levier » avec le bon signe.</div>
    <div class="box warn"><h5>Pièges</h5>Le vecteur va du point où l'on calcule le moment <b>vers</b> le point d'application (\\(\\vec{AB}\\), pas \\(\\vec{BA}\\)) · l'ordre du produit vectoriel compte.</div>`],
  ['3. Torseurs', 'torseurs', `<p>Une action mécanique est représentée par un torseur : sa <b>résultante</b> \\(\\vec R\\) (indépendante du point) et son <b>moment</b> \\(\\vec{\\mathcal M}_A\\) en un point A :</p>\\[\\{\\mathcal T\\} = \\begin{Bmatrix} \\vec R \\\\ \\vec{\\mathcal M}_A \\end{Bmatrix}_A = \\begin{Bmatrix} X & L \\\\ Y & M \\\\ Z & N \\end{Bmatrix}_{A,(\\vec x,\\vec y,\\vec z)}\\]
    <p><b>Transport du moment</b> (« BABAR ») : \\(\\vec{\\mathcal M}_B = \\vec{\\mathcal M}_A + \\vec{BA}\\wedge\\vec R\\).</p>
    <ul><li>Glisseur (une force) : moment nul en tout point de sa ligne d'action.</li><li>Couple : résultante nulle, moment identique en tout point.</li><li>On n'additionne deux torseurs que s'ils sont écrits <b>au même point</b> et dans la même base.</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Écrire le torseur d'une force en son point d'application, puis le transporter au point choisi pour le PFS.</div>`],
  ['4. Liaisons et actions transmissibles', 'liaisons', `<p>Une liaison transmet une force dans chaque direction de translation bloquée et un moment autour de chaque axe de rotation bloqué. Inconnues statiques + degrés de liberté = 6. (Au DS de 2023-24, la fiche des liaisons était le seul document autorisé.)</p>
    <table class="t"><tr><th>Liaison</th><th>Torseur transmissible en A</th><th>Inconnues</th></tr>${LIA.map(l => `<tr><td>${l[0]}</td><td>\\(${tor(l[2], l[3], 'A')}\\)</td><td>${l[1]}</td></tr>`).join('')}</table>
    <p><b>Problème plan</b> \\((\\vec x, \\vec y)\\) : seules \\(X\\), \\(Y\\) et \\(N\\) restent. Pivot d'axe \\(\\vec z\\) : \\(X, Y\\) ; encastrement : \\(X, Y, N\\) ; appui ponctuel de normale \\(\\vec y\\) : \\(Y\\) ; glissière de direction \\(\\vec x\\) : \\(Y, N\\).</p>
    <div class="box warn"><h5>Pièges</h5>Une liaison parfaite (sans frottement) ne transmet rien dans les directions où elle laisse bouger · le torseur d'une pivot n'a pas cette forme en un point hors de son axe.</div>`],
  ['5. Principe fondamental de la statique', 'PFS', `<p>Un solide (ou ensemble) en équilibre dans un référentiel galiléen : la somme des torseurs des actions <b>extérieures</b> est nulle.</p>\\[\\sum\\{\\mathcal T_{ext}\\} = \\{0\\}\\iff\\begin{cases}\\sum\\vec F_{ext} = \\vec 0 & \\text{(théorème de la résultante statique)}\\\\ \\sum\\vec{\\mathcal M}_A(\\vec F_{ext}) = \\vec 0 & \\text{(théorème du moment statique, en un point A quelconque)}\\end{cases}\\]
    <p>6 équations dans l'espace, 3 dans le plan (\\(X\\), \\(Y\\), \\(N\\)).</p>
    <div class="box key"><h5>Méthode (celle du corrigé du DS)</h5>1. Isoler le système. 2. Bilan des actions extérieures : écrire chaque torseur (liaisons, forces, couples) dans la même base. 3. Les transporter tous au même point, de préférence celui qui a le plus d'inconnues. 4. Écrire les 6 (ou 3) équations et résoudre. 5. Encadrer la réponse demandée.</div>
    <div class="box warn"><h5>Pièges</h5>Les actions intérieures au système isolé n'apparaissent pas · une inconnue trouvée négative signifie seulement qu'elle est dans l'autre sens.</div>`],
  ['6. Cas classiques', 'câbles, appuis, basculement', `<ul><li><b>Câbles symétriques</b> d'angle \\(\\theta\\) avec l'horizontale : \\(F = \\dfrac{P}{2\\sin\\theta}\\) ; avec la géométrie, \\(\\sin\\theta = \\dfrac h\\ell\\) et \\(h = \\sqrt{\\ell^2 - L^2/4}\\).</li><li><b>Nœud retenu par deux câbles</b> : projeter sur \\(\\vec x\\) et \\(\\vec y\\), deux équations, deux tensions.</li><li><b>Poutre encastrée</b> : \\(X_A, Y_A, N_A\\) ; moments en A.</li><li><b>Poutre sur deux appuis</b> : moments en un appui donnent l'autre réaction (\\(Y_B = \\frac dL F\\)).</li><li><b>Basculement</b> : à la limite, l'appui qui décolle a une réaction nulle ; on écrit les moments autour de l'autre.</li><li><b>Trois appuis ponctuels</b> (moto) : résultante sur \\(\\vec z\\) + moments sur \\(\\vec x\\) et \\(\\vec y\\).</li><li><b>Couple moteur</b> sur un bras en pivot : \\(C = P\\times x_G\\) (bras de levier horizontal).</li></ul>`],
  ['7. Plusieurs solides : isolements successifs', 'bielles', `<ul><li><b>Solide soumis à deux forces</b> (biellette, poids négligé) : en équilibre si les deux forces sont opposées et portées par la droite qui joint leurs points d'application. On connaît donc la <b>direction</b> de l'effort.</li><li><b>Solide soumis à trois forces non parallèles</b> : elles sont concourantes en un même point et leur somme est nulle.</li><li>Ordre d'isolement : commencer par les solides soumis à deux forces, puis ceux qui ont le moins d'inconnues (cisaille du TD 5 : isoler 2, puis 3, puis {1 + 2}).</li><li>Actions réciproques : l'action de 1 sur 2 est l'opposée de celle de 2 sur 1.</li></ul>
    <div class="box key"><h5>À savoir faire</h5>Choisir les isolements pour n'avoir à chaque fois pas plus d'inconnues que d'équations (3 en plan).</div>`]
];

function startTick() {
  clearInterval(tick); const clk = $('#clock');
  if (!EXAM || EXAM.done) { clk.hidden = true; return; }
  clk.hidden = false;
  const upd = () => { const left = DUR - (Date.now() - EXAM.t0) / 1000; clk.textContent = `${Math.floor(Math.max(0, left) / 3600)}:${String(Math.floor(Math.max(0, left) % 3600 / 60)).padStart(2, '0')}:${String(Math.floor(Math.max(0, left) % 60)).padStart(2, '0')}`; clk.classList.toggle('rush', left < 600); if (left <= 0) submitExam(true); };
  upd(); tick = setInterval(upd, 1000);
}
const saveExam = () => { const { exs, ...rest } = EXAM; try { localStorage.setItem(EK, JSON.stringify(rest)); } catch (e) { /* ignore */ } };
function submitExam(auto) {
  if (!EXAM || EXAM.done) return;
  if (!auto && !confirm('Rendre la copie ?')) return;
  clearInterval(tick);
  const exs = examExos(EXAM.seed); let note = 0; const fb = {};
  for (const ex of exs) {
    const its = [].concat(...ex.parts.map(p => p.items)); let got = 0;
    for (const it of its) { const r = check(it, EXAM.ans[it.id] || ''); fb[it.id] = fbHTML(r); got += r.st === 'ok' ? 1 : 0; }
    note += ex.pts * got / its.length;
  }
  EXAM.done = true; EXAM.running = false; EXAM.note = note; EXAM.fb = fb;
  const H = ls.get(HK, []); H.push({ id: String(EXAM.seed), ts: Date.now(), note, dur: Math.min(DUR, Math.round((Date.now() - EXAM.t0) / 1000)) }); ls.set(HK, H);
  try { localStorage.removeItem(EK); } catch (e) { /* ignore */ }
  if (auto) toast('Temps écoulé : copie rendue.');
  renderExam(); window.scrollTo(0, 0);
}
