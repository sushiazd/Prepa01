<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streak · questions d'affilée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="../presence.js" data-external></script>
<script defer src="../account.js" data-lazy></script>
<style>
:root{
  color-scheme:light;
  --paper:#f4f2ec; --sheet:#fffefb; --sheet-2:#f8f6f1;
  --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;
  --rule:#e4e0d6; --rule-strong:#cdc8bb;
  --pen:#2446c8; --pen-hover:#1c389f; --pen-ink:#ffffff; --pen-soft:#eaeefc; --pen-line:#bccaf5;
  --ok:#1f8a4c; --ok-soft:#e6f4ec; --bad:#c2352b; --bad-soft:#fbeceb; --flag:#d4700a; --flag-soft:#fdf0e1;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px -18px rgba(28,27,25,.25);
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
    --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
    --rule:#2e2d2a; --rule-strong:#45433e;
    --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340; --pen-line:#34437a;
    --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --flag:#ff9d42; --flag-soft:#382512;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --sheet:#1b1b19; --sheet-2:#222220;
  --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --rule:#2e2d2a; --rule-strong:#45433e;
  --pen:#7592ff; --pen-hover:#91a8ff; --pen-ink:#0d1433; --pen-soft:#1c2340; --pen-line:#34437a;
  --ok:#4cc27e; --ok-soft:#14301f; --bad:#ff6b5e; --bad-soft:#3a1714; --flag:#ff9d42; --flag-soft:#382512;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
h1,h2,h3,p{margin:0}
button{font:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
[hidden]{display:none !important}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding:0 24px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--flag);color:#fff;display:grid;place-items:center;font:800 17px/1 var(--sans)}
.brand strong{display:block;font:600 15px/1.2 var(--sans)}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer}
main{max-width:860px;margin:40px auto 80px;padding:0 24px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--flag);margin-bottom:12px}
h1{font:600 clamp(30px,5vw,44px)/1.05 var(--serif);letter-spacing:-.02em}
.lede{font:italic 18px/1.5 var(--serif);color:var(--ink-2);margin-top:10px;max-width:620px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-top:20px}
.card h2{font:600 20px/1.25 var(--serif)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);font:600 14px/1 var(--sans);cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--pen)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn-primary:hover:not(:disabled){background:var(--pen-hover);border-color:var(--pen-hover)}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}

/* ---------- Accueil du mode ---------- */
.label{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:20px}
.subjects{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.subj{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:12px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left}
.subj .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--sheet-2);font:600 17px/1 var(--serif)}
.subj[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.subj[aria-pressed="true"] .ic{background:var(--pen);color:var(--pen-ink)}
.subj:disabled{cursor:not-allowed;opacity:.6;border-style:dashed}
.subj small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.subj b{display:block;font-size:14.5px;line-height:1.2}
.srcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.src{display:grid;gap:6px;align-content:start;padding:14px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left}
.src:hover{border-color:var(--pen)}
.src[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.src b{font-size:15px}
.src span{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.src .rec{font:600 12.5px/1.2 var(--sans);color:var(--flag);margin-top:2px}
.src .new{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:var(--flag-soft);color:var(--flag);font:700 10.5px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
.start{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.rules{display:grid;gap:6px;margin:10px 0 0;padding-left:20px;color:var(--ink-2);font-size:14.5px}
.recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.recs div{padding:12px 14px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule)}
.recs b{display:block;font:700 30px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.recs span{font-size:13px;color:var(--ink-2)}
.recs small{display:block;font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- Partie ---------- */
.hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:10px}
.count b{font:800 56px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--flag)}
.count span{font:600 14px/1.2 var(--sans);color:var(--ink-2)}
.hud .rec{font:600 14px/1.2 var(--sans);color:var(--muted)}
.hud .rec.beat{color:var(--ok)}
.hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font:600 13px/1 var(--sans);color:var(--ink-2)}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.qcard{margin-top:14px}
.qctx{overflow-x:auto;overflow-y:hidden;padding:12px 14px;border-radius:10px;background:var(--sheet-2);border:1px solid var(--rule);margin-bottom:12px;font-size:15.5px}
.qtext{font:19px/1.55 var(--serif);overflow-x:auto;overflow-y:hidden}
.multi-hint{display:inline-block;margin-top:10px;font:600 13px/1.3 var(--sans);color:var(--flag)}
.choices{display:grid;gap:10px;margin-top:16px}
.ch{position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--sheet);color:var(--ink);cursor:pointer;font:16px/1.5 var(--serif)}
.ch:hover:not(:disabled){border-color:var(--pen)}
.ch:disabled{cursor:default}
.ch .lt{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 13px/1 var(--sans);background:var(--sheet-2);border:1px solid var(--rule-strong);color:var(--ink-2)}
.ch.multi .lt{border-radius:6px}
.ch .tx{flex:1;min-width:0;padding-top:2px;overflow-x:auto;overflow-y:hidden}
.ch[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.ch[aria-pressed="true"] .lt{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.ch.good{border-color:var(--ok);background:var(--ok-soft)}
.ch.good .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.ch .tag{align-self:center;font:700 11.5px/1 var(--sans);padding:5px 7px;border-radius:999px;background:var(--ink);color:var(--paper);white-space:nowrap}
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.verdict{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet-2)}
.verdict h3{font:600 20px/1.3 var(--serif)}
.verdict p{margin-top:6px;color:var(--ink-2);font-size:15px}
.verdict.win{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.verdict.lose{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.verdict.record{border-color:color-mix(in srgb,var(--flag) 55%,transparent);background:var(--flag-soft)}
details.corr{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
details.corr summary{cursor:pointer;font-weight:600;color:var(--pen)}
details.corr .body{margin-top:10px;font:15.5px/1.6 var(--serif);color:var(--ink-2);overflow-x:auto;overflow-y:hidden}
details.corr h4{margin:12px 0 4px;font:700 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.end{text-align:center;padding:30px 22px}
.end .big{font:800 clamp(56px,12vw,88px)/1 var(--sans);letter-spacing:-.04em;color:var(--flag);font-variant-numeric:tabular-nums}
.end h2{margin-top:8px}
.end .row{justify-content:center;margin-top:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600;box-shadow:var(--shadow)}
.katex{font-size:1.05em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
@media (max-width:720px){
  .topbar{padding:0 16px}
  .brand small{display:none}
  main{margin-top:24px;padding:0 16px}
  .card{padding:18px}
  .srcs,.recs{grid-template-columns:1fr}
  .count b{font-size:46px}
  .qtext{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../" title="Retour à l'accueil des révisions"><span class="brand-mark" aria-hidden="true">∞</span><div><strong>Streak</strong><small>Questions d'affilée, sans faute</small></div></a>
  <button type="button" class="icon-btn" id="themeBtn" aria-label="Thème"></button>
</header>
<main id="app"><p class="muted center" style="margin-top:60px">Chargement des questions…</p></main>

<script>
(function () {
'use strict';

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const LET = 'ABCDEFGH';
const sameSet = (a, b) => a.length === b.length && a.slice().sort().join() === b.slice().sort().join();
const pick = a => a[Math.floor(Math.random() * a.length)];
let toastT = 0;
function toast(t) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3500);
}
function typeset(el) {
  if (!el || !window.renderMathInElement) return;
  try { renderMathInElement(el, { delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) { console.warn(e); }
}
const plural = (n, w) => n + ' ' + w + (n > 1 ? 's' : '');

/* ---------- Thème clair / sombre (même réglage que le reste du site) ---------- */
(function () {
  const ICON = {
    sun: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    auto: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>'
  };
  const KEY = 'qcm-maths-theme', btn = $('#themeBtn');
  function apply(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
    btn.innerHTML = ICON[t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon']; btn.dataset.mode = t;
    btn.title = 'Thème : ' + ({ auto: 'automatique', light: 'clair', dark: 'sombre' })[t];
  }
  let t = 'auto'; try { t = localStorage.getItem(KEY) || 'auto'; } catch (e) { /* ignore */ }
  apply(t);
  btn.addEventListener('click', () => { const nx = ({ auto: 'light', light: 'dark', dark: 'auto' })[btn.dataset.mode]; try { localStorage.setItem(KEY, nx); } catch (e) { /* ignore */ } apply(nx); });
})();

/* =====================================================================
   QUESTIONS : le générateur du QCM de maths (même extraction que le 1v1)
   ===================================================================== */
let QGEN = null, THEME_NAMES = {}, EXAM_TPL = new Set();
async function loadQuestions() {
  const res = await fetch('../maths/index.html', { cache: 'no-cache' });
  if (!res.ok) throw new Error('Page maths introuvable (' + res.status + ')');
  const src = await res.text();
  const a = src.indexOf('const QGEN = (function () {');
  const r = src.indexOf('return { entry, unit, exam', a);
  const b = src.indexOf('\n})();', r);
  if (a < 0 || r < 0 || b < 0) throw new Error('Générateur de questions introuvable dans la page maths');
  QGEN = new Function(src.slice(a, b + 6) + '\nreturn QGEN;')();
  const re = /\{ id: '([a-z_0-9]+)', name: '(?:[^'\\]|\\.)*', short: '((?:[^'\\]|\\.)*)'/g;
  let m; while ((m = re.exec(src))) THEME_NAMES[m[1]] = m[2].replace(/\\'/g, "'");
  // modèles utilisés par les sujets au format du prof : tout le reste, ce sont les « nouveaux types »
  Object.values(QGEN.EXAMS).forEach(ex => ex.slots.forEach(sl => Object.keys(sl).forEach(k => EXAM_TPL.add(k))));
}
const themeName = id => THEME_NAMES[id] || id;

/* Sources de questions (chaque source a son propre record) */
const SRC = {
  all: { name: 'Tout le programme', desc: 'Tous les types de questions, sur tous les thèmes.', keep: () => true },
  new: { name: 'Nouveaux types', desc: 'Seulement les questions qui ne sont pas au format des sujets : pour être prêt à l\'inédit.', keep: t => !EXAM_TPL.has(t.id), isNew: true },
  exam: { name: 'Format du QCM', desc: 'Seulement les types de questions des sujets du prof.', keep: t => EXAM_TPL.has(t.id) }
};
// Thème tiré au hasard (tous les thèmes ont la même chance), puis un modèle de ce thème, en évitant les derniers vus
function drawQuestion(src, recent) {
  const tpls = Object.values(QGEN.TPL).filter(SRC[src].keep);
  const themes = [...new Set(tpls.map(t => t.theme))];
  for (let k = 0; k < 20; k++) {
    const th = pick(themes);
    let cand = tpls.filter(t => t.theme === th && !recent.includes(t.id));
    if (!cand.length) cand = tpls.filter(t => t.theme === th);
    const tot = cand.reduce((s, t) => s + t.w, 0); let r = Math.random() * tot, t = cand[cand.length - 1];
    for (const c of cand) { if ((r -= c.w) < 0) { t = c; break; } }
    const seed = Math.floor(Math.random() * 2147483647).toString(36);
    const qid = t.group ? `gen.${t.id}.${seed}.${Math.floor(Math.random() * t.size)}` : `gen.${t.id}.${seed}`;
    const e = QGEN.entry(qid);
    if (e && e.q && Array.isArray(e.q.c) && Array.isArray(e.q.a) && e.q.a.length) return { qid, tpl: t.id };
  }
  throw new Error('Impossible de tirer une question');
}

/* =====================================================================
   DONNÉES : records et série en cours (synchronisées avec le compte)
   ===================================================================== */
const KEY = 'streak.v1';
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* ignore */ }
  d = d && typeof d === 'object' ? d : {};
  d.best = d.best || {}; d.runs = d.runs || 0; d.total = d.total || 0; d.cur = d.cur || null;
  return d;
}
function save(d) {
  d.curT = Date.now();          // sert à la synchro : la série la plus récemment touchée l'emporte
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* stockage indisponible */ }
  if (window.SiteAccount) SiteAccount.touch(KEY);
}
const recKey = (subj, src) => subj + ':' + src;
const bestOf = (d, subj, src) => (d.best[recKey(subj, src)] || {}).n || 0;

/* =====================================================================
   ÉCRANS
   ===================================================================== */
let SUBJ = 'maths', SRC_ID = 'all';
try { const p = JSON.parse(localStorage.getItem('streak.prefs') || '{}'); if (SRC[p.src]) SRC_ID = p.src; } catch (e) { /* ignore */ }

function home() {
  const d = load(), c = d.cur;
  const recs = Object.keys(SRC).map(k => { const b = d.best[recKey('maths', k)]; return `<div><b>${b ? b.n : 0}</b><span>${esc(SRC[k].name)}</span><small>${b && b.n ? 'le ' + new Date(b.at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : 'pas encore de record'}</small></div>`; }).join('');
  app.innerHTML = `
    <p class="eyebrow">Mode Streak</p>
    <h1>Combien d'affilée sans te tromper ?</h1>
    <p class="lede">Les questions s'enchaînent tant que tu as juste. À la première erreur, la série s'arrête : bats ton record.</p>
    ${c ? `<section class="card"><div class="row"><div><h2>Une série est en cours : ${c.n} d'affilée</h2><p class="sub">${esc(SRC[c.src] ? SRC[c.src].name : '')} · tu reprends exactement sur la question où tu t'étais arrêté.</p></div><span class="sp"></span><button type="button" class="btn btn-primary btn-lg" id="resume">Reprendre</button></div></section>` : ''}
    <section class="card">
      <h2>Nouvelle série</h2>
      <p class="label">Matière</p>
      <div class="subjects">
        <button type="button" class="subj" aria-pressed="true"><span class="ic">∑</span><span><b>Maths</b><small>QCM de Terminale</small></span></button>
        <button type="button" class="subj" disabled title="Bientôt disponible"><span class="ic">Ω</span><span><b>Électronique</b><small>bientôt</small></span></button>
      </div>
      <p class="label">Questions</p>
      <div class="srcs">${Object.keys(SRC).map(k => `<button type="button" class="src" data-src="${k}" aria-pressed="${k === SRC_ID}"><b>${esc(SRC[k].name)}${SRC[k].isNew ? '<span class="new">pour l\'inédit</span>' : ''}</b><span>${esc(SRC[k].desc)}</span><span class="rec">Record : ${bestOf(d, 'maths', k)}</span></button>`).join('')}</div>
      <div class="start"><button type="button" class="btn btn-primary btn-lg" id="go">${c ? 'Abandonner la série en cours et recommencer' : 'Commencer'}</button><span class="muted" style="font-size:14px">Pas de chrono : prends le temps de calculer, seule la justesse compte.</span></div>
    </section>
    <section class="card">
      <h2>Tes records</h2>
      <p class="sub">${d.runs ? `${plural(d.runs, 'série')} jouée${d.runs > 1 ? 's' : ''} · ${plural(d.total, 'bonne réponse')} au total.` : 'Joue ta première série pour établir un record.'} ${window.SiteAccount && SiteAccount.user ? 'Enregistrés sur ton compte.' : 'Connecte-toi sur l\'accueil pour les garder sur tous tes appareils.'}</p>
      <div class="recs">${recs}</div>
    </section>
    <section class="card">
      <h2>Règles</h2>
      <ul class="rules">
        <li>Une question à la fois, sur un thème tiré au hasard (tous les thèmes ont la même chance).</li>
        <li>Question <b>♣</b> : il faut cocher <b>toutes</b> les bonnes réponses, et aucune fausse.</li>
        <li>La série est enregistrée à chaque réponse : recharger la page ne change pas la question.</li>
        <li>Après chaque réponse, la correction est disponible. À la première erreur, elle s'ouvre directement.</li>
      </ul>
    </section>`;
  typeset(app);
  app.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { SRC_ID = b.dataset.src; try { localStorage.setItem('streak.prefs', JSON.stringify({ src: SRC_ID })); } catch (e) { /* ignore */ } home(); });
  const go = $('#go'); go.onclick = () => { if (c && !confirm(`Abandonner la série en cours (${c.n} d'affilée) ?`)) return; if (c) endRun(load(), true); start(); };
  const rs = $('#resume'); if (rs) rs.onclick = () => play();
}

function start() {
  const d = load();
  const q = drawQuestion(SRC_ID, []);
  d.cur = { subj: SUBJ, src: SRC_ID, n: 0, prev: bestOf(d, SUBJ, SRC_ID), qid: q.qid, recent: [q.tpl], startedAt: Date.now() };
  save(d);
  play();
}
// fin de série (le record, lui, est enregistré dès qu'il est battu)
function endRun(d, abandoned) {
  const c = d.cur; if (!c) return { n: 0, prev: 0, rec: false };
  const prev = c.prev || 0;
  d.runs++; d.cur = null;
  save(d);
  return { n: c.n, prev, rec: c.n > prev, src: c.src, abandoned };
}

let sel = [];
function play() {
  const d = load(), c = d.cur;
  if (!c) { home(); return; }
  const e = QGEN.entry(c.qid);
  if (!e) { const q = drawQuestion(c.src, c.recent || []); c.qid = q.qid; save(d); return play(); }
  sel = [];
  const q = e.q, multi = !!q.multi, best = c.prev || 0;
  app.innerHTML = `
    <div class="hud">
      <div class="count"><b id="cnt">${c.n}</b><span>d'affilée</span></div>
      <span class="rec ${c.n > best ? 'beat' : ''}">${c.n > best ? 'Nouveau record en cours !' : `Record : ${best}`}</span>
      <span class="sp"></span>
      <span class="chip">${esc(themeName(e.theme))}</span>
    </div>
    <section class="card qcard" id="qc">
      ${e.ctxText ? `<div class="qctx">${e.ctxText}</div>` : ''}
      <div class="qtext">${q.q || ''}</div>
      ${multi ? '<span class="multi-hint">♣ Plusieurs bonnes réponses possibles : coche-les toutes.</span>' : ''}
      <div class="choices">${q.c.map((x, i) => `<button type="button" class="ch${multi ? ' multi' : ''}" data-i="${i}" aria-pressed="false"><span class="lt">${LET[i]}</span><span class="tx">${x}</span></button>`).join('')}</div>
      <div class="actions"><button type="button" class="btn btn-ghost" id="quit">Arrêter la série</button><button type="button" class="btn btn-primary btn-lg" id="ok" disabled>Valider</button></div>
    </section>`;
  typeset(app);
  app.querySelectorAll('.ch').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (multi) sel = sel.includes(i) ? sel.filter(x => x !== i) : sel.concat(i); else sel = [i];
    app.querySelectorAll('.ch').forEach(x => x.setAttribute('aria-pressed', String(sel.includes(+x.dataset.i))));
    $('#ok').disabled = !sel.length; $('#ok').textContent = multi && sel.length ? `Valider (${sel.length})` : 'Valider';
  });
  $('#ok').onclick = () => answer(e);
  $('#quit').onclick = () => { if (!confirm(`Arrêter la série ? Elle s'arrête à ${c.n}.`)) return; over(endRun(load(), true)); };
}

function answer(e) {
  const d = load(), c = d.cur; if (!c || !sel.length) return;
  const q = e.q, ok = sameSet(sel, q.a), picks = sel.slice();
  // enregistré tout de suite : recharger la page ne permet pas de rejouer cette question
  if (ok) {
    c.n++; d.total++;
    const k = recKey(c.subj, c.src);
    if (c.n > ((d.best[k] || {}).n || 0)) d.best[k] = { n: c.n, at: Date.now() };
    const nx = drawQuestion(c.src, c.recent || []);
    c.recent = (c.recent || []).concat(nx.tpl).slice(-8);
    c.qid = nx.qid;
    save(d);
    reveal(e, picks, true, { n: c.n, prev: c.prev || 0 });
  } else {
    const r = endRun(d, false);
    reveal(e, picks, false, r);
  }
}

function corrHTML(q, open) {
  if (!q.e && !q.d) return '';
  return `<details class="corr"${open ? ' open' : ''}><summary>Correction</summary><div class="body">${q.e || ''}${q.d ? `<h4>À retenir</h4>${q.d}` : ''}</div></details>`;
}

function reveal(e, picks, ok, info) {
  const q = e.q, multi = !!q.multi;
  const choices = q.c.map((x, i) => {
    let cls = 'ch' + (multi ? ' multi' : '');
    if (q.a.includes(i)) cls += ' good'; else if (picks.includes(i)) cls += ' wrongpick';
    return `<button type="button" class="${cls}" disabled><span class="lt">${LET[i]}</span><span class="tx">${x}</span>${picks.includes(i) ? '<span class="tag">toi</span>' : ''}</button>`;
  }).join('');
  const justBeat = ok && info.prev > 0 && info.n === info.prev + 1;
  let verdict;
  if (ok) {
    const p = info.n > info.prev ? (info.prev ? `Record battu : l'ancien était ${info.prev}. Chaque bonne réponse le fait encore monter.` : 'Première série : chaque bonne réponse fait monter ton record.')
      : info.prev === info.n ? 'Tu égales ton record : encore une pour le battre.' : `Encore ${info.prev - info.n + 1} pour battre ton record (${info.prev}).`;
    verdict = `<div class="verdict ${justBeat ? 'record' : 'win'}" role="status"><h3>${justBeat ? `Nouveau record : ${info.n} d'affilée !` : `Juste ! ${info.n} d'affilée.`}</h3><p>${p}</p></div>`;
  } else {
    const p = info.rec ? (info.prev ? `C'est quand même ton nouveau record (l'ancien était ${info.prev}).` : `C'est ton premier record.`) : `Ton record reste ${info.prev}.`;
    verdict = `<div class="verdict lose" role="status"><h3>Raté : la série s'arrête à ${info.n}.</h3><p>${info.n ? p + ' ' : ''}Lis la correction ci-dessous avant de relancer.</p></div>`;
  }
  app.innerHTML = `
    <div class="hud">
      <div class="count"><b id="cnt" class="${ok ? 'pop' : ''}">${ok ? info.n : info.n}</b><span>d'affilée</span></div>
      <span class="sp"></span>
      <span class="chip">${esc(themeName(e.theme))}</span>
    </div>
    ${verdict}
    <section class="card qcard">
      ${e.ctxText ? `<div class="qctx">${e.ctxText}</div>` : ''}
      <div class="qtext">${q.q || ''}</div>
      ${multi ? '<span class="multi-hint">♣ Il fallait cocher toutes les bonnes réponses.</span>' : ''}
      <div class="choices">${choices}</div>
      ${corrHTML(q, !ok)}
      <div class="actions">${ok
        ? '<button type="button" class="btn btn-ghost" id="quit">Arrêter la série</button><button type="button" class="btn btn-primary btn-lg" id="next">Question suivante</button>'
        : '<button type="button" class="btn" id="back">Retour</button><button type="button" class="btn btn-primary btn-lg" id="again">Nouvelle série</button>'}</div>
    </section>`;
  typeset(app);
  window.scrollTo(0, 0);
  if (ok) {
    $('#next').onclick = () => play();
    $('#next').focus({ preventScroll: true });
    $('#quit').onclick = () => { const cur = load().cur; if (!cur || !confirm(`Arrêter la série ? Elle s'arrête à ${cur.n}.`)) return; over(endRun(load(), true)); };
  } else {
    $('#again').onclick = () => start();
    $('#back').onclick = () => home();
  }
}

// écran de fin (après un arrêt volontaire)
function over(r) {
  app.innerHTML = `<section class="card end">
    <p class="eyebrow">Série terminée</p>
    <div class="big">${r.n}</div>
    <h2>${r.rec ? 'Nouveau record !' : r.n ? 'Bien joué.' : 'Série vide.'}</h2>
    <p class="sub">${r.rec ? (r.prev ? `Ancien record : ${r.prev}.` : `C'est ton premier record.`) : `Ton record : ${r.prev || 0}.`}</p>
    <div class="row"><button type="button" class="btn" id="back">Retour</button><button type="button" class="btn btn-primary btn-lg" id="again">Nouvelle série</button></div>
  </section>`;
  $('#again').onclick = () => start();
  $('#back').onclick = () => home();
}

/* Données arrivées d'un autre appareil (record, série en cours) : on rafraîchit l'accueil du mode */
function wireAccount() {
  const A = window.SiteAccount; if (!A) return;
  A.on('data', keys => { if (keys.includes(KEY) && !$('.qcard')) home(); });
  A.on('change', () => { if (!$('.qcard')) home(); });
}
if (window.SiteAccount) wireAccount(); else window.addEventListener('siteaccount', wireAccount, { once: true });

/* Entrée : la touche Entrée valide puis passe à la question suivante */
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.target.closest('a,button,input,textarea,summary')) return;
  const b = $('#ok:not(:disabled)') || $('#next'); if (b) { ev.preventDefault(); b.click(); }
});

async function boot() {
  try { await loadQuestions(); }
  catch (e) { console.error(e); app.innerHTML = `<section class="card"><h2>Questions indisponibles</h2><p class="sub">${esc(e.message)}</p><div class="start"><button type="button" class="btn btn-primary" onclick="location.reload()">Réessayer</button></div></section>`; return; }
  home();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
